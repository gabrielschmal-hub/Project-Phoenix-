<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#14120C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phoenix">
<title>Phoenix</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root{
    /* Palette sampled directly from the reference render:
       ground #020F1F, chrome #031322, accent #D37736. */
    --bg:#020F1F; --card:#08192B; --card2:#0C2137; --line:#14304A; --line2:#1E4462;
    --ink:#E7EEF6; --inkMed:#C4D2DF; --inkLight:#94A8BA; --inkFade:#6B8299; --inkGhost:#47596C;
    --gold:#D37736; --green:#3FBF77; --greenSoft:#4ADE80; --greenBg:rgba(63,191,119,.13);
    --red:#D9534F; --redSoft:#F2603C; --redBg:rgba(217,83,79,.13);
    --amber:#D8A24A; --amberBg:rgba(216,162,74,.13);
    --rail:#010A15; --railHi:#04162A; --railLine:#0E2942; --railInk:#9FB4C7; --railInkDim:#5E748A;
    --railActive:#D37736;
    --serif:Georgia,'Times New Roman',serif;
    --mono:'Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden;}

  /* ---------- floating collapsible nav (Apple-OS bubble) ---------- */
  .app{display:block;height:100vh;height:100dvh;position:relative;}
  .navbtn{position:fixed;top:calc(env(safe-area-inset-top) + 11px);left:16px;z-index:300;
          width:44px;height:44px;border-radius:14px;background:var(--rail);border:1px solid var(--railLine);
          display:flex;align-items:center;justify-content:center;cursor:pointer;
          box-shadow:0 4px 16px rgba(20,18,12,.28);transition:transform .18s ease,background .18s;}
  .navbtn:hover{background:var(--railHi);}
  .navbtn:active{transform:scale(.94);}
  .navbtn svg{width:22px;height:22px;}
  .navpanel{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:16px;z-index:299;
            width:210px;background:rgba(255,253,250,.98);border:1px solid var(--line2);border-radius:20px;
            padding:10px;box-shadow:0 12px 40px rgba(20,18,12,.18);
            -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
            transform:translateY(-8px) scale(.97);opacity:0;pointer-events:none;
            transform-origin:top left;transition:transform .2s cubic-bezier(.2,.8,.3,1),opacity .18s;}
  .navpanel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .navpanel .ph-head{padding:8px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .navpanel .ph-head .mark{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.3px;}
  .navpanel .ph-head .mark .dot{color:var(--gold);}
  .navpanel .ph-head .sub{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--inkFade);text-transform:uppercase;margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;border-radius:11px;
            font-family:var(--mono);font-size:12px;letter-spacing:.4px;color:var(--inkMed);
            user-select:none;transition:background .12s,color .12s;}
  .nav-item .ico{width:15px;text-align:center;font-size:13px;opacity:.7;}
  .nav-item:hover{background:var(--card2);color:var(--ink);}
  /* active page: strong gold fill, clearly distinct from cream/white */
  .nav-item.active{background:var(--gold);color:#FFFDF8;box-shadow:0 2px 8px rgba(211,119,54,.38);}
  .nav-item.active .ico{opacity:1;}
  .nav-item.soon{color:var(--inkGhost);cursor:default;}
  .nav-item.soon:hover{background:transparent;color:var(--inkGhost);}
  .nav-item.soon .tag{margin-left:auto;font-size:7px;letter-spacing:1px;color:var(--inkFade);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;}
  .navscrim{position:fixed;inset:0;z-index:298;background:transparent;display:none;}
  .navscrim.show{display:block;}

  .main{display:flex;flex-direction:column;overflow:hidden;height:100vh;height:100dvh;min-width:0;}
  .topbar{display:flex;align-items:center;gap:14px;background:var(--card);border-bottom:1px solid var(--line2);
          padding:0 20px 0 74px;padding-top:env(safe-area-inset-top);min-height:66px;flex-shrink:0;}
  .tb-brand{display:flex;flex-direction:column;justify-content:center;}
  .tb-brand .mk{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.3px;line-height:1;}
  .tb-brand .mk .dot{color:var(--gold);}
  .navbtn svg{filter:drop-shadow(0 2px 8px rgba(211,119,54,.35));}
  .tb-sec{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--inkFade);text-transform:uppercase;margin-top:3px;}
  .topbar .spacer{flex:1;}
  .topbar .asof{font-family:var(--mono);font-size:9px;color:var(--inkFade);letter-spacing:.5px;}
  .topbar .acct{font-family:var(--mono);font-size:10.5px;color:var(--ink);background:var(--card2);border:1px solid var(--line2);border-radius:4px;padding:4px 8px;}

  .page-host{flex:1;overflow:hidden;min-height:0;}
  .page{display:none;height:100%;}
  .page.active{display:block;}
  .page.pad{padding:18px 20px;overflow-y:auto;}

  /* SCROLLABLE stack — the page breathes and scrolls instead of cramming one screen. */
  .mkt-grid{display:flex;flex-direction:column;height:100%;gap:16px;padding:16px 18px 40px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  /* a "row" holds one or more tiles side by side */
  .mkt-row{display:grid;gap:16px;}
  .mkt-row.r-2{grid-template-columns:1.55fr 1fr;}
  .mkt-row.r-2e{grid-template-columns:1fr 1fr;}
  .mkt-row.r-1{grid-template-columns:1fr;}
  /* generous tiles: more padding, room for a hero number to stand out */
  .mkt-grid .tile{min-height:0;padding:16px 18px;}
  /* Tiles size to content now — the plot tiles get their height from the tbody
     rule above, text tiles hug their content, so no forced empty space. */
  .mkt-grid .tile.a-sector,.mkt-grid .tile.a-top{min-height:0;}
  .mkt-grid .tile.a-ind{min-height:0;}
  .a-assets{width:100%;}
  /* The Board */
  .board-grp{font-family:var(--mono);font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--inkFade);padding:11px 0 5px;}
  .board-grp:first-child{padding-top:2px;}
  .board-hd,.board-row{display:grid;grid-template-columns:1fr 110px 110px 92px;gap:8px;align-items:baseline;}
  .board-hd{font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--inkFade);padding-bottom:6px;border-bottom:1px solid var(--line2);}
  .board-row{padding:8px 0;border-bottom:1px solid var(--line);}
  .board-row .nm{font-size:14px;color:var(--ink);}
  .board-row .v{font-family:var(--mono);font-size:14px;text-align:right;}
  .board-row .c{font-family:var(--mono);font-size:13px;text-align:right;}
  .board-row .p{font-family:var(--mono);font-size:13px;text-align:right;font-weight:700;}
  /* the brief */
  .brf-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:13px;}
  .brf-ttl{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink);}
  .brf-sub{font-family:var(--mono);font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--inkFade);}
  .brf-block{border-left:3px solid var(--gold);background:var(--card2);border-radius:0 8px 8px 0;padding:13px 16px 15px;margin-bottom:13px;}
  .brf-block.wk{border-left-color:#7a3b2e;}
  .brf-k{font-family:var(--mono);font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--inkFade);margin-bottom:7px;}
  .brf-p{font-size:15px;line-height:1.72;color:var(--ink);font-style:italic;}
  .brf-p b{font-style:normal;font-weight:700;}
  .brf-p .hl{font-style:normal;font-weight:700;}
  .brief-lead{font-size:15.5px;line-height:1.6;color:var(--ink);}
  .brief-lead b{font-weight:700;}
  .brief-sec{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--inkLight);}
  .brief-sec .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--inkFade);display:block;margin-bottom:3px;}
  .brief-watch{background:rgba(211,119,54,.10);border:1px solid rgba(211,119,54,.38);border-radius:7px;padding:10px 13px;margin-top:11px;font-size:13.5px;line-height:1.6;}
  .brief-watch .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:4px;}
  .gex-histo{position:relative;height:250px;width:100%;margin-top:10px;}
  @media(max-width:700px){
    .board-hd,.board-row{grid-template-columns:1fr 84px 78px;}
    .board-hd span:nth-child(3),.board-row .c{display:none;}
  }
  .mkt-grid .tile.a-smart{flex-shrink:0;overflow:visible;}
  /* section eyebrow + hero number treatment (Winston-like emphasis, our colors) */
  .mkt-hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 4px;}
  .mkt-hero .hn{font-family:var(--mono);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.5px;color:var(--ink);}
  .mkt-hero .hc{font-family:var(--mono);font-size:15px;font-weight:700;}
  .mkt-hero .hu{font-family:var(--mono);font-size:10px;color:var(--inkFade);text-transform:uppercase;letter-spacing:1px;}
  .mkt-standout{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--inkMed);
    background:var(--card2);border-left:2px solid var(--gold);border-radius:0 5px 5px 0;padding:8px 12px;margin-top:10px;}
  .mkt-standout b{color:var(--ink);}
  .mkt-standout.up{border-left-color:var(--green);}
  .mkt-standout.down{border-left-color:var(--red);}
  /* Industry on Markets: roomier rows, bigger values than the cramped screener version */
  #mIndList{overflow:visible;height:auto;margin-top:6px;}
  #mIndList .ind-row{grid-template-columns:1fr 140px 68px;gap:12px;padding:6px 0;font-size:12px;
    border-bottom:1px solid var(--line);}
  #mIndList .ind-row:last-child{border-bottom:none;}
  #mIndList .ind-bar-wrap{height:16px;border-radius:3px;}
  #mIndList .ind-val{font-size:12.5px;}
  #mIndList .ind-row{cursor:pointer;}
  .ind-caret{color:var(--inkGhost);font-size:11px;margin-right:6px;display:inline-block;transition:transform .15s;}
  #mIndList .ind-row.exp .ind-caret{transform:rotate(90deg);color:var(--gold);}
  .ind-exp{background:var(--card2);border-radius:7px;margin:4px 0 10px;padding:12px 14px;animation:scrExpIn .18s ease;}
  .ind-exp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.6px;text-transform:uppercase;}
  .ind-exp-hint{color:var(--inkGhost);text-transform:none;letter-spacing:0;font-size:9.5px;}
  .ind-exp-empty{font-family:var(--serif);font-size:12px;color:var(--inkLight);padding:6px 0;}
  .ind-stk{display:grid;grid-template-columns:1.4fr 62px 40px 40px 52px 60px;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;cursor:pointer;border-radius:4px;transition:background .1s;}
  .ind-stk:hover{background:var(--card);}
  .ind-stk:last-child{border-bottom:none;}
  .ind-stk-hdr{font-size:8.5px;color:var(--inkFade);text-transform:uppercase;letter-spacing:.5px;cursor:default;padding-bottom:4px;}
  .ind-stk-hdr:hover{background:none;}
  .ind-stk .is-tk{font-weight:700;color:var(--ink);font-size:13px;}
  .ind-stk .is-cap,.ind-stk .is-sc{text-align:right;color:var(--inkMed);}
  .ind-stk .is-comp,.ind-stk .is-day{text-align:right;font-weight:700;}
  /* asset band: auto-scrolling marquee */
  .asset-band{overflow:hidden;position:relative;width:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);}
  .marquee-track{display:flex;gap:8px;width:max-content;animation:marquee 48s linear infinite;}
  .asset-band:hover .marquee-track{animation-play-state:paused;}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .asset-cell{flex:0 0 auto;min-width:132px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 13px;
              display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;}
  .asset-cell .an{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--inkFade);text-transform:uppercase;}
  .asset-cell .av{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);line-height:1.1;}
  .asset-cell .ac{font-family:var(--mono);font-size:10px;font-weight:700;}
  .asset-cell .accent{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:11px 13px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .mkt-grid .thead .ttl{font-size:11px;letter-spacing:1.2px;}
  .mkt-grid .thead{margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line);}
  .tile > .thead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-shrink:0;}
  .tile .ttl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;}
  .tile .tnote{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--inkFade);letter-spacing:.5px;}
  .tile .tbody{flex:1;min-height:0;position:relative;}
  /* ── SCROLLABLE MARKETS: content-flow model ──────────────────────────
     The base .tbody uses position:relative + flex:1 (needed for the OLD fixed
     grid where plots filled via position:absolute:inset:0). In the scrollable
     stack that collapses text tiles to zero height, so their content overlaps.
     Fix: on Markets, EVERY tbody flows naturally and grows to fit its content,
     and every inner list drops height:100%. Plots are re-pinned explicitly. */
  .mkt-grid .tile .tbody{position:static;display:flex;flex-direction:column;
    flex:none;height:auto;min-height:0;overflow:visible;}
  .mkt-grid .sec-list,.mkt-grid .top-list,.mkt-grid .ind-list,
  .mkt-grid #mIndList,.mkt-grid #secList,.mkt-grid #topList,.mkt-grid #smMktList{height:auto;overflow:visible;}
  /* SPX + VIX are the only plot tiles: give the plot a real box to draw into */
  .mkt-grid .tile.a-spx .tbody{position:relative;height:420px;}
  .mkt-grid .tile.a-vix .tbody{position:relative;height:230px;}
  .mkt-grid .tile.a-spx .plot,.mkt-grid .tile.a-vix .plot{position:absolute;inset:0;}
  /* NOTE: the old .a-spx/.a-regime/.a-gex/etc grid-area rules were REMOVED here.
     Markets is now a flex column of .mkt-row grids; those grid-area:<name> rules
     set grid-column:<name> on each tile, placing them in nonexistent named lines,
     which crammed regime+gex into one implicit right-hand column (regime hidden
     behind gex). The .a-* classes remain only as render targets, no grid-area. */
  .plot{position:absolute;inset:0;}
  /* SPX hero header: big price + change, with scrub readout */
  .spx-hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;flex-shrink:0;}
  .spx-px{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);line-height:1;}
  .spx-chg{font-family:var(--mono);font-size:13px;font-weight:700;}
  .spx-hover{font-family:var(--mono);font-size:9.5px;color:var(--inkMed);flex-basis:100%;min-height:12px;letter-spacing:.2px;}
  .spx-hover .hk{color:var(--gold);font-weight:700;margin-right:4px;}
  /* zoom controls, bottom-right of the chart */
  .spx-zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;z-index:5;}
  .spx-zoom button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);
                   background:rgba(250,247,242,.92);color:var(--ink);font-family:var(--mono);
                   font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
                   box-shadow:0 1px 4px rgba(20,18,12,.12);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .spx-zoom button:active{transform:scale(.92);background:var(--card2);}

  .rg-name{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.05;margin-bottom:5px;}
  .rg-desc{font-family:var(--serif);font-size:11.5px;color:var(--inkMed);line-height:1.45;}
  .rg-conf{font-family:var(--mono);font-size:9px;color:var(--inkLight);margin-top:7px;}
  .rg-inputs{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding-top:8px;}
  /* content-sized tiles have no slack for margin-top:auto, so guarantee a gap */
  .mkt-grid .tile.a-regime .rg-inputs{margin-top:14px;border-top:1px solid var(--line);}
  .rg-inp{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;}
  .rg-inp .k{color:var(--inkFade);} .rg-inp .v{font-weight:700;}

  .gex-hero{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .gex-net{font-family:var(--mono);font-size:22px;font-weight:700;}
  .gex-reg{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:3px;}
  .gex-rows{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .gex-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10.5px;padding-bottom:4px;border-bottom:1px solid var(--line);}
  .gex-row .k{color:var(--inkLight);} .gex-row .v{font-weight:700;color:var(--ink);}
  .gex-row .sub{color:var(--inkFade);font-size:9px;margin-left:5px;}

  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;margin-left:auto;}
  .seg button{font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:3px 9px;border:none;background:var(--card);color:var(--inkLight);cursor:pointer;}
  .seg button.on{background:var(--gold);color:#fff;}
  .sec-list{overflow-y:auto;height:100%;}
  .sec-row{display:grid;grid-template-columns:34px 92px 1fr 48px;align-items:center;gap:8px;padding:2.5px 0;font-family:var(--mono);font-size:10px;}
  .sec-row .tk{font-weight:700;color:var(--ink);}
  .sec-row .nm{color:var(--inkLight);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sec-bar-wrap{position:relative;height:12px;background:var(--card2);border-radius:2px;overflow:hidden;}
  .sec-bar{position:absolute;top:0;bottom:0;}
  .sec-val{text-align:right;font-weight:700;}

  .top-list{overflow-y:auto;height:100%;}
  .top-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;}
  .top-row .tk{font-weight:700;color:var(--ink);}
  .top-row .ind{color:var(--inkFade);font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
  .top-row .sc{font-weight:700;text-align:right;}
  .chip{font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:3px;letter-spacing:.5px;}

  .cal-strip{display:flex;gap:8px;overflow-x:auto;height:100%;align-items:stretch;padding-bottom:2px;}
  .cal-card{flex:0 0 auto;min-width:118px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:5px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;}
  .cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;height:100%;overflow-y:auto;align-content:start;}
  .cal-grid .cal-card{min-width:0;}
  .cal-card.hi{border-left-color:var(--red);}
  .cal-card.med{border-left-color:var(--amber);}
  .cal-date{font-family:var(--mono);font-size:9px;color:var(--inkLight);letter-spacing:.5px;}
  .cal-evt{font-family:var(--serif);font-size:12px;font-weight:700;color:var(--ink);line-height:1.2;}
  .cal-in{font-family:var(--mono);font-size:8.5px;color:var(--inkFade);margin-top:auto;}

  .loading{font-family:var(--serif);font-size:12px;color:var(--inkLight);padding:14px 2px;text-align:center;}
  .err{font-family:var(--serif);font-size:11.5px;color:var(--red);line-height:1.5;padding:10px 2px;}
  .err .fix{color:var(--inkMed);font-size:10px;margin-top:4px;}

  .page-head{margin-bottom:18px;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .page-title{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);margin:0 0 5px;}
  .soon-panel{font-family:var(--serif);font-size:14px;color:var(--inkLight);line-height:1.65;background:var(--amberBg);border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:6px;padding:20px 22px;max-width:64ch;}
  .soon-panel h3{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--amber);text-transform:uppercase;margin:0 0 10px;}
  .soon-panel .need{font-family:var(--mono);font-size:11px;color:var(--inkLight);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}

  /* ===== SCREENER page ===== */
  /* v2 two-book toggle (PHOENIX_REVIEW Part 3) */
  .scr-books{display:flex;gap:0;margin-bottom:10px;flex-shrink:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden;width:fit-content;}
  .scr-book{font-family:var(--mono);font-size:11px;letter-spacing:.4px;padding:7px 16px;background:var(--card);color:var(--inkLight);border:none;cursor:pointer;border-right:1px solid var(--line2);}
  .scr-book:last-child{border-right:none;}
  .scr-book.on{background:var(--gold);color:#141210;font-weight:700;}
  .scr-book:active{transform:scale(.98);}
  /* promotion watch */
  .promo-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--line);flex-shrink:0;}
  .promo-head .ttl2{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;}
  .promo-head .n{font-family:var(--mono);font-size:10px;color:var(--inkFade);}
  .promo-row{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:8px;}
  .promo-row.elig{border-color:var(--green);}
  .promo-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .promo-top .tk{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);}
  .promo-badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;padding:3px 8px;border-radius:4px;text-transform:uppercase;}
  .promo-badge.ok{background:var(--greenBg);color:var(--green);}
  .promo-badge.no{background:var(--card);color:var(--inkFade);border:1px solid var(--line2);}
  .promo-checks{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;}
  .promo-chk{font-family:var(--mono);font-size:8.5px;padding:2px 7px;border-radius:3px;}
  .promo-chk.y{background:var(--greenBg);color:var(--green);}
  .promo-chk.x{background:var(--redBg);color:var(--red);}
  .promo-note{font-family:var(--mono);font-size:9px;color:var(--inkFade);line-height:1.45;}
  .promo-empty{font-family:var(--mono);font-size:10px;color:var(--inkFade);padding:6px 0;line-height:1.5;}
  .scr-grid{display:grid;height:100%;gap:14px;padding:16px 18px;grid-template-columns:2.4fr 1fr;
    grid-template-areas:"screener picks";overflow:hidden;}
  .a-screener{grid-area:screener;} .a-picks{grid-area:picks;}
  .scr-grid .tile{padding:16px 18px;}
  .ind-list{overflow-y:auto;height:100%;}
  .ind-row{display:grid;grid-template-columns:1fr 92px 52px;align-items:center;gap:8px;padding:3px 0;font-family:var(--mono);font-size:10.5px;}
  .ind-row .nm{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ind-bar-wrap{position:relative;height:13px;background:var(--card2);border-radius:2px;overflow:hidden;}
  .ind-bar{position:absolute;top:0;bottom:0;}
  .ind-val{text-align:right;font-weight:700;}
  /* preset chips row — Winston's presets, our labels + palette */
  .scr-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;flex-shrink:0;}
  .scr-preset{font-family:var(--mono);font-size:11px;letter-spacing:.4px;padding:7px 14px;border:1px solid var(--line2);
    border-radius:20px;background:var(--card);color:var(--inkMed);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;}
  .scr-preset:hover{border-color:var(--gold);color:var(--ink);}
  .scr-preset.on{background:var(--gold);color:#FFFDF8;border-color:var(--gold);}
  .scr-preset .ic{font-size:12px;}
  /* filter bar — bigger, cleaner */
  .scr-controls{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-shrink:0;flex-wrap:wrap;}
  .scr-search{flex:1;min-width:180px;font-family:var(--mono);font-size:13px;padding:9px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--card2);color:var(--ink);}
  .scr-search::placeholder{color:var(--inkFade);}
  .scr-sel{font-family:var(--mono);font-size:11px;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--card2);color:var(--inkMed);cursor:pointer;max-width:150px;}
  /* Winston-style table: bigger text, taller rows, breathing room */
  .scr-table{overflow-y:auto;height:100%;}
  .scr-th,.scr-tr{display:grid;grid-template-columns:34px 2fr 82px 66px 52px 52px 72px 76px;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;}
  .scr-th{position:sticky;top:0;background:var(--card);color:var(--inkFade);font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:8px 0;border-bottom:1px solid var(--line2);z-index:2;}
  .scr-th span{cursor:pointer;}
  .scr-th span:hover{color:var(--gold);}
  .scr-tr{padding:11px 0;border-bottom:1px solid var(--line);transition:background .1s;}
  .scr-tr:hover{background:var(--card2);}
  .scr-tr .rk{color:var(--inkFade);font-size:11px;text-align:center;}
  .scr-tr .nmcell{overflow:hidden;}
  .scr-tr .tk{font-weight:700;color:var(--ink);font-size:15px;}
  .scr-tr .nm{color:var(--inkLight);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px;}
  .scr-tr .num{text-align:right;font-size:13px;}
  .scr-tr.nearmiss{opacity:.55;}
  .scr-tr.nearmiss .tk::after{content:" \25CB";color:var(--amber);font-size:10px;}
  /* the signature SCORE PILL (Winston's colored badge) */
  .scr-pill{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 10px;border-radius:14px;
    font-family:var(--mono);font-size:14px;font-weight:800;letter-spacing:-.3px;}
  .scr-pill.s-hi{background:var(--greenBg);color:var(--green);}
  .scr-pill.s-mid{background:var(--amberBg);color:var(--amber);}
  .scr-pill.s-lo{background:var(--card2);color:var(--inkFade);}
  .scr-acts{display:flex;gap:5px;justify-content:flex-end;}
  .scr-acts button{font-family:var(--mono);font-size:10px;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--card2);color:var(--inkMed);cursor:pointer;letter-spacing:.3px;}
  .scr-acts button:active{transform:scale(.94);}
  .scr-acts button.added{background:var(--greenBg);color:var(--green);border-color:var(--greenSoft);}
  .lblchip{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.3px;}
  /* expandable row preview (Winston-style, our real data) */
  .scr-tr{cursor:pointer;}
  .scr-tr .tk-arrow{color:var(--inkGhost);font-size:11px;margin-left:5px;transition:transform .15s;}
  .scr-tr.exp .tk-arrow{transform:rotate(90deg);color:var(--gold);}
  .scr-exp{background:var(--card2);border-bottom:1px solid var(--line);padding:16px 20px 18px;
    display:grid;grid-template-columns:1fr 1fr;gap:22px;animation:scrExpIn .18s ease;}
  @keyframes scrExpIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .scr-exp-col h6{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--gold);
    text-transform:uppercase;margin:0 0 11px;}
  /* score bars */
  .scr-bar-row{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:10px;margin-bottom:8px;}
  .scr-bar-row .bl{font-family:var(--serif);font-size:13px;color:var(--inkMed);}
  .scr-bar-track{height:8px;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .scr-bar-fill{height:100%;border-radius:3px;}
  .scr-bar-row .bv{font-family:var(--mono);font-size:12px;font-weight:700;text-align:right;color:var(--ink);}
  /* key metrics grid */
  .scr-met{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;}
  .scr-met .mk{font-family:var(--serif);font-size:13px;color:var(--inkLight);}
  .scr-met .mv{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);text-align:right;}
  .scr-exp-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
    margin-top:4px;padding-top:12px;border-top:1px solid var(--line);}
  .scr-full-link{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold);cursor:pointer;letter-spacing:.4px;}
  .scr-full-link:hover{text-decoration:underline;}
  .scr-exp-loading{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--inkFade);padding:8px 0;}
  .picks-scroll{overflow-y:auto;height:100%;display:flex;flex-direction:column;gap:8px;}
  .pick{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;}
  .pick-head{display:flex;align-items:baseline;gap:8px;cursor:pointer;}
  .pick-head .tk{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);}
  .pick-head .ind{font-family:var(--mono);font-size:8.5px;color:var(--inkFade);}
  .pick-head .px{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);}
  .pick-head .exp{font-family:var(--mono);font-size:11px;color:var(--gold);}
  .pick-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
  .pl{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:5px 7px;text-align:center;}
  .pl .k{font-family:var(--mono);font-size:7.5px;color:var(--inkFade);text-transform:uppercase;letter-spacing:.4px;}
  .pl .v{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:2px;}
  .thesis{margin-top:8px;font-family:var(--serif);font-size:11.5px;color:var(--inkMed);line-height:1.5;}
  .thesis h5{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin:8px 0 3px;}
  .thesis .gen{font-family:var(--mono);font-size:10px;color:var(--inkLight);padding:8px 0;}
  .thesis-btn{margin-top:8px;font-family:var(--mono);font-size:10px;padding:6px 12px;border:1px solid var(--gold);border-radius:6px;background:var(--card);color:var(--gold);cursor:pointer;width:100%;}
  .thesis-btn:active{transform:scale(.98);}
  .thesis-btn:disabled{opacity:.5;cursor:default;}
  .watch-grid{display:grid;height:100%;gap:10px;padding:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:min-content;overflow-y:auto;align-content:start;}
  .watch-card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px 14px;}
  .watch-card.clickable{cursor:pointer;transition:border-color .12s,transform .08s;}
  .watch-card.clickable:hover{border-color:var(--gold);}
  .watch-card.clickable:active{transform:scale(.99);}

  /* ===== RESEARCH PRODUCT PAGE ===== */
  .rp-wrap{height:100%;display:flex;flex-direction:column;overflow:hidden;}
  .rp-top{display:flex;align-items:flex-start;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-shrink:0;flex-wrap:wrap;}
  .rp-back{font-family:var(--mono);font-size:10px;color:var(--gold);cursor:pointer;padding:4px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--card2);align-self:center;}
  .rp-id{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .rp-id .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .rp-id .tk{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);line-height:1;}
  .rp-id .px{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink);}
  .rp-id .chg{font-family:var(--mono);font-size:12px;font-weight:700;}
  .rp-id .r2{font-family:var(--mono);font-size:9px;color:var(--inkFade);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .rp-id .exch{padding:1px 6px;border:1px solid var(--line2);border-radius:3px;color:var(--inkMed);}
  .rp-stats{margin-left:auto;display:flex;gap:16px;align-items:center;}
  .rp-stat{text-align:right;}
  .rp-stat .k{font-family:var(--mono);font-size:8px;color:var(--inkFade);text-transform:uppercase;letter-spacing:.5px;}
  .rp-stat .v{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);}

  .rp-body{flex:1;display:grid;grid-template-columns:300px 1fr;gap:10px;padding:10px 12px;overflow:hidden;min-height:0;}
  .rp-thesis{overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:14px 16px;}
  .rp-thesis h4{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin:0 0 8px;}
  .rp-thesis .summary{font-family:var(--serif);font-size:12px;color:var(--inkMed);line-height:1.55;margin-bottom:12px;}
  .rp-thesis h5{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin:12px 0 3px;}
  .rp-thesis .gen{font-family:var(--mono);font-size:10px;color:var(--inkLight);padding:8px 0;}
  .rp-thesis-btn{margin-top:10px;font-family:var(--mono);font-size:10px;padding:7px 12px;border:1px solid var(--gold);border-radius:6px;background:var(--card);color:var(--gold);cursor:pointer;width:100%;}
  .rp-connections{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .rp-conn-ph{font-family:var(--mono);font-size:9px;color:var(--inkFade);line-height:1.5;background:var(--amberBg);border:1px solid var(--line2);border-left:2px solid var(--amber);border-radius:5px;padding:8px 10px;}

  .rp-right{display:grid;grid-template-rows:1.5fr 1fr;gap:10px;overflow:hidden;min-height:0;}
  .rp-chart-tile{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .rp-chart-body{flex:1;position:relative;min-height:0;}
  .rp-lower{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;overflow:hidden;min-height:0;}
  .rp-tile{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .rp-tile .tt{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;flex-shrink:0;}
  .rp-tile .tbody2{flex:1;overflow-y:auto;min-height:0;}
  .fin-row{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;font-family:var(--mono);font-size:9.5px;padding:3px 0;border-bottom:1px solid var(--line);}
  .fin-row .q{color:var(--inkFade);}
  .fin-row .v{text-align:right;font-weight:700;}
  .fin-head{color:var(--inkFade);font-size:8px;text-transform:uppercase;}
  .rate-bar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line);}
  .rate-seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:#fff;}
  .rate-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;padding:2px 0;}
  .rate-row .k{color:var(--inkLight);}
  .earn-big{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .earn-lbl{font-family:var(--mono);font-size:8.5px;color:var(--inkFade);text-transform:uppercase;letter-spacing:.5px;}
  .earn-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;padding:3px 0;border-bottom:1px solid var(--line);}
  /* Winston-style financials */
  .fin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
  .fin-card{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
  .fin-card .fc-k{font-family:var(--mono);font-size:10px;color:var(--inkLight);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;font-weight:700;}
  .fin-card .fc-v{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1.05;}
  .fin-card .fc-s{font-family:var(--mono);font-size:10px;color:var(--inkFade);margin-top:4px;}
  .fin-sub{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px;}
  .finbar-v{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--inkLight);text-align:center;margin-bottom:3px;white-space:nowrap;}
  .finbar-q{flex:1;font-family:var(--mono);font-size:9px;color:var(--inkFade);text-align:center;overflow:hidden;}
  .fin-2up{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .fin-ladder{padding-top:10px;margin-top:8px;border-top:1px solid var(--line);}
  .rate-bar2{display:flex;height:12px;border-radius:4px;overflow:hidden;margin-bottom:8px;background:var(--card2);}
  .rate-bar2>div{height:100%;}
  .rate-legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;}
  .rate-legend .rate-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;padding:2px 0;}
  .rate-legend .rate-row .k{color:var(--inkLight);display:flex;align-items:center;}
  .rate-legend .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;}
  .rate-target{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;}
  .rate-target .rt-k{font-family:var(--mono);font-size:7.5px;color:var(--inkFade);text-transform:uppercase;letter-spacing:.4px;}
  .rate-target .rt-v{font-family:var(--mono);font-size:15px;font-weight:700;}
  .earn-hero{margin-bottom:10px;}
  .earn-fresh{background:rgba(166,124,0,.1);border:1px solid var(--gold);border-radius:6px;padding:8px 10px;margin:8px 0;}
  .earn-fresh .ef-k{font-family:var(--mono);font-size:7.5px;color:var(--gold);letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px;}
  .earn-facts{margin-top:8px;}
  @media(max-width:560px){.fin-2up{grid-template-columns:1fr;gap:8px;}.rate-legend{grid-template-columns:1fr;}}
  .earn-row .k{color:var(--inkLight);}
  .rp-seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;margin-left:auto;}
  .rp-seg button{font-family:var(--mono);font-size:9px;padding:3px 10px;border:none;background:var(--card);color:var(--inkLight);cursor:pointer;}
  .rp-seg button.on{background:var(--gold);color:#fff;}
  .watch-card .wc-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .watch-card .wc-tk{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);}
  .watch-card .wc-ind{font-family:var(--mono);font-size:8.5px;color:var(--inkFade);}
  .watch-card .wc-rm{margin-left:auto;font-family:var(--mono);font-size:8px;color:var(--red);cursor:pointer;border:1px solid var(--line2);border-radius:4px;padding:2px 5px;}
  .watch-card .wc-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;padding:2px 0;}
  .watch-card .wc-row .k{color:var(--inkFade);}
  .watch-empty{grid-column:1/-1;font-family:var(--serif);font-size:14px;color:var(--inkLight);text-align:center;padding:40px 20px;line-height:1.6;}
  .watch-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-shrink:0;}
  .watch-bar .exp{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:5px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--card2);color:var(--inkMed);cursor:pointer;}

  /* ===== TRADES (Plan / Open / History) ===== */

  /* council inside a tile */
  .pf-council-scroll{display:grid;grid-template-columns:1fr 1fr;gap:9px;overflow-y:auto;height:100%;align-content:start;}
  .pf-cm{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;}
  .pf-cm.wide{grid-column:1/-1;}
  .cm-h{display:flex;align-items:baseline;gap:7px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line);}
  .cm-seal{font-family:var(--serif);font-size:10px;font-weight:700;color:var(--gold);width:16px;}
  .cm-name{font-family:var(--serif);font-size:12.5px;font-weight:700;color:var(--ink);}
  .cm-role{font-family:var(--mono);font-size:6.5px;color:var(--inkFade);text-transform:uppercase;letter-spacing:.5px;margin-left:auto;}
  .cm-b{font-family:var(--serif);font-size:11px;line-height:1.6;color:var(--inkMed);}
  .cm-b b{color:var(--ink);}
  .ch-b{font-family:var(--serif);font-size:11.5px;line-height:1.65;color:var(--inkMed);overflow-y:auto;height:100%;}
  .ch-b p{margin:0 0 8px;} .ch-b p:last-child{margin:0;} .ch-b b{color:var(--ink);}
  .pf-prose{font-family:var(--serif);font-size:11.5px;line-height:1.6;color:var(--inkMed);margin:0;}
  .pf-prose b{color:var(--ink);}
  /* rules line, like .tnote */
  .pf-rules-line{font-family:var(--mono);font-size:8px;color:var(--inkFade);letter-spacing:.4px;}
  .pf-toggle{font-family:var(--mono);font-size:8px;padding:2px 7px;border:1px solid var(--line2);
             border-radius:4px;background:var(--card2);color:var(--inkMed);cursor:pointer;letter-spacing:.5px;}
  .pf-toggle.on{background:var(--amberBg);color:var(--amber);border-color:var(--amber);}
  .pf-bal{font-family:var(--mono);font-size:9px;width:78px;padding:2px 5px;border:1px solid var(--line2);
          border-radius:4px;background:var(--card2);color:var(--ink);-webkit-appearance:none;}
  .pf-empty-t{font-family:var(--serif);font-size:12px;color:var(--inkLight);display:flex;align-items:center;
              justify-content:center;height:100%;text-align:center;line-height:1.6;padding:10px;}
  .pf-warn{font-family:var(--mono);font-size:8.5px;color:var(--red);background:var(--redBg);border-radius:4px;padding:4px 6px;margin-top:5px;}

  .rail-toggle{display:none;}
  .scrim{display:none;}
  @media (max-width:900px){
    .scr-grid{grid-template-columns:1fr;grid-template-areas:"screener" "industry" "picks";grid-template-rows:none;grid-auto-rows:minmax(280px,auto);overflow-y:auto;}
    .watch-grid{grid-template-columns:1fr;}
    .app{grid-template-columns:1fr;}
    .rail{position:fixed;left:0;top:0;bottom:0;width:200px;z-index:200;transform:translateX(-100%);transition:transform .2s ease;}
    .rail.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.3);}
    .rail-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--card2);border:1px solid var(--line2);border-radius:6px;font-size:16px;color:var(--ink);cursor:pointer;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,18,12,.4);z-index:150;}
    .mkt-grid{padding:12px 12px 40px;gap:12px;}
    .mkt-row.r-2,.mkt-row.r-2e{grid-template-columns:1fr;}
    .mkt-grid .tile.feature{min-height:300px;}
    .mkt-hero .hn{font-size:28px;}
    .pf-grid{padding:10px 10px 60px;}
    .pf-strip{grid-template-columns:1fr 1fr;}
    .pf-mgrid{grid-template-columns:repeat(2,1fr);}
    .pf-council-scroll{grid-template-columns:1fr;}
    .asset-band{min-height:0;}
    .a-assets{grid-row:auto;min-height:0 !important;height:auto !important;}
    .mkt-grid .asset-band{min-height:0;}
    .topbar .asof{display:none;}
    .page-title{font-size:24px;}
  }

#veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(7,10,14,.30) 0%,rgba(7,10,14,0) 20%,rgba(7,10,14,0) 66%,rgba(7,10,14,.10) 90%,rgba(7,10,14,.42) 100%)}
.pxhidden{display:none!important}
.app{position:relative;z-index:5;display:block;height:auto}

#pxnav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:26px;padding:20px 30px;
  transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .35s ease;background:linear-gradient(180deg,rgba(8,11,15,.78),rgba(8,11,15,0))}
#pxnav.hide{transform:translateY(-130%);opacity:0;pointer-events:none}
.pxbrand svg{width:44px;height:34px;display:block}
.pxlinks{display:flex;align-items:center;gap:30px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.pxlinks::-webkit-scrollbar{display:none}
.pxlinks a{font-size:15px;color:#B9BFC7;padding:6px 0 10px;position:relative;white-space:nowrap;text-decoration:none;cursor:pointer}
.pxlinks a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#E8792B;transform:scaleX(0);transition:transform .3s}
.pxlinks a.on{color:#E8792B}
.pxlinks a.on::after{transform:scaleX(1)}
.pxaccts{display:flex;gap:10px}
.pxacct{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:14px;color:#EDEEF0;cursor:pointer}
.pxacct.on{border-color:#E8792B;color:#E8792B}

.pxs{height:calc(100vh - 78px);position:relative;scroll-snap-align:start}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
.page-host{overflow:visible!important;height:auto!important;flex:none!important}
.page{display:block!important;height:calc(100vh - 78px);padding-top:68px;box-sizing:border-box;scroll-snap-align:start}
.page.pad{overflow-y:auto}

.pxhero{display:flex;flex-direction:column;justify-content:center;padding:90px 34px 30px;box-sizing:border-box}
.hero-row{display:grid;grid-template-columns:1fr minmax(320px,560px) 1fr;gap:28px;align-items:center;max-width:1400px;margin:0 auto;width:100%}
.pxcard{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.085);border-radius:14px;padding:22px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.side{max-width:300px}
.side.l{justify-self:start}
.side.r{justify-self:end}
.chead{display:flex;align-items:center;justify-content:space-between}
.clabel{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#B9BFC7}
.statline{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:15px;color:#EDEEF0}
.pxdot{width:8px;height:8px;border-radius:50%;background:#79C286;display:inline-block;flex:0 0 auto}
.pxdot.o{background:#E8792B}
.pxhr{height:1px;background:rgba(255,255,255,.11);margin:16px 0 14px}
.pxbig{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:42px;line-height:1;color:#EDEEF0}
.pxunit{font-size:17px;color:#B9BFC7;margin-left:7px}
.cnote{color:#B9BFC7;font-size:14.5px;margin-top:8px}
.pxdelta{font-size:20px;margin-top:12px;color:#79C286}
.pxeyebrow{font-size:12.5px;letter-spacing:.36em;text-transform:uppercase;color:#E8792B;text-align:center}
.pxh1{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-weight:400;font-size:clamp(36px,4.4vw,66px);line-height:1.04;margin:22px 0 24px;text-align:center;color:#EDEEF0}
.pxsub{text-align:center;color:#B9BFC7;font-size:16px;line-height:1.62;max-width:410px;margin:0 auto}
.pxstrip{max-width:1400px;margin:52px auto 0;width:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:28px 8px}
.pxstrip .cell{padding:6px 26px}
.pxstrip .cell+.cell{border-left:1px solid rgba(255,255,255,.1)}
.mlabel{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#B9BFC7}
.mval{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:38px;margin-top:10px;color:#EDEEF0}
.msub{font-size:14px;color:#B9BFC7;margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:7px;height:50px;margin-top:16px}
.bars i{width:7px;border-radius:3px;background:rgba(255,255,255,.22);display:block}
.bars i.a{background:#E8792B}
.pxtrack{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:18px;overflow:hidden}
.pxtrack b{display:block;height:100%;background:#E8792B;border-radius:4px;width:0}
.pxspark{margin-top:12px;height:44px;width:100%}

#pxstatus{position:fixed;left:22px;right:22px;bottom:16px;z-index:65;display:flex;align-items:center;justify-content:space-between;
  padding:15px 26px;border-radius:16px;background:rgba(18,22,28,.76);border:1px solid rgba(255,255,255,.085);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:14px;color:#B9BFC7}
#pxstatus .l,#pxstatus .mid{display:flex;align-items:center;gap:9px}
@media(max-width:1000px){
  #pxnav{padding:14px 16px;gap:14px}
  .pxlinks{justify-content:flex-start;gap:20px}
  .pxhero{padding:96px 16px 24px}
  .hero-row{grid-template-columns:1fr;gap:14px}
  .side{max-width:none}
  .side.l,.side.r{justify-self:stretch}
  .hero-mid{order:-1}
  .pxstrip{grid-template-columns:1fr 1fr;margin-top:22px;padding:16px 4px}
  .pxstrip .cell{padding:12px}
  .pxstrip .cell+.cell{border-left:0}
  .pxstrip .cell:nth-child(even){border-left:1px solid rgba(255,255,255,.1)}
  #pxstatus{left:10px;right:10px;padding:11px 14px;font-size:12px}
  #pxstatus .mid{display:none}
  .page{padding-top:58px}
}

/* ===== one continuous scroll: no nested scrollers, no snap, fixed background ===== */
html{scroll-snap-type:none!important}
.pxs{height:auto!important;scroll-snap-align:none!important}
.pxhero{min-height:calc(100vh - 96px);height:auto!important}
#pxnav{background:linear-gradient(180deg,rgba(8,11,15,.94) 0%,rgba(8,11,15,.72) 62%,rgba(8,11,15,0) 100%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#pxnav.hide{transform:none!important;opacity:1!important;pointer-events:auto!important}

.page{height:auto!important;min-height:0!important;padding:78px 0 54px!important;overflow:visible!important;
  scroll-snap-align:none!important;scroll-margin-top:0}

/* every inner scroll container flows into the page instead of scrolling itself */
.page-host,.mkt-grid,.mc-grid,.scr-grid,.pf-grid,.watch-grid,.cal-grid,
.trades-wrap,.trades-body,.rp-wrap,.rp-body,.rp-right,.rp-lower,.rp-thesis,
.dp-wrap,.dp-body,.sec-list,.top-list,.ind-list,.scr-table,.picks-scroll,
.rp-tile .tbody2,.dp-tile .tbody2,.page.pad{
  height:auto!important;min-height:0!important;max-height:none!important;
  overflow:visible!important;-webkit-overflow-scrolling:auto!important}

/* viewport-fraction rows become content rows, grid areas untouched */
.mc-grid{grid-template-rows:auto minmax(300px,auto) minmax(240px,auto) minmax(260px,auto)!important}
.scr-grid{grid-template-rows:auto!important;grid-auto-rows:minmax(300px,auto)!important}
.rp-right{grid-template-rows:auto auto!important}

/* tiles grow with content; plot tiles keep an explicit drawing box */
.tile{height:auto!important;overflow:visible!important}
.tile .tbody{position:static!important;flex:none!important;height:auto!important;min-height:0!important;overflow:visible!important}
.mkt-grid .tile.a-spx .tbody,.m-spx .tbody{position:relative!important;height:440px!important}
.mkt-grid .tile.a-vix .tbody,.m-vix .tbody{position:relative!important;height:250px!important}
.m-gex .tbody,.m-pos .tbody,.m-earn .tbody,.m-ind .tbody,.m-picks .tbody,.m-lesson .tbody{min-height:180px!important}
@media(max-width:1000px){
  .mc-grid{grid-template-rows:none!important;grid-auto-rows:minmax(200px,auto)!important}
  .scr-grid{grid-auto-rows:minmax(260px,auto)!important}
  .page{padding:70px 0 46px!important}
}

/* ===== the screener table gets its own scroll so Trade stays close ===== */
#page-screeners .scr-table{max-height:60vh!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}

      <div class="pxcard side r">

<script>
(function(){
  "use strict";
  var BASE = "https://gabrielschmal-hub.github.io/Project-Phoenix-/outputs/";
  function url(name){ return (BASE||"") + name + ".json?t=" + Date.now(); }
  function getJSON(name){ return fetch(url(name)).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }

  var NAV = [
    {id:"mission",  ico:"\u25CE", label:"Mission Control", live:true},
    {id:"markets",  ico:"\u25C8", label:"Markets",   live:true},
    {id:"screeners",ico:"\u25A6", label:"Screeners", live:true},
    {id:"trades",   ico:"\u21C4", label:"Trades",    live:true},
    {id:"portfolio",ico:"\u25A4", label:"Portfolio", live:true},
    {id:"news",     ico:"\u25B0", label:"News",      live:false, need:"News + institutional-flow APIs"},
    {id:"cio",      ico:"\u2726", label:"CIO",       live:false, need:"Briefing engine over all modules"},
    {id:"settings", ico:"\u2699", label:"Settings",  live:false, need:"Preferences + data-source config"}
  ];

  var REGIME_INFO = {
    GOLDILOCKS:{c:"var(--green)",bg:"var(--greenBg)",d:"Low vol, steady equity gains, contained inflation. Risk-on backdrop."},
    ENERGY_GRIND:{c:"var(--amber)",bg:"var(--amberBg)",d:"Sustained oil strength feeding into inflation. Favors energy / real assets."},
    ENERGY_SPIKE:{c:"var(--red)",bg:"var(--redBg)",d:"Sharp oil + vol surge with hot inflation. Defensive, commodity-tilted."},
    POLICY_TIGHTENING:{c:"var(--amber)",bg:"var(--amberBg)",d:"Rising real rates / front-end yields with markets still near highs."},
    CRISIS_PEAK:{c:"var(--red)",bg:"var(--redBg)",d:"Deep drawdown with extreme volatility. Capital preservation first."},
    RECOVERY_EARLY:{c:"var(--greenSoft)",bg:"var(--greenBg)",d:"Bouncing off lows as volatility rolls over. Early risk re-entry."},
    RECOVERY_LATE:{c:"var(--green)",bg:"var(--greenBg)",d:"Uptrend resuming below prior highs, calm vol, tight credit."},
    NO_CLEAR:{c:"var(--inkLight)",bg:"var(--card2)",d:"No regime's conditions are currently met. Macro gives no clear edge \u2014 rotation (Layer 2) and selection (Layer 3) carry the weight."}
  };

  // shared caches
  var C = {macro:null,series:null,spx:null,sector:null,stocks:null,gex:null,events:null};
  var built = {}, drawn = {};

  // ---------- nav ----------
  var railNav = document.getElementById("railNav");
  NAV.forEach(function(n){
    var el=document.createElement("div");
    el.className="nav-item"+(n.live?"":" soon"); el.dataset.page=n.id;
    el.innerHTML='<span class="ico">'+n.ico+'</span>'+n.label+(n.live?'':'<span class="tag">SOON</span>');
    el.addEventListener("click",function(){ if(n.live) go(n.id); });
    railNav.appendChild(el);
  });

  var host=document.getElementById("pageHost");
  function go(id){
    if(!built[id]){ buildPage(id); built[id]=true; }
    Array.prototype.forEach.call(document.querySelectorAll(".page"),function(p){p.classList.toggle("active",p.id==="page-"+id);});
    Array.prototype.forEach.call(document.querySelectorAll(".nav-item"),function(it){it.classList.toggle("active",it.dataset.page===id);});
    var n=NAV.filter(function(x){return x.id===id;})[0];
    document.getElementById("tbSection").textContent=(n?n.label:id);
    if(id==="markets") initMarkets();
    if(id==="screeners") initScreener();
    if(id==="trades") initTrades();
    if(id==="portfolio") initPortfolio();
    if(id==="mission") initMC();
    closeNav();
    try{location.hash=id;}catch(e){}
  }

  function buildPage(id){
    var p=document.createElement("div"); p.id="page-"+id;
    if(id==="markets"){ p.className="page"; p.innerHTML=MARKETS_HTML; }
    else if(id==="screeners"){ p.className="page"; p.innerHTML=SCREENER_HTML; }
    else if(id==="trades"){ p.className="page"; p.innerHTML=TRADES_HTML; }
    else if(id==="portfolio"){ p.className="page"; p.innerHTML=PORTFOLIO_HTML; }
    else if(id==="mission"){ p.className="page"; p.innerHTML=MC_HTML; }
    else { p.className="page pad"; p.innerHTML=soonHTML(id); }
    host.appendChild(p);
  }
  function soonHTML(id){
    var n=NAV.filter(function(x){return x.id===id;})[0]||{};
    return '<div class="page-head"><div class="eyebrow">Phoenix \u00B7 '+(n.label||id)+'</div><h1 class="page-title">'+(n.label||id)+'</h1></div>'+
      '<div class="soon-panel"><h3>Not wired yet</h3>This module is part of the Phoenix vision but isn\'t live yet because the data behind it isn\'t flowing. Building it now would mean showing placeholder numbers \u2014 which the system is designed to avoid.<div class="need">Needs: '+(n.need||"a live data source")+'</div></div>';
  }

  // ---------- topbar (asof only; regime now lives in its tile) ----------
  function paintStrip(d){
    var a=document.getElementById("stripAsof");
    if(a) a.textContent=d.asof?("data as of "+d.asof):"";
  }

  // ================= MARKETS =================
  var MARKETS_HTML =
    '<div class="mkt-grid">'+
      // ── asset marquee (unchanged) ──
      '<div class="a-assets"><div class="asset-band" id="assetBand"><div class="loading">\u2026</div></div></div>'+

      // ── THE BOARD: the handful of prices that set the tone ──
      '<div class="mkt-row r-1"><div class="tile a-board">'+
        '<div class="thead"><span class="ttl">The Board</span><span class="tnote" id="boardNote"></span></div>'+
        '<div class="tbody" id="boardBody"><div class="loading">\u2026</div></div></div></div>'+

      // ── THE BRIEF: written from the data, sits above the chart ──
      '<div class="mkt-row r-1"><div class="tile a-brief">'+
        '<div class="thead"><span class="ttl">What just happened</span><span class="tnote" id="briefNote"></span></div>'+
        '<div class="tbody" id="briefBody"><div class="loading">\u2026</div></div></div></div>'+

      // ── SPX: the feature block, full width, big price ──
      '<div class="mkt-row r-1"><div class="tile feature a-spx">'+
        '<div class="thead"><span class="ttl">S&P 500 \u00B7 Daily</span><span class="tnote" id="spxAsof"></span></div>'+
        '<div class="mkt-hero"><span class="hn" id="spxPx">\u2014</span><span class="hc" id="spxChg"></span>'+
          '<span class="spx-hover" id="spxHover"></span></div>'+
        '<div class="tbody"><div class="plot" id="spxPlot"></div>'+
          '<div class="spx-zoom"><button id="spxZoomIn">+</button><button id="spxZoomOut">\u2212</button><button id="spxZoomReset">\u21BA</button></div>'+
        '</div></div></div>'+

      // ── Regime + GEX side by side, each with room ──
      '<div class="mkt-row r-2e">'+
        '<div class="tile tall a-regime"><div class="thead"><span class="ttl">Regime</span><span class="tnote" id="rgNote"></span></div>'+
          '<div class="tbody" id="rgBody"><div class="loading">\u2026</div></div></div>'+
        '<div class="tile tall a-gex"><div class="thead"><span class="ttl">GEX \u00B7 SPX</span><span class="tnote" id="gexNote"></span></div>'+
          '<div class="tbody"><div id="gexBody"><div class="loading">\u2026</div></div>'+
            '<div class="gex-histo" id="mGexPlot"></div></div></div>'+
      '</div>'+

      // ── VIX term: full width so the curve reads ──
      '<div class="mkt-row r-1"><div class="tile tall a-vix">'+
        '<div class="thead"><span class="ttl">VIX Term Structure</span><span class="tnote" id="vixNote"></span></div>'+
        '<div class="tbody"><div class="plot" id="vixPlot"></div></div></div></div>'+

      // ── INDUSTRY: brought over from the screener, made prominent, full width ──
      '<div class="mkt-row r-1"><div class="tile tall a-ind">'+
        '<div class="thead"><span class="ttl">Industry Rotation</span>'+
          '<div class="seg" id="mSecIndSeg"><button data-k="d1" class="on">1D</button><button data-k="w1">1W</button>'+
            '<button data-k="m1">1M</button><button data-k="m3">3M</button></div></div>'+
        '<div class="tbody"><div id="mIndStandout"></div><div class="ind-list" id="mIndList"><div class="loading">\u2026</div></div></div>'+
      '</div></div>'+

      // ── Sector + Top performers ──
      '<div class="mkt-row r-2">'+
        '<div class="tile tall a-sector"><div class="thead"><span class="ttl">Sector Performance</span>'+
          '<div class="seg" id="secSeg"><button data-k="m1" class="on">1M</button><button data-k="m3">3M</button><button data-k="y">1Y</button></div></div>'+
          '<div class="tbody"><div class="sec-list" id="secList"><div class="loading">\u2026</div></div></div></div>'+
        '<div class="tile tall a-top"><div class="thead"><span class="ttl">Top Performers</span><span class="tnote" id="topNote">daily %</span></div>'+
          '<div class="tbody"><div class="top-list" id="topList"><div class="loading">\u2026</div></div></div></div>'+
      '</div>'+
      '<div class="tile a-smart"><div class="thead"><span class="ttl">Smart Money \u00b7 Most Bought</span>'+
        '<div class="seg" id="smMktSeg"><button data-k="all" class="on">All</button><button data-k="pol">Politicians</button><button data-k="inst">Institutions</button></div></div>'+
        '<div class="tbody"><div class="top-list" id="smMktList"><div class="loading">\u2026</div></div></div></div>'+
    '</div>';

  var smMktMode="all";
  function loadSmartMoneyMarket(){
    var list=document.getElementById("smMktList"); if(!list) return;
    dpEnsureSmart(function(){
      var tks={};
      Object.keys(dpInstit||{}).forEach(function(t){tks[t]=1;});
      Object.keys(dpCongress||{}).forEach(function(t){tks[t]=1;});
      var rows=Object.keys(tks).map(function(tk){
        var a=_smAgg(tk);
        // 'bought' score by mode: politicians = congress buys, inst = inst adds, all = both
        a.polBuys=a.cgBuy; a.instBuys=a.instBuy;
        a.score = smMktMode==="pol" ? a.cgBuy*1e9+a.cgBuyN
               : smMktMode==="inst" ? a.instBuyVal
               : (a.instBuyVal + a.cgBuyN);
        return a;
      }).filter(function(a){
        return smMktMode==="pol" ? a.cgBuy>0 : smMktMode==="inst" ? a.instBuy>0 : (a.cgBuy>0||a.instBuy>0);
      });
      rows.sort(function(x,y){return y.score-x.score;});
      if(!rows.length){ list.innerHTML='<div class="promo-empty" style="padding:12px 2px">No '+(smMktMode==="inst"?"institutional":smMktMode==="pol"?"congressional":"smart-money")+' buying on file yet. Congress is seeded; institutions populate on the Smart Money workflow run.</div>'; return; }
      list.innerHTML=rows.slice(0,14).map(function(a,i){
        var who = a.inst.length && (smMktMode!=="pol") ? a.inst[0].manager.replace(/\s*\(.*\)/,"") : (a.cg.length? a.cg[0].member : "");
        var tag = smMktMode==="pol" ? (a.cgBuy+" buy"+(a.cgBuy>1?"s":""))
               : smMktMode==="inst" ? (a.instBuyVal?_usd(a.instBuyVal):(a.instBuy+" add"+(a.instBuy>1?"s":"")))
               : ((a.cgBuy?a.cgBuy+"\u00d7 cong ":"")+(a.instBuy?_usd(a.instBuyVal):""));
        return '<div class="top-row sm-mkt-row" data-tk="'+a.tk+'" style="cursor:pointer">'+
          '<span class="rk">'+(i+1)+'</span>'+
          '<span class="sym">'+a.tk+'</span>'+
          '<span class="nm" style="flex:1;color:var(--inkFade);font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px">'+who+'</span>'+
          '<span class="chg" style="color:var(--green);font-family:var(--mono);font-size:10px">'+tag+'</span></div>';
      }).join("");
      list.querySelectorAll(".sm-mkt-row").forEach(function(r){ r.addEventListener("click",function(){ scrOpenTicker(r.dataset.tk); }); });
      try{ mktBrief(); }catch(e){}
    });
  }

  var indData=null;  // shared industry data
  function initMarkets(){
    // regime (also powers strip) — always fetch fresh once
    if(!C.macro){
      getJSON("macro").then(function(d){ C.macro=d; paintStrip(d); renderRegime(d); try{mktBrief();}catch(e){} })
        .catch(function(e){ document.getElementById("rgBody").innerHTML=errHTML("macro.json",e.message); });
    } else { renderRegime(C.macro); }

    drawSPX("");
    drawVIX("");
    loadAssets();
    loadBoard();
    loadSectors();
    loadTop();
    loadSmartMoneyMarket();
    var sseg=document.getElementById("smMktSeg");
    if(sseg) sseg.onclick=function(ev){ var b=ev.target.closest("button"); if(!b)return; smMktMode=b.dataset.k; Array.prototype.forEach.call(this.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);}); loadSmartMoneyMarket(); };
    loadGEX("");
    // industry rotation (ported to Markets)
    if(!scrData){
      getJSON("stocks").then(function(d){ scrData=(d&&d.stocks)||[]; renderMktIndustry(); }).catch(function(){});
    }
    if(!indData){
      getJSON("industry").then(function(d){ indData=(d&&d.industries)||[]; renderMktIndustry(); try{mktBrief();}catch(e){} })
        .catch(function(){ indData=[]; renderMktIndustry(); });
    } else { renderMktIndustry(); }
    var seg=document.getElementById("mSecIndSeg");
    if(seg) seg.querySelectorAll("button").forEach(function(b){
      b.onclick=function(){
        seg.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
        this.classList.add("on"); mIndSort=this.getAttribute("data-k"); renderMktIndustry();
      };
    });
  }

  // Industry rotation on Markets — bigger, with a standout leader/laggard line.
  // Reuses indData (same source the screener uses). Own sort state so the two
  // pages don't fight over the toggle.
  var mIndSort="d1";
  var MIND_LABEL={d1:"today",w1:"this week",m1:"this month",m3:"this quarter"};
  function renderMktIndustry(){
    var listEl=document.getElementById("mIndList"); if(!listEl) return;
    if(!indData||!indData.length){ listEl.innerHTML='<div class="mc-none">No industry data.<span>Needs a fresh engine run.</span></div>'; return; }
    var arr=indData.slice().filter(function(o){return o[mIndSort]!=null;});
    arr.sort(function(a,b){return (b[mIndSort]||0)-(a[mIndSort]||0);});
    var lead=arr[0], lag=arr[arr.length-1];
    var top=arr.slice(0,14);
    var max=Math.max.apply(null,arr.map(function(o){return Math.abs(o[mIndSort]||0);}))||1;
    // held industries get a gold dot
    var mine={};
    (trLog||[]).forEach(function(t){ if(t.status==="open"&&t.industry) mine[t.industry]=1; });
    // standout line: the rotation story in one sentence
    var so=document.getElementById("mIndStandout");
    if(so && lead && lag){
      var span=MIND_LABEL[mIndSort]||"";
      so.innerHTML='<div class="mkt-standout '+(lead[mIndSort]>=0?"up":"down")+'">'+
        '<b>'+lead.industry+'</b> leads '+span+' at <b>'+(lead[mIndSort]>=0?"+":"")+lead[mIndSort].toFixed(2)+'%</b>'+
        ', while <b>'+lag.industry+'</b> lags at '+(lag[mIndSort]>=0?"+":"")+lag[mIndSort].toFixed(2)+'%.'+
        '</div>';
    }
    listEl.innerHTML=top.map(function(o){
      var v=o[mIndSort]||0, w=Math.min(Math.abs(v)/max*50,50), pos=v>=0;
      var held=mine[o.industry];
      return '<div class="ind-row" data-ind="'+encodeURIComponent(o.industry)+'"><span class="nm"'+(held?' style="color:var(--gold)"':'')+'>'+
        '<span class="ind-caret">›</span>'+(held?'● ':'')+o.industry+'</span>'+
        '<div class="ind-bar-wrap"><div class="ind-bar" style="'+(pos?"left:50%":"right:50%")+';width:'+w+'%;background:'+
          (pos?"var(--greenSoft)":"var(--redSoft)")+'"></div>'+
          '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)"></div></div>'+
        '<span class="ind-val" style="color:'+(pos?"var(--green)":"var(--red)")+'">'+(pos?"+":"")+v.toFixed(2)+'%</span></div>';
    }).join("");
    // wire click-to-expand on each industry row
    listEl.querySelectorAll(".ind-row").forEach(function(row){
      row.addEventListener("click",function(){ mktToggleIndustry(decodeURIComponent(this.dataset.ind), this); });
    });
    if(mktIndExpanded){
      var r=listEl.querySelector('.ind-row[data-ind="'+encodeURIComponent(mktIndExpanded)+'"]');
      if(r){ var n=mktIndExpanded; mktIndExpanded=null; mktToggleIndustry(n,r); }
    }
  }

  // ---- industry drill-down: the stocks inside one industry ----
  var mktIndExpanded=null;
  function mktToggleIndustry(ind, rowEl){
    var existing=document.querySelector(".ind-exp");
    var wasOpen=(mktIndExpanded===ind);
    if(existing) existing.remove();
    document.querySelectorAll(".ind-row.exp").forEach(function(r){r.classList.remove("exp");});
    if(wasOpen){ mktIndExpanded=null; return; }
    mktIndExpanded=ind;
    rowEl.classList.add("exp");
    var members=(scrData||[]).filter(function(s){return s.industry===ind;});

  // ----- SPX candlestick + volume, with hover detail, zoom, and GEX levels -----
  function drawSPX(sfx){
    sfx=sfx||"";
    if(!sfx && drawn.spx) return;
    if(sfx && drawn["spx"+sfx]) return;
    Promise.all([getJSON("spx_daily"), getJSON("gex").catch(function(){return null;})]).then(function(res){
      var d=res[0], gex=res[1];
      var bars=(d&&d.bars)||[]; if(!bars.length){ document.getElementById("spxPlot"+sfx).innerHTML='<div class="err">No SPX daily data yet. It populates on the next engine run.</div>'; return; }
      var dates=bars.map(function(b){return b.date;});
      var last=bars[bars.length-1], prev=bars.length>1?bars[bars.length-2]:last;
      var chg=((last.c-prev.c)/prev.c*100), chgpts=(last.c-prev.c);
      // big header
      document.getElementById("spxPx"+sfx).textContent=last.c.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
      var cc=chg>=0?"var(--green)":"var(--red)";
      document.getElementById("spxChg"+sfx).innerHTML='<span style="color:'+cc+'">'+(chg>=0?"+":"")+chgpts.toFixed(2)+' ('+(chg>=0?"+":"")+chg.toFixed(2)+'%)</span>';
      document.getElementById("spxAsof"+sfx).textContent=last.date;

      // per-bar % change for hover
      var pct=bars.map(function(b,i){ if(i===0)return 0; var p=bars[i-1].c; return p?((b.c-p)/p*100):0; });
      var hovertext=bars.map(function(b,i){
        return "O "+b.o.toLocaleString()+"  H "+b.h.toLocaleString()+"<br>L "+b.l.toLocaleString()+"  C "+b.c.toLocaleString()+
               "<br>Vol "+(b.v?(b.v/1e9).toFixed(2)+"B":"\u2014")+"  "+(pct[i]>=0?"+":"")+pct[i].toFixed(2)+"%";
      });
      var volColors=bars.map(function(b){return (b.c>=b.o)?"rgba(45,138,85,.45)":"rgba(176,48,48,.45)";});
      var candle={type:"candlestick",x:dates,open:bars.map(function(b){return b.o;}),high:bars.map(function(b){return b.h;}),low:bars.map(function(b){return b.l;}),close:bars.map(function(b){return b.c;}),
        text:hovertext,hoverinfo:"text+x",
        increasing:{line:{color:"#2D8A55"},fillcolor:"rgba(45,138,85,.6)"},decreasing:{line:{color:"#B03030"},fillcolor:"rgba(176,48,48,.6)"},yaxis:"y",name:"",showlegend:false};
      var vol={type:"bar",x:dates,y:bars.map(function(b){return b.v;}),marker:{color:volColors},yaxis:"y2",name:"Vol",hoverinfo:"skip",showlegend:false};

      var layout=baseLayout();
      layout.dragmode="pan";
      layout.hovermode="x";
      layout.hoverlabel={bgcolor:"#FAF7F2",bordercolor:"#C8BFA8",font:{family:"'Courier New',monospace",size:10,color:"#1C1912"}};
      layout.grid={rows:2,columns:1,roworder:"top to bottom"};
      layout.yaxis={domain:[0.24,1],side:"right",gridcolor:"rgba(0,0,0,.05)",tickfont:tf(),fixedrange:false,autorange:true};
      layout.yaxis2={domain:[0,0.18],side:"right",gridcolor:"rgba(0,0,0,.04)",tickfont:tf(8),fixedrange:true,showticklabels:false};
      layout.xaxis={rangeslider:{visible:false},gridcolor:"rgba(0,0,0,.04)",tickfont:tf(),rangebreaks:[{bounds:["sat","mon"]}]};
      // default view: last ~60 sessions (still pannable/zoomable to full history)
      if(dates.length>60){ layout.xaxis.range=[dates[dates.length-60], dates[dates.length-1]]; }

      // GEX levels as horizontal lines (gamma flip, call wall, put wall)
      var shapes=[], anns=[];
      if(gex){
        var ov=gex.overview||{}, L=gex.levels||{};
        function lvlLine(val,color,label){
          if(val==null) return;
          shapes.push({type:"line",xref:"paper",x0:0,x1:1,yref:"y",y0:val,y1:val,
            line:{color:color,width:1,dash:"dot"}});
          anns.push({xref:"paper",x:1,y:val,yref:"y",xanchor:"right",yanchor:"bottom",
            text:label+" "+val.toLocaleString(),showarrow:false,
            font:{family:"'Courier New',monospace",size:8.5,color:color},bgcolor:"rgba(250,247,242,.7)"});
        }
        lvlLine(ov.gamma_flip,"#A67C00","Flip");
        lvlLine(L.call_wall&&L.call_wall.strike,"#1A5C38","Call wall");
        lvlLine(L.put_wall&&L.put_wall.strike,"#7A1E1E","Put wall");
      }
      layout.shapes=shapes; layout.annotations=anns;

      var conf={displayModeBar:false,responsive:true,scrollZoom:true,doubleClick:"reset"};
      Plotly.newPlot("spxPlot"+sfx,[candle,vol],layout,conf);

      var plotEl=document.getElementById("spxPlot"+sfx);

      // shared: update the corner readout for a given bar index
      function showBar(i){
        if(i==null||i<0||i>=bars.length||!bars[i])return;
        var b=bars[i];
        document.getElementById("spxHover"+sfx).innerHTML=
          '<span class="hk">'+b.date+'</span> O '+b.o.toLocaleString()+' H '+b.h.toLocaleString()+
          ' L '+b.l.toLocaleString()+' C '+b.c.toLocaleString()+' \u00B7 Vol '+(b.v?(b.v/1e9).toFixed(2)+'B':'\u2014')+
          ' \u00B7 <span style="color:'+(pct[i]>=0?"var(--green)":"var(--red)")+'">'+(pct[i]>=0?"+":"")+pct[i].toFixed(2)+'%</span>';
      }
      // desktop hover
      plotEl.on("plotly_hover",function(ev){
        var pt=ev.points&&ev.points[0]; if(!pt)return; showBar(pt.pointIndex);
      });
      // touch scrub: map finger x-position to nearest bar, update readout live.
      // Works on iPad where there's no hover. Does not block Plotly's pan.
      function scrubFromTouch(clientX){
        try{
          var gd=plotEl; var xa=gd._fullLayout.xaxis;
          var rect=gd.getBoundingClientRect();
          var xInData=xa.p2d(clientX-rect.left);
          // xInData is a date-ish value; find nearest bar by index along visible range
          // Plotly gives category/linear index for date axis; match to closest date
          var target=xInData;
          var lo=0,hi=bars.length-1,best=0,bestDiff=Infinity;
          for(var k=0;k<bars.length;k++){
            var t=new Date(bars[k].date).getTime();
            var diff=Math.abs(t-new Date(_fromAxis(target)).getTime());
            if(diff<bestDiff){bestDiff=diff;best=k;}
          }
          showBar(best);
        }catch(e){}
      }
      function _fromAxis(v){
        // xaxis.p2d on a date axis returns ms or date string depending on version
        if(typeof v==="number"){ return v; }
        return v;
      }
      var scrubbing=false;
      plotEl.addEventListener("touchstart",function(e){ scrubbing=true; if(e.touches[0])scrubFromTouch(e.touches[0].clientX); },{passive:true});
      plotEl.addEventListener("touchmove",function(e){ if(scrubbing&&e.touches[0])scrubFromTouch(e.touches[0].clientX); },{passive:true});
      plotEl.addEventListener("touchend",function(){ scrubbing=false; },{passive:true});

      // zoom buttons — operate on the x-axis range, keep drag as pan
      function curRange(){
        var xa=plotEl._fullLayout.xaxis;
        return [xa.range[0], xa.range[1]];
      }
      function setXRange(r){ Plotly.relayout(plotEl,{"xaxis.range":r}); }
      function zoomBy(factor){
        var r=curRange();
        var a=new Date(r[0]).getTime(), b=new Date(r[1]).getTime();
        if(isNaN(a)||isNaN(b)){ a=r[0]; b=r[1]; }
        var mid=(a+b)/2, half=(b-a)/2*factor;
        setXRange([new Date(mid-half).toISOString().slice(0,10), new Date(mid+half).toISOString().slice(0,10)]);
      }
      // Zoom controls only exist on the Markets page — Mission Control hosts the
      // same chart without them. These must be suffix-aware AND null-safe, or
      // drawSPX("MC") would wire Markets' buttons to Mission Control's chart.
      var zi=document.getElementById("spxZoomIn"+sfx),
          zo=document.getElementById("spxZoomOut"+sfx),
          zr=document.getElementById("spxZoomReset"+sfx);
      if(zi) zi.addEventListener("click",function(){ zoomBy(0.6); });
      if(zo) zo.addEventListener("click",function(){ zoomBy(1.6); });
      if(zr) zr.addEventListener("click",function(){
        var r=(dates.length>60)?[dates[dates.length-60],dates[dates.length-1]]:[dates[0],dates[dates.length-1]];
        setXRange(r);
      });
      drawn[("spx")+sfx]=true;
    }).catch(function(e){ document.getElementById("spxPlot"+sfx).innerHTML=errHTML("spx_daily.json",e.message); });
  }

  // ----- VIX term structure: real futures curve (manual vix_term.json, paste like GEX) -----
  function drawVIX(sfx){
    sfx=sfx||"";
    if(!sfx && drawn.vix) return;
    if(sfx && drawn["vix"+sfx]) return;
    getJSON("vix_term").then(function(d){
      var futs=(d&&d.futures)||[];
      var spot=(d&&d.spot);
      if(!futs.length){ throw new Error("no futures"); }
      // x labels: Spot + each contract; y: values
      var labels=[], vals=[];
      if(spot!=null){ labels.push("Spot"); vals.push(spot); }
      futs.forEach(function(f){ labels.push(f.label); vals.push(f.value); });
      // contango vs backwardation: compare front future to back future
      var front=futs[0].value, back=futs[futs.length-1].value;
      var contango = back>front;
      var shape = contango ? "CONTANGO" : (back<front ? "BACKWARDATION" : "FLAT");
      var shapeColor = contango ? "var(--green)" : (back<front ? "var(--red)" : "var(--inkLight)");
      var spread = (back-front);
      document.getElementById("vixNote"+sfx).innerHTML =
        (spot!=null?'spot '+spot.toFixed(2)+'  ':'') +
        '<span style="color:'+shapeColor+';font-weight:700">'+shape+'</span>' +
        (isFinite(spread)?'  '+(spread>0?"+":"")+spread.toFixed(2):"");
      // main curve (futures only, line+markers)
      var xf=[], yf=[];
      futs.forEach(function(f){ xf.push(f.label); yf.push(f.value); });
      var curve={type:"scatter",mode:"lines+markers",x:xf,y:yf,
        line:{color:(contango?"#1A5C38":"#7A1E1E"),width:2.5,shape:"spline"},
        marker:{size:7,color:(contango?"#1A5C38":"#7A1E1E")},
        text:yf.map(function(v){return v.toFixed(2);}),
        hovertemplate:"%{x}: %{y:.2f}<extra></extra>",showlegend:false};
      var data=[curve];
      // spot marker (gold dashed reference line at spot level)
      var shapes=[];
      if(spot!=null){
        shapes.push({type:"line",xref:"paper",x0:0,x1:1,yref:"y",y0:spot,y1:spot,
          line:{color:"#A67C00",width:1,dash:"dash"}});
      }
      var layout=baseLayout();
      layout.margin={l:6,r:34,t:8,b:24};
      layout.shapes=shapes;
      layout.xaxis={gridcolor:"rgba(0,0,0,.04)",tickfont:tf(9),fixedrange:true};
      layout.yaxis={gridcolor:"rgba(0,0,0,.05)",tickfont:tf(9),side:"right",fixedrange:true,
        title:{text:"",font:tf(8)}};
      if(spot!=null){
        layout.annotations=[{xref:"paper",x:0,y:spot,yref:"y",xanchor:"left",yanchor:"bottom",
          text:"spot "+spot.toFixed(2),showarrow:false,font:{family:"'Courier New',monospace",size:8,color:"#A67C00"},bgcolor:"rgba(250,247,242,.7)"}];
      }
      Plotly.newPlot("vixPlot"+sfx,data,layout,{displayModeBar:false,responsive:true,staticPlot:false});
      drawn[("vix")+sfx]=true;
    }).catch(function(e){
      // no manual data yet — clear guidance, not a scary error
      document.getElementById("vixNote"+sfx).innerHTML='<span style="color:var(--inkFade)">awaiting data</span>';
      document.getElementById("vixPlot"+sfx).innerHTML='<div class="err" style="padding:14px">VIX term structure needs the futures ladder.<div class="fix">Paste the VIX futures (front \u2192 M6) into vix_term.json and upload to outputs/ \u2014 same flow as GEX. Format: {"spot":15.7,"futures":[{"label":"Jul","value":16.2},\u2026]}</div></div>';
    });
  }

    }],{

      shapes:shapes,showlegend:false,bargap:0.15
    },{displayModeBar:false,responsive:true});

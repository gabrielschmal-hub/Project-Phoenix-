          ? (tk||"This ticker")+' has no quarterly data on file yet.<br>The engine auto-backfills the biggest missing names each daily run.'
          : 'Loading financials\u2026')+'</div>';
      return;
    }
    function col(v){ return v==null?"var(--inkFade)":(v>=0?"var(--green)":"var(--red)"); }
    function pct(v,d){ return v==null?"\u2014":(v>=0?"+":"")+v.toFixed(d==null?0:d)+"%"; }
    var last=fin[fin.length-1]||{};

    // HEADLINE METRIC CARDS — the numbers worth checking first, big and clear
    var cards=[
      ["Revenue", last.revenue_B!=null?"$"+last.revenue_B.toFixed(2)+"B":"\u2014", last.rev_yoy!=null?pct(last.rev_yoy,1)+" YoY":"", col(last.rev_yoy)],
      ["Net Margin", pct(last.net_margin,1), last.net_margin>=15?"strong":last.net_margin>=0?"thin":"negative", col(last.net_margin)],
      ["ROE", pct(last.roe,1), last.roe>=15?"excellent":last.roe>=0?"positive":"negative", col(last.roe)],
      ["FCF Margin", pct(last.fcf_margin,1), last.fcf_margin>=0?"cash generative":"cash burn", col(last.fcf_margin)],
      ["Gross Margin", pct(last.gross_margin,1), "", col(last.gross_margin)],

       (last.debt_equity==null?"var(--inkFade)":(last.debt_equity<=1?"var(--green)":last.debt_equity<=2?"var(--amber)":"var(--red)"))]
    ];
    var head='<div class="fin-cards">'+cards.map(function(c){

        '<div class="fc-k">'+c[0]+'</div>'+

        (c[2]?'<div class="fc-s">'+c[2]+'</div>':'')+
      '</div>';
    }).join("")+'</div>';

    // REVENUE + a second series side by side (net income or FCF)
    var revBars=_finBars(fin,"revenue_B",{title:"Revenue by quarter",growthKey:"rev_yoy",h:70});
    var secondKey=fin.some(function(f){return f.fcf_B!=null;})?"fcf_B":"net_income_B";
    var secondTitle=secondKey==="fcf_B"?"Free cash flow":"Net income";
    var secondBars=_finBars(fin,secondKey,{title:secondTitle,h:70});
    var twoUp='<div class="fin-2up">'+
      '<div>'+revBars+'</div>'+
      (secondBars?'<div>'+secondBars+'</div>':'')+
    '</div>';

    // MARGIN TRENDS side by side
    var nmBars=_finBars(fin,"net_margin",{title:"Net margin",pct:true,h:44,op:0.85});
    var gmBars=_finBars(fin,"gross_margin",{title:"Gross margin",pct:true,h:44,color:"var(--gold)",op:0.75});
    var trends=(nmBars||gmBars)?'<div class="fin-2up" style="margin-top:6px">'+
      (nmBars?'<div>'+nmBars+'</div>':'')+(gmBars?'<div>'+gmBars+'</div>':'')+'</div>':'';

    // MARGIN LADDER — the shape of the business, latest quarter
    var ladder=[["Gross",last.gross_margin],["Operating",last.op_margin],["EBITDA",last.ebitda_margin],["FCF",last.fcf_margin]]
               .filter(function(x){return x[1]!=null;});
    var lad="";
    if(ladder.length){
      lad='<div class="fin-ladder"><div class="fin-sub">Margin structure \u00b7 latest quarter</div>'+
        ladder.map(function(x){
          var v=Math.max(-100,Math.min(100,x[1])), neg=v<0, w=Math.min(50,Math.abs(v)/2);
          return '<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">'+
            '<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);width:78px">'+x[0]+'</span>'+
            '<div style="flex:1;height:10px;background:var(--card2);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden">'+
              '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)"></div>'+
              '<div style="position:absolute;top:0;bottom:0;'+(neg?"right:50%;":"left:50%;")+'width:'+w+'%;background:'+(neg?"var(--redSoft)":"var(--greenSoft)")+'"></div>'+
            '</div>'+
            '<span style="font-family:var(--mono);font-size:12.5px;font-weight:700;color:'+col(x[1])+';width:58px;text-align:right">'+pct(x[1],1)+'</span>'+

  function dpRat(e, tk){

      var up=(cur&&r.mean_target)?((r.mean_target-cur)/cur*100):null;

        '<div class="rate-bar2"><div style="background:#2D8A55;width:'+r.buy_pct+'%"></div><div style="background:#A67C00;width:'+Math.max(0,100-r.buy_pct)+'%"></div></div>'+

          (up!=null?'<div style="text-align:right"><div class="rt-k">Implied upside</div><div class="rt-v" style="color:'+(up>=0?"var(--green)":"var(--red)")+'">'+(up>=0?"+":"")+up.toFixed(1)+'%</div></div>':'')+
        '</div>':'')+

      var rec=p.recommendation?'<div class="rate-row"><span class="k">Consensus</span><span style="font-weight:700;text-transform:uppercase">'+p.recommendation+'</span></div>':'';
      var tg=p.target_mean?'<div class="rate-row"><span class="k">Mean target</span><span style="font-weight:700;color:var(--gold)">'+fmtN(p.target_mean)+'</span></div>':'';

    // consensus tilt
    var bull=r.strong_buy+r.buy, bear=r.sell+r.strong_sell;

      }).join("")+'</div>'+

  function dpEarn(e, tk){
    var el=document.getElementById("dpEarn"); if(!el) return;
    var fd=dpFinCache[tk]||null;
    var ee=e.earnings||{}, p=e.profile||{}, fin=e.financials||[];
    var out="";
    var nd=(fd&&fd.next_earnings)||ee.next_date||null;
    if(nd){
      var dt=new Date(nd+"T00:00:00"), days=Math.round((dt-new Date())/86400000);
      var soon=days>=0&&days<=7, past=days<0;
      var isEst=!!(ee&&ee.estimated);
      // An estimate is +/- about a week (reporting lag varies by company), so
      // never render it as a precise date — show the window it falls in.
      function windowLabel(d){
        var day=d.getDate(), part=day<=10?"early":day<=20?"mid":"late";
        return "~ "+part+" "+d.toLocaleDateString(undefined,{month:"long"})+" "+d.getFullYear();
      }
      var big=isEst?windowLabel(dt):dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
      var sub;
      if(isEst){
        sub=(days<0)?"estimated — may have already reported"
           :(days<=10)?"estimated — expected within ~"+Math.max(days,1)+"–10 days"
           :"estimated from reporting cadence";
      } else {
        sub=past?Math.abs(days)+"d ago":days===0?"\u2726 REPORTS TODAY":days===1?"\u2726 REPORTS TOMORROW":"in "+days+" days";
      }
      out+='<div class="earn-hero">'+
        '<div class="earn-lbl">'+(past&&!isEst?"Last reported":"Next report")+
          (isEst?' <span style="font-size:8px;color:var(--inkFade)">estimated</span>':' <span style="font-size:8px;color:var(--green)">confirmed</span>')+'</div>'+
        '<div class="earn-big" style="'+(soon&&!isEst?"color:var(--amber)":isEst?"font-size:19px;color:var(--inkLight)":"")+'">'+big+'</div>'+
        '<div style="font-family:var(--mono);font-size:10px;color:'+(soon&&!isEst?"var(--amber)":isEst?"var(--inkFade)":"var(--gold)")+';font-weight:'+(soon&&!isEst?"700":"400")+'">'+sub+'</div>'+
      '</div>';
      // a verified most-recent report date is worth showing on its own
      if(ee&&ee.last_reported){
        var lr=new Date(ee.last_reported+"T00:00:00");
        var lrd=Math.round((new Date()-lr)/86400000);
        out+='<div class="earn-row" style="border-bottom:1px solid var(--line);padding:4px 0">'+
          '<span class="k">Last reported <span style="color:var(--green);font-size:8px">confirmed</span></span>'+
          '<span style="font-weight:700">'+lr.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+
          ' <span style="color:var(--inkFade);font-weight:400">('+(lrd===0?"today":lrd===1?"yesterday":lrd+"d ago")+')</span></span></div>';
      }
    } else {
      out+='<div style="font-family:var(--mono);font-size:10px;color:var(--inkFade);padding:8px 4px;line-height:1.6">Earnings date not yet known \u2014 the engine checks a rotating batch each run.</div>';
    }
    if(fd&&fd.fresh_earnings){
      var lq=fin[fin.length-1]||{};
      out+='<div class="earn-fresh"><div class="ef-k">\u2726 New numbers just in</div>'+
        '<div style="font-family:var(--mono);font-size:10px;color:var(--ink);line-height:1.6">'+String(fd.fresh_earnings).slice(0,10)+
          (lq.revenue_B!=null?'<br>Rev $'+lq.revenue_B.toFixed(2)+'B'+(lq.rev_yoy!=null?' <span style="color:'+(lq.rev_yoy>=0?"var(--green)":"var(--red)")+'">('+(lq.rev_yoy>=0?"+":"")+lq.rev_yoy+'% YoY)</span>':''):'')+
          (lq.net_margin!=null?'<br>Net margin '+lq.net_margin+'%':'')+'</div></div>';
    }
    // key facts grid
    var facts=[];
    if(fin.length){ var q=fin[fin.length-1];
      if(q.q) facts.push(["Last quarter",q.q]);
      if(q.revenue_B!=null) facts.push(["Revenue","$"+q.revenue_B.toFixed(2)+"B"]);
    }
    if(p.employees) facts.push(["Employees",p.employees.toLocaleString()]);
    if(p.div_yield) facts.push(["Div yield",(p.div_yield*100).toFixed(2)+"%"]);
    if(facts.length){
      out+='<div class="earn-facts">'+facts.map(function(f){
        return '<div class="earn-row"><span class="k">'+f[0]+'</span><span style="font-weight:700">'+f[1]+'</span></div>';
      }).join("")+'</div>';
    }
    el.innerHTML=out;
  }

  // AI thesis — knows whether it's writing for an idea, a ready plan, or a live position

  function dpGenThesisLive(t,tk,e,p,q,meta,cur,calc,box,btn){
    var regime=(C.macro&&C.macro.regime)||"NO_CLEAR";
    var fdt=dpFinCache[tk]||null;
    var finArr=(fdt&&fdt.quarters)||e.financials||[];
    var fin=finArr.slice(-3).map(function(f){
      return f.q+": rev $"+f.revenue_B+"B"+
        (f.rev_yoy!=null?" (YoY "+(f.rev_yoy>=0?"+":"")+f.rev_yoy+"%)":"")+
        (f.net_margin!=null?", net margin "+f.net_margin+"%":"")+
        (f.fcf_margin!=null?", FCF margin "+f.fcf_margin+"%":"");
    }).join("; ");
    var lastF=finArr[finArr.length-1]||{};
    var health=[];
    if(lastF.roe!=null) health.push("ROE "+lastF.roe+"%");
    if(lastF.debt_equity!=null) health.push("debt/equity "+lastF.debt_equity);
    if(lastF.current_ratio!=null) health.push("current ratio "+lastF.current_ratio);
    var lo52=(e.range52&&e.range52.low)||meta.low52, hi52=(e.range52&&e.range52.high)||meta.high52;
    var stage = t.status==="open" ? "The trader ALREADY HOLDS this position." :
                trIsReady(t) ? "The trader has a ready plan but has NOT entered yet." :
                               "The trader is still studying this — no levels set yet.";
    var prompt=
      "You are a senior hedge fund PM writing a research thesis for "+tk+(p.name?" ("+p.name+")":"")+". "+
      "Use ONLY the data provided. Never invent numbers. "+stage+" "+
      "Macro regime: "+regime+". Sector: "+(p.sector||t.industry||"?")+", industry: "+(p.industry||t.industry||"?")+". "+
      "Current price "+(cur!=null?cur.toFixed(2):"?")+
      (q.mcap_B!=null?", market cap $"+q.mcap_B+"B":"")+
      (e.pe?", P/E "+e.pe.toFixed(1):"")+
      ((lo52&&hi52)?", 52-week range "+lo52+"\u2013"+hi52:"")+". "+
      (t.trade_score!=null?"Engine scores: trade "+t.trade_score+"/100, invest "+t.invest_score+"/100. ":"")+
      (t.setup?"Setup: "+t.setup+". ":"")+
      (t.entry?"Planned entry "+t.entry+". ":"")+
      (t.stop?"Stop "+t.stop+". ":"")+
      (t.target?"Target "+t.target+". ":"")+
      (calc.rr!=null?"Risk/reward "+calc.rr.toFixed(1)+"R. ":"")+
      (fin?"Recent quarters: "+fin+". ":"")+
      (health.length?"Balance sheet: "+health.join(", ")+". ":"")+
      (p.target_mean?"Analyst mean target "+p.target_mean+". ":"")+
      (p.summary?"Business: "+truncate(p.summary,300)+" ":"")+
      "Write these sections with the header on its own line: WHAT THEY DO, MOAT, ENTRY, EXIT, STRATEGY, RISKS. "+
      "WHAT THEY DO: one tight sentence. MOAT: the durable advantage, or say plainly if it's weak. "+
      (t.entry?"ENTRY: assess whether the planned entry is sound given the levels. ":"ENTRY: suggest a price or condition to enter, using the 52-week range as reference. ")+
      (t.stop?"EXIT: assess the stop and target, and whether the R/R justifies the trade. ":"EXIT: suggest stop and target logic with prices. ")+
      "STRATEGY: how to play it given the regime and scores. RISKS: the top 2 risks. "+
      "Under 220 words. Plain text, no markdown symbols.";
    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1400,messages:[{role:"user",content:prompt}]})
    }).then(function(r){ return r.json(); }).then(function(d){
      var txt=(d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      box.innerHTML='<div class="dp-gen">'+txt.replace(/\n?(WHAT THEY DO|MOAT|ENTRY|EXIT|STRATEGY|RISKS)\s*:?/g,'<h5>$1</h5>')+'</div>';
      btn.style.display="none";
    }).catch(function(err){
      box.innerHTML='<div class="dp-gen" style="color:var(--red);font-size:11px">Thesis generation failed ('+err.message+'). '+THESIS_HELP+'</div>';
      btn.disabled=false; btn.textContent="Retry \u2192";
    });
  }

  function fmtN(v){ return v==null?"\u2014":Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function truncate(s,n){ return (s&&s.length>n)?s.slice(0,n)+"\u2026":(s||""); }

  // ---------- mobile rail ----------
  // ---------- floating nav panel ----------
  var navPanel=document.getElementById("navPanel"), navBtn=document.getElementById("navBtn"), navScrim=document.getElementById("navScrim");
  function openNav(){ navPanel.classList.add("open"); navScrim.classList.add("show"); }
  function closeNav(){ navPanel.classList.remove("open"); navScrim.classList.remove("show"); }
  function toggleNav(){ navPanel.classList.contains("open")?closeNav():openNav(); }
  navBtn.addEventListener("click",toggleNav);
  navScrim.addEventListener("click",closeNav);

  // ---------- boot: Phoenix as a single scrolling page ----------
  var PXS=[["mission","Mission Control"],["markets","Markets"],["screeners","Screeners"],
           ["trades","Trade"],["portfolio","Portfolio"]];

  PXS.forEach(function(p){ try{ go(p[0]); }catch(e){ console.warn("init "+p[0],e); } });
  Array.prototype.forEach.call(document.querySelectorAll(".page"),function(p){p.classList.add("active");});

  var pxLinks=document.getElementById("pxlinks");
  PXS.forEach(function(p,i){
    var a=document.createElement("a");
    a.textContent=p[1]; a.id="pxl_"+p[0]; if(i===0) a.className="on";
    a.addEventListener("click",function(){
      var t=(p[0]==="mission")?document.getElementById("px-hero"):document.getElementById("page-"+p[0]);
      if(t) window.scrollTo({top:(p[0]==="mission")?0:(t.getBoundingClientRect().top+window.pageYOffset-8),behavior:"smooth"});
    });
    pxLinks.appendChild(a);
  });

  /* the background stays put and the nav stays visible - one page, one scroll */

  var PX_STATUS="All systems nominal";
  (function(){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        var id=e.target.id.replace("page-","").replace("px-hero","mission");
        PXS.forEach(function(p){ var a=document.getElementById("pxl_"+p[0]); if(a) a.className=(p[0]===id?"on":""); });
        var lab=(PXS.filter(function(p){return p[0]===id;})[0]||["",""])[1];
        var t=document.getElementById("pxStText"); if(t&&lab) t.textContent=PX_STATUS+" \u00B7 "+lab;
      });
    },{rootMargin:'-45% 0px -50% 0px',threshold:0});
    var els=[document.getElementById("px-hero")];
    PXS.forEach(function(p){ els.push(document.getElementById("page-"+p[0])); });
    els.forEach(function(el){ if(el) io.observe(el); });
  })();

  (function pxClock(){
    var d=new Date();
    var c=document.getElementById("pxStClock");
    if(c) c.textContent="UTC "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");
    setTimeout(pxClock,20000);
  })();

  (function(){
    var d=document.getElementById("thDark"), l=document.getElementById("thLight"), r=document.documentElement;
    function set(mode){
      r.classList.toggle("light", mode==="light");
      d.className=(mode==="light"?"":"on"); l.className=(mode==="light"?"on":"");
      if(window.Plotly){ Array.prototype.forEach.call(document.querySelectorAll(".plot,.dp-gex-plot,.sm-plot"),
        function(p){ try{ Plotly.Plots.resize(p); }catch(e){} }); }
    }
    d.addEventListener("click",function(){set("dark");});
    l.addEventListener("click",function(){set("light");});
  })();

  // ---------- hero tiles ----------
  (function(){
    function el(i){ return document.getElementById(i); }
    function n1(v){ return (v==null||isNaN(v))?"\u2014":(Math.round(v*10)/10).toFixed(1); }
    function sg(v){ return v>0?"+":""; }
    function bars(box,vals){
      if(!box) return; box.innerHTML="";
      var mx=Math.max.apply(null,vals)||1;
      vals.forEach(function(v,i){ var b=document.createElement("i");
        b.style.height=Math.max(10,Math.round(v/mx*46))+"px"; if(i%2===0) b.className="a"; box.appendChild(b); });
    }
    getJSON("macro").then(function(d){
      var reg=(d.regime||"\u2014").replace(/_/g," ");
      el("hRegName").textContent=reg;
      el("hRegConf").textContent=Math.round((d.confidence||0)*100)+"%";
      el("hRegAsof").textContent=d.asof||"";
      el("hRegDot").style.background=(d.regime==="NO_CLEAR")?"#E8792B":"#79C286";
      PX_STATUS="Regime "+reg;
      el("pxStText").textContent=PX_STATUS+" \u00B7 Mission Control";
      var ip=d.inputs||{};
      if(ip.vix!=null){
        el("hVix").textContent=n1(ip.vix);
        el("hVixBar").style.width=Math.min(100,Math.round(ip.vix/40*100))+"%";
        if(ip.vix_3m_chg!=null) el("hVixSub").textContent=sg(ip.vix_3m_chg)+n1(ip.vix_3m_chg)+"% over 3 months";
      }
    }).catch(function(){ el("hRegName").textContent="macro.json unavailable"; el("hRegDot").style.background="#D9534F"; });

    getJSON("gex").then(function(d){
      var o=d.overview||{}, neg=(o.net_gex_B||0)<0;
      el("hGex").textContent=(o.net_gex_B!=null?sg(o.net_gex_B)+o.net_gex_B:"\u2014");
      el("hGex").parentNode.style.color=neg?"#D9534F":"#79C286";
      el("hGexReg").textContent=o.regime||"\u2014";
      el("hGexReg").style.color=neg?"#D9534F":"#79C286";
      if(o.gamma_flip!=null) el("hGexFlip").textContent="Flip "+o.gamma_flip.toLocaleString()+
        (o.dist_to_flip_pct!=null?" \u00B7 "+sg(o.dist_to_flip_pct)+o.dist_to_flip_pct+"%":"");
    }).catch(function(){ el("hGexReg").textContent="not loaded"; });

    getJSON("stocks").then(function(d){
      var st=d.stocks||[], m=d.meta||{};
      el("hGates").textContent=(m.gate_passers!=null?m.gate_passers:st.length);
      el("hBreak").textContent=(m.breakouts!=null?m.breakouts:st.filter(function(x){return x.breakout;}).length);
      el("hUni").textContent=st.length.toLocaleString();
      bars(el("hBars1"),[6,9,5,11,7,12,8,4]);
      bars(el("hBars2"),[4,7,10,6,9,5,8,11]);
      var pts=st.slice(0,24).map(function(x){return x.trade_score||50;});
      if(pts.length>1){
        var mx=Math.max.apply(null,pts), mn=Math.min.apply(null,pts);
        el("hSpark").setAttribute("d",pts.map(function(v,i){
          return (i?"L":"M")+(i/(pts.length-1)*200).toFixed(1)+" "+(42-(v-mn)/((mx-mn)||1)*38).toFixed(1);
        }).join(" "));
      }
    }).catch(function(){});
  })();

})();
</script>

</body>
</html>

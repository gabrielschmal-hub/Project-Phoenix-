  // ---- THE BRIEF ---------------------------------------------------------
  // Written from the files, never invented. Every clause is conditional on the
  // underlying number existing; anything missing is simply left unsaid.
  function mktBrief(){
    var el=document.getElementById("briefBody"); if(!el) return;
    var m=(C&&C.macro)||null, mi=(m&&m.inputs)||{}, g=C&&C.gex, ov=(g&&g.overview)||null;
    var ind=indData||[];
    if(!mktSeries&&!m&&!ov){ el.innerHTML='<div class="loading">Waiting for market data\u2026</div>'; return; }

    function pc(v,d){ return (v>=0?"+":"\u2212")+Math.abs(+v).toFixed(d==null?1:d)+"%"; }
    function hl(v,txt,d){ return '<span class="hl" style="color:'+(v>=0?"var(--green)":"var(--red)")+'">'+(txt||pc(v,d))+'</span>'; }
    function dstr(s){ if(!s) return ""; var p=String(s).slice(0,10).split("-");
      if(p.length<3) return String(s);
      var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return M[+p[1]-1]+" "+(+p[2]); }
    function chg(a,b){ return (a!=null&&b)?((a-b)/b*100):null; }

    var S=(mktSeries&&mktSeries.all)||[];
    var last=mktSeries?mktSeries.last:null, prev=mktSeries?mktSeries.prev:null;
    var html="";

    // ---------------- header ----------------
    var d1s=last&&last.date?dstr(last.date):"", d0s=prev&&prev.date?dstr(prev.date):"";
    var dLong="";
    if(last&&last.date){
      var dd=new Date(last.date+"T00:00:00");
      if(!isNaN(dd)) dLong=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dd.getDay()]+" "+d1s+", "+dd.getFullYear();
    }
    html+='<div class="brf-top"><span class="brf-ttl">Daily brief'+(dLong?' \u00b7 '+dLong:(d1s?' \u00b7 '+d1s:''))+'</span>'+
      '<span class="brf-sub">'+(d1s&&d0s?(d1s+" close vs "+d0s):"")+'</span></div>';

    // ---------------- 1. YESTERDAY ----------------
    if(last&&prev){
      var spxD=chg(last.spx,prev.spx), ndxD=chg(last.ndx,prev.ndx), dowD=chg(last.dow,prev.dow);
      // headline: characterise the session
      var head;
      if(spxD==null) head="A session without index data.";
      else if(Math.abs(spxD)<0.15 && ndxD!=null && Math.abs(ndxD)>=0.6)
        head="Flat on the surface \u2014 a rotation underneath.";
      else if(spxD>0 && ndxD!=null && ndxD<0) head="The index rose while tech gave back \u2014 money rotated.";
      else if(spxD<0 && ndxD!=null && ndxD<spxD-0.2) head="Tech carried the loss as money rotated out of growth.";
      else if(spxD<=-0.8) head="A broad risk-off session.";
      else if(spxD>=0.8) head="A broad risk-on session.";
      else if(Math.abs(spxD)<0.2) head="A quiet, directionless session.";
      else head=(spxD>0?"A modest advance.":"A modest pullback.");
      var p='<b>'+head+'</b> ';
      var bits=[];
      if(spxD!=null) bits.push('<b>SPX '+(Math.abs(spxD)<0.1?'flat':hl(spxD,null,2))+' at '+(+last.spx).toLocaleString(undefined,{maximumFractionDigits:0})+'</b>');
      if(ndxD!=null) bits.push('<b>NDX '+hl(ndxD,null,2)+' to '+(+last.ndx).toLocaleString(undefined,{maximumFractionDigits:0})+'</b>');
      if(dowD!=null) bits.push('Dow '+hl(dowD,null,2));
      if(bits.length) p+='The headline indices: '+bits.join(", ")+'. ';
      // rotation from industries
      var key=null,lbl="";
      ["d1","w1","m1"].forEach(function(k){ if(!key&&ind.some(function(x){return x[k]!=null;})){key=k;lbl=(k==="d1"?"on the day":k==="w1"?"on the week":"on the month");} });
      if(key){
        var so=ind.filter(function(x){return x[key]!=null&&(x.mcap_B||0)>50;}).sort(function(a,b){return b[key]-a[key];});
        if(so.length>=4){
          var L=so.slice(0,3).map(function(x){return '<b>'+x.industry+' '+hl(x[key])+'</b>';});
          var G=so[so.length-1];
          p+='The rotation was the real story: '+L.join(", ")+' led '+lbl+' while <b>'+G.industry+' '+hl(G[key])+'</b> lagged. ';
        }
      }
      // vol, commodities, rates
      var vxD=chg(last.vix,prev.vix);
      if(last.vix!=null) p+='VIX '+(vxD!=null&&vxD<0?'fell':'rose')+' to <b>'+(+last.vix).toFixed(2)+'</b>'+
        (vxD!=null?' ('+(vxD>=0?"+":"\u2212")+Math.abs(last.vix-prev.vix).toFixed(2)+')':'')+
        (last.vix<16?' \u2014 about as calm as it gets':last.vix>25?' \u2014 options pricing real stress':'')+'. ';
      var cm=[];
      if(last.wti!=null){ var wD=chg(last.wti,prev.wti);
        cm.push('oil '+(wD!=null&&Math.abs(wD)>=0.8?(wD>0?'firmed':'eased'):'steady')+' (WTI $'+(+last.wti).toFixed(2)+')'); }
      if(last.gold!=null){ var gD=chg(last.gold,prev.gold);
        cm.push('gold '+(gD!=null?(gD>=0?'up ':'down ')+Math.abs(gD).toFixed(1)+'% to '+(+last.gold).toLocaleString(undefined,{maximumFractionDigits:0}):'at '+(+last.gold).toFixed(0))); }
      if(last.tnx!=null&&prev.tnx!=null){ var bp=Math.round((last.tnx-prev.tnx)*10);
        if(Math.abs(bp)>=1) cm.push('the 10-year '+(bp>0?'up':'down')+' '+Math.abs(bp)+'bp to '+(last.tnx/10).toFixed(2)+'%'); }
      if(last.dxy!=null){ var dxD=chg(last.dxy,prev.dxy);
        if(dxD!=null&&Math.abs(dxD)>=0.25) cm.push('the dollar '+hl(dxD,null,2)); }
      if(cm.length) p+=cm.join(", ").replace(/^./,function(c){return c.toUpperCase();})+'. ';
      // dealer positioning, in plain words
      if(ov&&ov.regime){
        var neg=(ov.net_gex_B||0)<0;
        p+='Dealers sit in <b style="color:'+(neg?"var(--red)":"var(--green)")+'">'+ov.regime+'</b>'+
           (ov.net_gex_B!=null?' ('+(ov.net_gex_B>=0?"+":"")+ov.net_gex_B.toFixed(1)+'B)':'')+', '+
           (neg?'so hedging runs <b>with</b> the move and ranges widen'
               :'so hedging runs <b>against</b> the move and price gets pinned')+
           (ov.gamma_flip?'; the flip sits at <b>'+ov.gamma_flip.toLocaleString()+'</b>':'')+'. ';
      }
      if(m&&m.regime) p+='Regime holds <b>'+m.regime+'</b>.';
      html+='<div class="brf-block"><div class="brf-k">Yesterday ('+d1s+') vs '+d0s+'</div><div class="brf-p">'+p+'</div></div>';
    }

    // ---------------- 2. WEEK BEFORE ----------------
    if(S.length>=6){
      var wEnd=S[S.length-1], wStart=S[Math.max(0,S.length-6)];
      var pEnd=wStart, pStart=S[Math.max(0,S.length-11)];
      var wSpx=chg(wEnd.spx,wStart.spx);
      var pSpx=chg(pEnd.spx,pStart.spx);
      if(pSpx!=null){
        var ph;
        if(pSpx<=-1.5) ph="A risk-off week with defensive rotation.";
        else if(pSpx<=-0.4) ph="A softer week \u2014 the market gave ground.";
        else if(pSpx>=1.5) ph="A strong week; risk appetite returned.";
        else if(pSpx>=0.4) ph="A quietly constructive week.";
        else ph="A flat week that went nowhere.";
        var wp='<b>'+ph+'</b> The prior week saw the S&P '+hl(pSpx,null,1)+' to <b>'+(+pEnd.spx).toLocaleString(undefined,{maximumFractionDigits:0})+'</b>';
        var wn=chg(pEnd.ndx,pStart.ndx);
        if(wn!=null) wp+=', with the Nasdaq '+hl(wn,null,1);
        wp+='. ';
        // NOTE: no per-industry history is stored, only a current snapshot, so
        // the weekly recap deliberately stays on index/vol/rates/commodities
        // rather than restating today's rotation as though it were last week's.
        var brd=chg(pEnd.rut,pStart.rut);
        if(brd!=null&&wn!=null&&Math.abs(brd-wn)>=0.8)
          wp+='Small caps '+hl(brd,null,1)+' against the Nasdaq\u2019s '+hl(wn,null,1)+
              (brd>wn?' \u2014 breadth held up better than the megacaps':' \u2014 the damage went well beyond tech')+'. ';
        if(pEnd.vix!=null&&pStart.vix!=null)
          wp+='VIX moved '+(+pStart.vix).toFixed(1)+' \u2192 '+(+pEnd.vix).toFixed(1)+', ';
        if(pEnd.wti!=null&&pStart.wti!=null){
          var ow=chg(pEnd.wti,pStart.wti);
          wp+='oil '+(ow>=0?'firmed':'slid')+' to $'+(+pEnd.wti).toFixed(2)+', ';
        }
        if(mi.hy!=null) wp+='and HY credit sat at <b>'+mi.hy+'bp</b>. ';
        else wp=wp.replace(/,\s*$/,". ");
        if(pEnd.tnx!=null&&pStart.tnx!=null){
          var rb=Math.round((pEnd.tnx-pStart.tnx)*10);
          if(Math.abs(rb)>=2) wp+='Rates '+(rb>0?'backed up':'eased')+' '+Math.abs(rb)+'bp on the 10-year. ';
        }
        if(wSpx!=null&&pSpx!=null){
          wp+=(pSpx<0&&wSpx>0)?'That pullback set up this week\u2019s bounce.'
             :(pSpx>0&&wSpx<0)?'This week has given some of that back.'
             :'This week has carried the same direction.';
        }
        html+='<div class="brf-block wk"><div class="brf-k">Week before \u00b7 recap (week ending '+dstr(pEnd.date)+')</div><div class="brf-p">'+wp+'</div></div>';
      }
    }

    // ---------------- 3. WATCH LIST ----------------
    var watch=[];
    if(ov&&ov.gamma_flip&&ov.spx_spot){
      var above=ov.spx_spot>ov.gamma_flip;
      watch.push(["HIGH", above
        ? 'Losing <b>'+ov.gamma_flip.toLocaleString()+'</b> flips dealers to amplifying \u2014 ranges widen, selloffs run further than they should'
        : 'Reclaiming <b>'+ov.gamma_flip.toLocaleString()+'</b> flips dealers back to dampening \u2014 until then, moves extend']);
      var L3=(g&&g.levels)||{};
      if(L3.put_wall&&L3.put_wall.strike&&ov.spx_spot>L3.put_wall.strike)
        watch.push(["HIGH",'A break of the put wall at <b>'+L3.put_wall.strike.toLocaleString()+'</b> removes the largest block of supportive hedging']);
      if(L3.call_wall&&L3.call_wall.strike&&ov.spx_spot<L3.call_wall.strike)
        watch.push(["MED",'Rallies into <b>'+L3.call_wall.strike.toLocaleString()+'</b> meet the call wall, where dealer selling usually caps the move']);
    }
    if(last&&last.vix!=null){
      var v=+last.vix;
      if(v<16) watch.push(["MED",'VIX at '+v.toFixed(1)+' \u2014 hedges are cheap and complacency is what makes gaps violent']);
      else if(v>25) watch.push(["HIGH",'VIX at '+v.toFixed(1)+' \u2014 size on the assumption ranges stay wide']);
    }
    if(mi.wti_3m!=null&&mi.wti_3m>15) watch.push(["MED",'Crude +'+mi.wti_3m.toFixed(0)+'% over three months feeds the next inflation print']);
    if(mi.cpi_yoy!=null&&mi.cpi_yoy>3) watch.push(["MED",'CPI at '+mi.cpi_yoy.toFixed(1)+'% keeps the easing path shut']);
    if(mi.dd!=null&&mi.dd<-5) watch.push(["LOW",'Index '+Math.abs(mi.dd).toFixed(1)+'% off the high \u2014 far enough that trend systems start flipping']);
    if(watch.length){
      var order={HIGH:0,MED:1,LOW:2};
      watch.sort(function(a,b){return order[a[0]]-order[b[0]];});
      html+='<div class="brief-watch"><span class="k">Watch list \u00b7 next session</span>'+
        watch.slice(0,5).map(function(w){
          var c=w[0]==="HIGH"?"var(--red)":w[0]==="MED"?"var(--gold)":"var(--inkFade)";
          return '<div style="margin-bottom:5px"><b style="color:'+c+';font-family:var(--mono);font-size:10px">'+w[0]+':</b> '+w[1]+'</div>';
        }).join("")+'</div>';
    }

    var nEl=document.getElementById("briefNote");
    if(nEl) nEl.textContent=(m&&m.regime)?("regime "+m.regime):"";
    el.innerHTML=html;
  }

  function loadAssets(){
    // [key, label, decimals, prefix, transform]
    var DEFS=[
      ["spx","S&P 500",0,"",null],
      ["ndx","Nasdaq",0,"",null],
      ["dow","Dow",0,"",null],
      ["rut","Russell 2K",0,"",null],
      ["vix","VIX",2,"",null],
      ["tnx","US 10Y",2,"","yield"],
      ["wti","WTI Oil",2,"$",null],
      ["gold","Gold",0,"$",null],
      ["dxy","Dollar",2,"",null],
      ["btc","Bitcoin",0,"$",null]
    ];
    getJSON("macro_series").then(function(d){
      var s=(d&&d.series)||[];
      if(s.length<2){ document.getElementById("assetBand").innerHTML='<div class="loading">No series data yet.</div>'; return; }
      var last=s[s.length-1], prev=s[s.length-2];
      var cells=DEFS.map(function(def){
        var k=def[0], name=def[1], dp=def[2], pre=def[3], tf=def[4];
        var cur=last[k], pr=prev[k];
        if(cur===null||cur===undefined) return null;
        if(tf==="yield"){ cur=cur/10; if(pr!=null) pr=pr/10; }  // ^TNX is yield x10
        var chg=(pr!==null&&pr!==undefined&&pr!==0)?((cur-pr)/pr*100):null;
        var invert=(k==="vix");
        var pos=chg===null?null:(invert?chg<0:chg>=0);
        var color=pos===null?"var(--inkLight)":(pos?"var(--green)":"var(--red)");
        var accent=pos===null?"var(--inkFade)":(pos?"var(--greenSoft)":"var(--redSoft)");
        var val=pre+Number(cur).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp})+(tf==="yield"?"%":"");
        var chgstr=chg===null?"":((chg>0?"+":"")+chg.toFixed(2)+"%");
        return cell(name,val,chgstr,color,accent);
      }).filter(Boolean);
      // duplicate the track so the marquee loops seamlessly
      var track=cells.join("")+cells.join("");
      document.getElementById("assetBand").innerHTML='<div class="marquee-track">'+track+'</div>';
    }).catch(function(e){ document.getElementById("assetBand").innerHTML='<div class="err">Assets: couldn\'t load macro_series.json.</div>'; });

    function cell(name,val,chg,color,accent){
      return '<div class="asset-cell">'+(accent?'<div class="accent" style="background:'+accent+'"></div>':'')+
        '<span class="an">'+name+'</span>'+
        '<span class="av">'+val+'</span>'+
        '<span class="ac" style="color:'+(color||"var(--inkLight)")+'">'+chg+'</span>'+
      '</div>';
    }
  }

  // ----- calendar (manual events.json) -----
  var calData=null, calMonth=null;
  function loadCalendar(){
    getJSON("events").then(function(d){
      calData=(d&&d.events)||[];
      renderCalendar();
    }).catch(function(e){ document.getElementById("calStrip").innerHTML='<div class="loading">No calendar yet. Add events.json to outputs/.</div>'; });
  }
  function renderCalendar(){
    var today=new Date().toISOString().slice(0,10);
    var evts=calData.filter(function(e){return e.date>=today;}).sort(function(a,b){return a.date<b.date?-1:1;});
    if(!evts.length){ document.getElementById("calStrip").innerHTML='<div class="loading">No upcoming events. Add them to events.json.</div>'; return; }
    // months present, in order
    var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var months=[];
    evts.forEach(function(e){ var k=e.date.slice(0,7); if(months.indexOf(k)<0) months.push(k); });
    if(!calMonth || months.indexOf(calMonth)<0) calMonth=months[0];
    // filter buttons
    var seg='<div class="seg" id="calSeg">'+months.map(function(k){
      var mi=parseInt(k.slice(5,7),10)-1; var lbl=MON[mi];
      return '<button data-m="'+k+'"'+(k===calMonth?' class="on"':'')+'>'+lbl+'</button>';
    }).join("")+'</div>';
    document.getElementById("calNote").innerHTML="";
    // put the seg into the tile header note area
    var head=document.querySelector(".a-cal .thead");
    var existingSeg=head.querySelector(".seg");
    if(existingSeg) existingSeg.remove();
    head.insertAdjacentHTML("beforeend", seg);
    head.querySelector("#calSeg").addEventListener("click",function(ev){
      var b=ev.target.closest("button"); if(!b) return;
      calMonth=b.dataset.m; renderCalendar();
    });
    // grid of this month's events
    var monthEvts=evts.filter(function(e){return e.date.slice(0,7)===calMonth;});
    var grid=monthEvts.map(function(e){
      var imp=(e.impact||"").toLowerCase(), cls=imp==="high"?"hi":imp==="med"?"med":"";
      var dt=new Date(e.date+"T00:00:00");
      var dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
      var day=dt.getDate();
      return '<div class="cal-card '+cls+'"><div class="cal-date">'+dow+' '+day+'</div><div class="cal-evt">'+(e.title||"")+'</div>'+(e.note?'<div class="cal-in">'+e.note+'</div>':'')+'</div>';
    }).join("");
    document.getElementById("calStrip").innerHTML='<div class="cal-grid">'+grid+'</div>';
  }

      '<span data-s="daily_pct" class="num">Day</span><span data-s="opp_score" class="num">Score</span>'+
      '<span data-s="trade_score" class="num">Trade</span><span data-s="invest_score" class="num">Invest</span>'+
      '<span data-s="mcap_B" class="num">Cap</span><span class="num">Add</span></div>';
    var rows=arr.slice(0,200).map(function(s){
      var dp=s.daily_pct, dps=(dp==null)?"\u2014":((dp>=0?"+":"")+dp.toFixed(1)+"%");
      var dpc=dp==null?"var(--inkFade)":(dp>=0?"var(--green)":"var(--red)");
      var inR=trHas(s.ticker), inT=trHasReady(s.ticker);

      // headline score pill: opp_score, colored by strength (Winston's badge)
      var sc=scrBook==="trade"?s.trade_score:scrBook==="invest"?s.invest_score:
             (s.opp_score!=null?Math.round(s.opp_score):(s.invest_score!=null?Math.max(s.trade_score||0,s.invest_score||0):null));
      var pillCls=sc==null?"s-lo":sc>=75?"s-hi":sc>=55?"s-mid":"s-lo";

      return '<div class="scr-tr'+(s.passer===false?' nearmiss':'')+'" data-row-tk="'+s.ticker+'">'+
        '<span class="rk">'+(s.rank||"\u2014")+'</span>'+
        '<span class="nmcell"><span class="tk">'+s.ticker+(s.breakout?' \u25B2':'')+'<span class="tk-arrow">\u203A</span></span><span class="nm">'+nm+'</span></span>'+

  // ---- Smart Money screener: rank the universe by disclosed institutional +
  // congressional activity. Aggregates computed from the two loaded files. ----
  var scrSmSort="instbuy";   // instbuy | congress | net
  // Midpoint of a filed dollar range. Handles both the long form
  // ("$1,000,001 - $5,000,000") and the shorthand ("$1M - $5M", "$250K - $500K").
  function _amtOne(tok){
    if(!tok) return null;
    var m=String(tok).replace(/[$,\s]/g,"").match(/^([\d.]+)([KMB])?$/i);
    if(!m) return null;
    var v=parseFloat(m[1]); if(isNaN(v)) return null;
    var u=(m[2]||"").toUpperCase();
    return v*(u==="B"?1e9:u==="M"?1e6:u==="K"?1e3:1);
  }
  function _amtMid(s){
    var str=String(s||"");
    var parts=str.split(/\s*[-\u2013]\s*/);
    if(parts.length>=2){
      var a=_amtOne(parts[0]), b=_amtOne(parts[1]);
      if(a!=null&&b!=null) return (a+b)/2;
      if(a!=null) return a;
      if(b!=null) return b;
    }
    var one=_amtOne(str);
    return one!=null?one:0;
  }
  function _smAgg(tk){
    var inst=(dpInstit&&dpInstit[tk])||[], cg=(dpCongress&&dpCongress[tk])||[];
    var instBuyVal=0,instSellVal=0,instBuy=0,instSell=0;
    inst.forEach(function(h){
      if(h.action==="NEW"||h.action==="ADD"){ instBuy++; instBuyVal+=h.value_usd||0; }
      else if(h.action==="TRIM"||h.action==="EXIT"){ instSell++; instSellVal+=h.value_usd||0; }
    });
    var cgBuy=0,cgSell=0,cgBuyN=0,cgSellN=0,latest="";
    cg.forEach(function(t){
      var mid=_amtMid(t.amount);
      if(t.side==="buy"){ cgBuy++; cgBuyN+=mid; } else if(t.side==="sell"){ cgSell++; cgSellN+=mid; }
      if(t.date>latest) latest=t.date;
    });
    inst.forEach(function(h){ /* institutions have no per-row date in 13F deltas */ });
    return {tk:tk,inst:inst,cg:cg,instBuyVal:instBuyVal,instSellVal:instSellVal,
            instBuy:instBuy,instSell:instSell,cgBuy:cgBuy,cgSell:cgSell,
            cgBuyN:cgBuyN,cgSellN:cgSellN,latest:latest,
            netFlow:(instBuyVal-instSellVal)+(cgBuyN-cgSellN),
            activity:instBuy+instSell+cgBuy+cgSell};
  }
  function _usd(v){ return v>=1e9?"$"+(v/1e9).toFixed(1)+"B":v>=1e6?"$"+(v/1e6).toFixed(0)+"M":v>=1e3?"$"+Math.round(v/1e3)+"K":"$"+Math.round(v); }
  function renderSmartMoney(){
    var el=document.getElementById("scrTable"), cEl=document.getElementById("scrCount");
    if(dpCongress===null||dpInstit===null){ el.innerHTML='<div class="loading">\u2026</div>'; dpEnsureSmart(function(){renderSmartMoney();}); return; }
    var tks={};
    Object.keys(dpInstit||{}).forEach(function(t){tks[t]=1;});
    Object.keys(dpCongress||{}).forEach(function(t){tks[t]=1;});
    var rows=Object.keys(tks).map(_smAgg);
    if(scrSearch) rows=rows.filter(function(r){return r.tk.toLowerCase().indexOf(scrSearch)>=0;});
    if(scrSmSort==="instbuy") rows.sort(function(a,b){return b.instBuyVal-a.instBuyVal;});
    else if(scrSmSort==="congress") rows.sort(function(a,b){return (b.cgBuy-b.cgSell)-(a.cgBuy-a.cgSell)||b.cgBuyN-a.cgBuyN;});
    else rows.sort(function(a,b){return b.netFlow-a.netFlow;});
    rows.forEach(function(r,i){r.rank=i+1;});
    if(cEl){ cEl.innerHTML=rows.length+' tickers with disclosed activity \u00b7 '+
      '<span class="sm-sort" data-s="instbuy">Biggest inst. buys</span> '+
      '<span class="sm-sort" data-s="congress">Congress buying</span> '+
      '<span class="sm-sort" data-s="net">Net flow</span>'; cEl.style.color="var(--inkFade)"; }
    if(!rows.length){
      el.innerHTML='<div class="promo-empty" style="padding:14px 4px">No smart-money data yet. congress_trades.json is seeded; institutional_holdings.json populates on the first run of the smart_money workflow (SEC 13F fetch).</div>';
    } else {
      var head='<div class="scr-th sm-th"><span>#</span><span>Stock</span>'+
        '<span class="num">Inst. buy $</span><span class="num">Inst +/\u2212</span>'+
        '<span class="num">Congress</span><span class="num">Net flow</span></div>';
      el.innerHTML=head+rows.slice(0,120).map(function(r){
        var known=scrData&&scrData.some(function(s){return s.ticker===r.tk;});
        var instNet=(r.instBuy-r.instSell);
        var cgTxt=(r.cgBuy?'<span style="color:var(--green)">'+r.cgBuy+'B</span>':'')+(r.cgSell?' <span style="color:var(--red)">'+r.cgSell+'S</span>':'')||'\u2014';
        var netCol=r.netFlow>=0?"var(--green)":"var(--red)";
        return '<div class="scr-tr sm-tr" data-row-tk="'+r.tk+'">'+
          '<span class="rk">'+r.rank+'</span>'+
          '<span class="nmcell"><span class="tk">'+r.tk+'<span class="tk-arrow">\u203a</span></span>'+
            '<span class="nm">'+(r.inst.length?r.inst[0].manager.replace(/\s*\(.*\)/,""):(r.cg.length?r.cg[0].member:""))+'</span></span>'+
          '<span class="num" style="font-weight:700">'+(r.instBuyVal?_usd(r.instBuyVal):"\u2014")+'</span>'+
          '<span class="num">'+(instNet>0?'<span style="color:var(--green)">+'+instNet+'</span>':instNet<0?'<span style="color:var(--red)">'+instNet+'</span>':"\u2014")+'</span>'+
          '<span class="num">'+cgTxt+'</span>'+
          '<span class="num" style="color:'+netCol+';font-weight:700">'+(r.netFlow?(r.netFlow>=0?"+":"\u2212")+_usd(Math.abs(r.netFlow)).replace("$","$"):"\u2014")+'</span>'+
        '</div>';
      }).join("")+'<div class="promo-empty" style="margin-top:10px">Inst. buy $ = 13F value added (NEW+ADD) last quarter. Congress = # buy/sell PTRs. Net flow = institutional $ delta + congressional notional (range midpoints). All disclosures are lagged.</div>';
      el.querySelectorAll(".sm-tr").forEach(function(row){ row.style.cursor="pointer"; row.addEventListener("click",function(){ scrOpenTicker(row.dataset.rowTk); }); });
    }
    // sort chips
    document.querySelectorAll(".sm-sort").forEach(function(c){
      c.classList.toggle("on",c.dataset.s===scrSmSort);
      c.addEventListener("click",function(){ scrSmSort=c.dataset.s; renderSmartMoney(); });
    });
  }

  // ---- E3b Stage 0: GEX-eligible universe (reads outputs/gex_universe.json) ----

      '<span class="num">Rules</span><span class="num">Depth</span>'+
      '<span class="num">Books</span><span class="num">Status</span></div>';
    var rows=arr.map(function(r){
      var known=true;   // every GEX row opens a detail page (stub if not in screener data)
      var vol=r.avg_opt_contracts_day!=null?(r.avg_opt_contracts_day>=1e6?(r.avg_opt_contracts_day/1e6).toFixed(2)+"M":Math.round(r.avg_opt_contracts_day/1e3)+"k"):"\u2014";

      return '<div class="scr-tr" data-row-tk="'+(known?r.ticker:"")+'">'+
        '<span class="rk">'+(r.rank||"\u2014")+'</span>'+

  function scrBar(label, val, max, col){

      scrBar("Invest", stock.invest_score, 100, stock.invest_score>=60?"var(--green)":"var(--amber)")+

        '<span class="mk">Gross Margin</span><span class="mv">'+pct(q.gross_margin)+'</span>'+

        '<span class="mk">P/E</span><span class="mv">'+(fd.pe!=null?fd.pe.toFixed(1):"\u2014")+'</span>'
      ) : '<span class="mk" style="grid-column:1/-1;color:var(--inkFade)">No fundamentals on file for '+tk+'.</span>')+
      '</div></div>';

  // ---- open the full ticker detail page from the screener ----

  // ----- editable breakout picks with Claude-written thesis -----
  var pickList=[]; // array of tickers currently in the picks panel
  function initPicks(){
    // seed with engine's breakout picks that have levels (top 6 by trade score)
    pickList=scrData.filter(function(s){return s.breakout && s.levels;})
      .sort(function(a,b){return (b.trade_score||0)-(a.trade_score||0);})
      .slice(0,6).map(function(s){return s.ticker;});
  }
  function addPick(stock){
    if(!stock) return;
    if(pickList.indexOf(stock.ticker)<0){ pickList.unshift(stock.ticker); renderPicks(); }
  }
  function removePick(tk){
    var i=pickList.indexOf(tk); if(i>=0){ pickList.splice(i,1); renderPicks(); }
  }
  function renderPicks(){
    if(!scrData) return;
    document.getElementById("picksNote").textContent=pickList.length+" picks";
    if(!pickList.length){ document.getElementById("picksScroll").innerHTML='<div class="loading">No picks. Add stocks with the \u2605 button in the screener.</div>'; return; }
    var byTk={}; scrData.forEach(function(s){byTk[s.ticker]=s;});
    document.getElementById("picksScroll").innerHTML=pickList.map(function(tk,idx){
      var s=byTk[tk]; if(!s) return "";

        ('<div class="pick-levels">'+
          '<div class="pl"><div class="k">Resist</div><div class="v" style="color:var(--red)">'+(L.resistance!=null?L.resistance:"\u2014")+'</div></div>'+
          '<div class="pl"><div class="k">Support</div><div class="v" style="color:var(--green)">'+(L.support!=null?L.support:"\u2014")+'</div></div>'+
          '<div class="pl"><div class="k">50d</div><div class="v">'+(L.ma50!=null?L.ma50:"\u2014")+'</div></div>'+
          '<div class="pl"><div class="k">Vol</div><div class="v">'+(L.atr_pct!=null?L.atr_pct+"%":"\u2014")+'</div></div>'+
        '</div>') :
        ('<div style="font-family:var(--mono);font-size:8.5px;color:var(--inkFade);margin-top:5px">No breakout levels \u2014 thesis will use scores + regime only.</div>');
      var px = (L&&L.last!=null)?L.last.toLocaleString():"";
      return '<div class="pick" data-tk="'+tk+'">'+
        '<div class="pick-head"><span class="tk">'+s.ticker+'</span><span class="ind">'+(s.name||s.industry||"")+'</span>'+

        levelsHtml+
        '<div class="thesis" id="thesis-'+idx+'"></div>'+

      '</div>';
    }).join("");
    var ps=document.getElementById("picksScroll");
    ps.querySelectorAll(".thesis-btn").forEach(function(btn){
      btn.addEventListener("click",function(){
        var idx=+this.dataset.idx, s=byTk[this.dataset.tk];
        generateThesis(s, idx, this);
      });

    ps.querySelectorAll(".pick-rm").forEach(function(x){
      x.addEventListener("click",function(){ removePick(this.dataset.tk); });

  function generateThesis(stock, idx, btn){
    var box=document.getElementById("thesis-"+idx);
    btn.disabled=true; btn.textContent="Thinking\u2026";
    box.innerHTML='<div class="gen">Writing thesis\u2026</div>';
    // batch-first (C1): today's Action may already have written this thesis
    getStoredThesis(stock.ticker, function(t){
      if(t&&t.text){
        box.innerHTML=formatThesis(t.text)+'<div class="gen" style="margin-top:6px">\u2713 from today\u2019s batch run</div>';
        btn.style.display="none"; return;
      }
      generateThesisLive(stock, idx, btn, box);
    });
  }
  function generateThesisLive(stock, idx, btn, box){
    var L=stock.levels||{};
    var regime=(C.macro&&C.macro.regime)||"NO_CLEAR";
    var hasLevels=stock.levels!=null;
    var levelLine = hasLevels ?
      ("Last price "+L.last+". Resistance/base-high "+L.resistance+". Support/swing-low "+L.support+". 50-day MA "+L.ma50+". Weekly volatility ~"+L.atr_pct+"%. ") :
      ("No precise breakout price levels are available for this stock \u2014 do NOT invent specific prices; give entry/exit guidance in relative terms (e.g. 'on a breakout above the recent base high with volume', 'stop below the base'). ");
    var prompt=
      "You are a senior hedge fund PM writing a concise trade thesis for a stock. "+
      "Be direct and specific. Use ONLY the data provided; do not invent fundamentals. "+
      "Macro regime: "+regime+". "+
      "Stock: "+stock.ticker+" ("+(stock.name||stock.industry||"")+"). "+
      levelLine+
      "Trade score "+stock.trade_score+"/100, Invest score "+stock.invest_score+"/100, "+
      "volume state "+stock.vol_state+", position vs 2yr high "+stock.pos_vs_high+"%. "+
      "Write 4 short sections with these exact headers on their own lines: THESIS, ENTRY, EXITS, SIZING. "+
      "THESIS: 2 sentences on why this setup, tied to the breakout and regime. "+
      "ENTRY: "+(hasLevels?"a specific entry trigger and price using the levels given. ":"an entry trigger in relative terms. ")+
      "EXITS: "+(hasLevels?"a stop price (below support/base) and a first target, with the logic. ":"stop and target logic in relative terms. ")+
      "SIZING: position sizing guidance given the volatility and scores, in relative terms (e.g. half vs full risk unit). "+
      "Keep the whole thing under 160 words. Plain text, no markdown symbols.";
    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    }).then(function(r){return r.json();}).then(function(data){
      var text=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
      box.innerHTML=formatThesis(text);
      btn.style.display="none";
    }).catch(function(err){
      box.innerHTML='<div class="gen" style="color:var(--red)">Thesis generation failed ('+err.message+'). '+THESIS_HELP+'</div>';
      btn.disabled=false; btn.textContent="Retry \u2192";
    });
  }
  function formatThesis(text){
    // bold the section headers
    var html=text.replace(/\n?(THESIS|ENTRY|EXITS|SIZING)\s*:?/g,'<h5>$1</h5>');
    return html;
  }
  // C1: theses are generated IN THE DAILY BATCH (outputs/theses.json) because
  // the keyless live call only works inside the claude.ai sandbox, never on
  // GitHub Pages. Read the file first; live call is a fallback for artifacts.
  var thesesData=null;
  function getStoredThesis(tk, cb){
    if(thesesData){ cb(thesesData[tk]||null); return; }
    getJSON("theses").then(function(d){
      thesesData=(d&&d.theses)||{}; cb(thesesData[tk]||null);
    }).catch(function(){ thesesData={}; cb(null); });
  }
  var THESIS_HELP='Live generation only works inside claude.ai. On the deployed site, add ANTHROPIC_API_KEY as a GitHub secret \u2014 theses then generate in the daily Action run and appear here automatically.';

  // ================= MISSION CONTROL =================
  // The 10-minute page. Every tile answers a question you'd otherwise have to
  // dig for, and each one ends in an action, not an observation.
  //
  //   Can I trade at all?      -> verdict tile (heat + cool-off, hard gates)
  //   What needs a decision?   -> open positions, sorted by urgency
  //   Where's the market?      -> regime + SPX + VIX, one line each
  //   What's worth a look?     -> today's breakouts, ranked
  //   What's about to move?    -> earnings inside 7 days on names you hold/watch
  //   What did I do wrong?     -> the Council's single sharpest observation
  //
  // Everything computes from data already loaded. No new engine work.

  var MC_HTML =
    '<div class="mc-grid">'+
      '<div class="mc-verdict" id="mcVerdict"><div class="loading">\u2026</div></div>'+
      // SPX candles with gamma levels drawn on — the same renderer Markets uses,
      // with an id suffix because both pages live in the DOM at once.
      '<div class="tile m-spx"><div class="thead"><span class="ttl">S&P 500 \u00b7 Daily</span>'+
        '<span class="tnote"><span id="spxPxMC"></span> <span id="spxChgMC"></span></span></div>'+
        '<div class="tbody"><div class="spx-hover" id="spxHoverMC"></div>'+
          '<div class="plot" id="spxPlotMC"></div></div></div>'+
      '<div class="tile m-gex"><div class="thead"><span class="ttl">GEX \u00b7 SPX</span>'+
        '<span class="tnote" id="gexNoteMC"></span></div>'+
        '<div class="tbody" id="gexBodyMC"><div class="loading">\u2026</div></div></div>'+
      '<div class="tile m-vix"><div class="thead"><span class="ttl">VIX Term</span>'+
        '<span class="tnote" id="vixNoteMC"></span></div>'+
        '<div class="tbody"><div class="plot" id="vixPlotMC"></div></div></div>'+
      '<div class="tile m-pos"><div class="thead"><span class="ttl">Positions</span>'+
        '<span class="tnote" id="mcPosNote"></span></div>'+
        '<div class="tbody" style="overflow-y:auto" id="mcPos"><div class="loading">\u2026</div></div></div>'+
      '<div class="tile m-earn"><div class="thead"><span class="ttl">Earnings</span>'+
        '<span class="tnote" id="mcEarnNote"></span></div>'+
        '<div class="tbody" style="overflow-y:auto" id="mcEarn"><div class="loading">\u2026</div></div></div>'+
      // Industry, not sector ETFs: Layer 2 is industry-level, and when the
      // regime is NO_CLEAR industry rotation is what carries the trade.
      '<div class="tile m-ind"><div class="thead"><span class="ttl">Industry \u00b7 Today</span>'+
        '<span class="tnote" id="mcIndNote">cap-weighted 1d</span></div>'+
        '<div class="tbody" style="overflow-y:auto" id="mcInd"><div class="loading">\u2026</div></div></div>'+
      '<div class="tile m-picks"><div class="thead"><span class="ttl">Setups</span>'+
        '<span class="tnote" id="mcPickNote"></span></div>'+
        '<div class="tbody" style="overflow-y:auto" id="mcPicks"><div class="loading">\u2026</div></div></div>'+
      '<div class="tile m-lesson"><div class="thead"><span class="ttl">\u2726 Edge Leak</span>'+
        '<span class="tnote" id="mcLessNote"></span></div>'+
        '<div class="tbody" id="mcLesson"><div class="loading">\u2026</div></div></div>'+
    '</div>';

  function initMC(){
    trLoad(function(){
      pfLoadCfg();
      var opens=(trLog||[]).filter(function(t){ return t.status==="open"; });
      trFetchAll(opens, function(){ mcRender(); });
      trPreloadFin(opens.concat(trByStatus("plan")), function(){ mcRender(); });
      if(!C.macro) getJSON("macro").then(function(d){ C.macro=d; mcRender(); }).catch(function(){ mcRender(); });
      if(!scrData) getJSON("stocks").then(function(d){ scrData=(d&&d.stocks)||[]; scrMeta=(d&&d.meta)||{}; mcRender(); }).catch(function(){});
      if(!indData) getJSON("industry").then(function(d){ indData=(d&&d.industries)||[]; mcRender(); })
        .catch(function(){ indData=[]; mcRender(); });
      mcRender();
      // charts render into MC-suffixed ids so they can't collide with Markets
      drawSPX("MC");
      drawVIX("MC");
      loadGEX("MC");
    });
  }

  function mcRender(){
    if(!document.getElementById("mcVerdict")) return;
    var s=pfCompute();
    document.getElementById("mcVerdict").innerHTML=mcVerdictTile(s);
    document.getElementById("mcPos").innerHTML=mcPosTile(s);
    document.getElementById("mcInd").innerHTML=mcIndTile();
    document.getElementById("mcPicks").innerHTML=mcPicksTile();
    document.getElementById("mcEarn").innerHTML=mcEarnTile();
    document.getElementById("mcLesson").innerHTML=mcLessonTile(s);
    var pn=document.getElementById("mcPosNote");
    if(pn) pn.textContent=s.open.length?s.open.length+" \u00b7 "+pfUsdS(s.unrealized,0):"none";
    var ln=document.getElementById("mcLessNote");
    if(ln) ln.textContent=pfAcct().label;
    // RULES is assigned lower in the file, so anything reading it must do so at
    // RENDER time, never while building an HTML string at load time.
    var en=document.getElementById("mcEarnNote");
    if(en) en.textContent="next "+RULES.earnDays+"d";
    document.querySelectorAll("#mcPos [data-tk], #mcPicks [data-tk], #mcEarn [data-tk]").forEach(function(el){
      el.onclick=function(){
        var tk=this.getAttribute("data-tk");
        var t=(trLog||[]).filter(function(x){return x.ticker===tk;})[0];
        go("trades");
        if(t) setTimeout(function(){ trOpenDetail(t.id); },60);
      };
    });

  // ---- INDUSTRY MOVERS: today's cap-weighted 1-day, both tails ----
  // Layer 2 is where the edge lives when macro says NO_CLEAR. Showing only
  // winners would hide the rotation — the losing tail is half the signal.
  function mcIndTile(){
    if(!indData) return '<div class="loading">\u2026</div>';
    var arr=indData.filter(function(o){ return o.d1!=null; });
    if(!arr.length) return '<div class="mc-none">No 1-day industry data.<span>Needs a fresh engine run.</span></div>';
    arr.sort(function(a,b){ return b.d1-a.d1; });
    var top=arr.slice(0,5), bot=arr.slice(-3).reverse();
    var note=document.getElementById("mcIndNote");
    if(note) note.textContent=arr.length+" industries \u00b7 1d";
    var max=Math.max.apply(null,arr.map(function(o){return Math.abs(o.d1);}))||1;
    // which industries am I already in? mark them.
    var mine={};
    (trLog||[]).forEach(function(t){ if(t.status==="open"&&t.industry) mine[t.industry]=1; });
    function row(o,dim){
      var v=o.d1, w=Math.min(Math.abs(v)/max*46,46), pos=v>=0;
      var held=mine[o.industry];
      return '<div class="mc-irow'+(dim?' dim':'')+'">'+
        '<span class="in-nm"'+(held?' style="color:var(--gold)"':'')+'>'+
          (held?'\u25CF ':'')+o.industry+'</span>'+
        '<div class="in-bw"><div class="in-mid"></div>'+
          '<div class="in-b" style="'+(pos?"left:50%":"right:50%")+';width:'+w+'%;background:'+
            (pos?"var(--greenSoft)":"var(--redSoft)")+'"></div></div>'+
        '<span class="in-v" style="color:'+(pos?"var(--green)":"var(--red)")+'">'+
          (pos?"+":"")+v.toFixed(2)+'%</span></div>';
    }
    return top.map(function(o){return row(o,false);}).join("")+
      '<div class="mc-isep">weakest</div>'+
      bot.map(function(o){return row(o,true);}).join("");
  }

  // ---- THE VERDICT: can I trade at all, right now ----
  function mcVerdictTile(s){
    var cool=s.coolActive, over=s.openRiskR>RULES.maxHeatR;
    var room=Math.max(0,RULES.maxHeatR-s.openRiskR);
    var v,c,bg,line,act;
    if(cool){
      v="STAND DOWN"; c="var(--red)"; bg="var(--redBg)";
      line=s.curStreak+" losses in a row. Cool-off has "+s.coolRemaining+" day"+(s.coolRemaining===1?"":"s")+" left.";
      act="No new entries. Manage what's open and let the streak break.";
    } else if(over){
      v="NO NEW ENTRIES"; c="var(--red)"; bg="var(--redBg)";
      line="Open risk is "+s.openRiskR.toFixed(2)+"R against a "+RULES.maxHeatR+"R cap \u2014 "+(s.openRiskR-RULES.maxHeatR).toFixed(2)+"R over.";
      act="Close or tighten something before you open anything.";
    } else if(s.curStreak>=RULES.coolOff-2){
      v="CAUTION"; c="var(--amber)"; bg="var(--amberBg)";
      line=s.curStreak+" losses in a row \u2014 "+(RULES.coolOff-s.curStreak)+" more triggers a "+RULES.coolOffDays+"-day stand-down.";
      act="One reduced-size probe at most. Don't push.";
    } else if(!s.open.length && !trByStatus("plan").length){
      v="CLEAR \u00b7 NOTHING ON"; c="var(--inkMed)"; bg="var(--card2)";
      line="No positions, no plans. 1R = "+pfUsd(s.R$,0)+".";
      act="Screener first \u2014 build a plan before the open.";
    } else {
      v="CLEAR TO TRADE"; c="var(--green)"; bg="var(--greenBg)";
      line="Heat "+s.openRiskR.toFixed(2)+"R of "+RULES.maxHeatR+"R \u00b7 room for "+room.toFixed(2)+"R \u00b7 1R = "+pfUsd(s.R$,0)+".";
      act=s.wr<s.beWR && s.n>=5
        ? "Your win rate needs "+pfXN(s.reqPayoff)+" payoff \u2014 don't take anything below it."
        : "Rules are clear. Take only setups that meet the bar.";
    }
    var heatPct=Math.min(100,s.openRiskR/RULES.maxHeatR*100);
    return '<div class="mc-v" style="background:'+bg+';border-color:'+c+'">'+
      '<div class="mcv-l">'+
        '<div class="mcv-chip" style="color:'+c+'">'+v+'</div>'+
        '<div class="mcv-line">'+line+'</div>'+
        '<div class="mcv-act">\u2192 '+act+'</div>'+
      '</div>'+
      '<div class="mcv-r">'+
        '<div class="mcv-g"><div class="gk">HEAT</div>'+
          '<div class="gv" style="color:'+(over?"var(--red)":room<1?"var(--amber)":"var(--green)")+'">'+s.openRiskR.toFixed(2)+'R</div>'+
          '<div class="gbar"><div class="gfill" style="width:'+heatPct+'%;background:'+(over?"var(--red)":room<1?"var(--amber)":"var(--green)")+'"></div></div></div>'+
        '<div class="mcv-g"><div class="gk">STREAK</div>'+
          '<div class="gv" style="color:'+(cool?"var(--red)":s.curStreak>=RULES.coolOff-2?"var(--amber)":"var(--ink)")+'">'+s.curStreak+'/'+RULES.coolOff+'</div>'+
          '<div class="gbar"><div class="gfill" style="width:'+Math.min(100,s.curStreak/RULES.coolOff*100)+'%;background:'+
            (cool?"var(--red)":s.curStreak>=RULES.coolOff-2?"var(--amber)":"var(--greenSoft)")+'"></div></div></div>'+
        '<div class="mcv-g"><div class="gk">EQUITY</div>'+

      '</div>'+

  }

  // ---- OPEN POSITIONS, sorted by what needs you most ----
  function mcPosTile(s){
    if(!s.open.length) return '<div class="mc-none">Nothing open.<span>The screener is where the day starts.</span></div>';
    // urgency: near stop first, then underwater, then the rest
    var rows=s.open.map(function(r){
      var toStop=r.last&&r.stop?(r.last-r.stop)/r.last*100:null;
      var toTgt=r.last&&r.target?(r.target-r.last)/r.last*100:null;
      var urg = toStop!=null&&toStop<3 ? 3 : r.pnl<0 ? 2 : toTgt!=null&&toTgt<3 ? 1 : 0;
      return {r:r,toStop:toStop,toTgt:toTgt,urg:urg};
    }).sort(function(a,b){ return b.urg-a.urg || a.toStop-b.toStop; });

    return rows.map(function(x){
      var r=x.r;
      var act, ac;
      if(x.toStop!=null&&x.toStop<3){ act="Stop "+x.toStop.toFixed(1)+"% away \u2014 decide"; ac="var(--red)"; }
      else if(r.pnl<0){ act="Underwater \u2014 thesis intact?"; ac="var(--amber)"; }
      else if(x.toTgt!=null&&x.toTgt<3){ act="Near target \u2014 take or trail"; ac="var(--green)"; }
      else if(r.R>=1){ act="Let it run \u2014 don't choke it"; ac="var(--green)"; }
      else { act=(x.toStop!=null?x.toStop.toFixed(0)+"% to stop":"no stop")+" \u00b7 "+r.dit+"d"; ac="var(--inkFade)"; }
      return '<div class="mc-row" data-tk="'+r.ticker+'">'+
        '<div class="mr-tk">'+r.ticker+'</div>'+
        '<div class="mr-mid">'+
          '<div class="mr-pnl" style="color:'+(r.pnl>=0?"var(--green)":"var(--red)")+'">'+pfUsdS(r.pnl,0)+
            ' <span class="mr-r">'+pfRS(r.R)+'</span></div>'+
          '<div class="mr-act" style="color:'+ac+'">'+act+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
  }

  // ---- TODAY'S SETUPS: breakouts, ranked, with the level ----
  function mcPicksTile(){
    if(!scrData) return '<div class="loading">\u2026</div>';
    var stale = scrMeta && scrMeta.data_is_fresh===false;
    var note=document.getElementById("mcPickNote");
    if(note){
      note.textContent = stale ? "STALE DATA" : (scrMeta&&scrMeta.latest_bar)||"";
      note.style.color = stale ? "var(--red)" : "var(--inkFade)";
    }
    var held={};
    (trLog||[]).forEach(function(t){ if(t.status==="open"||t.status==="plan") held[t.ticker]=1; });
    var bo=scrData.filter(function(x){ return x.breakout && !held[x.ticker]; })
      .sort(function(a,b){ return (b.opp_score||Math.max(b.trade_score||0,b.invest_score||0))-
                                  (a.opp_score||Math.max(a.trade_score||0,a.invest_score||0)); });
    if(!bo.length) return '<div class="mc-none">No fresh breakouts today.<span>'+
      (stale?"Data is stale \u2014 the engine didn't refresh.":"Nothing cleared the gates. That is an answer, not a gap.")+'</span></div>';
    return bo.slice(0,6).map(function(x){
      var lv=x.levels||{};
      var sc=x.opp_score||Math.max(x.trade_score||0,x.invest_score||0);
      return '<div class="mc-row" data-tk="'+x.ticker+'">'+
        '<div class="mr-tk">'+x.ticker+'<span class="mr-sc">'+sc+'</span></div>'+

          '<div class="mr-ind">'+(x.industry||"")+'</div>'+
          '<div class="mr-act" style="color:var(--inkFade)">'+
            (lv.resistance!=null?'break '+trPx(lv.resistance):'')+
            (lv.support!=null?' \u00b7 stop '+trPx(lv.support):'')+
            (lv.atr_pct!=null?' \u00b7 ATR '+lv.atr_pct+'%':'')+'</div>'+
        '</div>'+
        '<div class="mr-px">'+(lv.last!=null?trPx(lv.last):"\u2014")+
          '<span class="mr-dit">'+(x.industry_mom_3m!=null?(x.industry_mom_3m>=0?"+":"")+x.industry_mom_3m.toFixed(0)+"% ind":"")+'</span></div>'+
      '</div>';
    }).join("");
  }

  // ---- EARNINGS INSIDE THE HOLD WINDOW ----
  function mcEarnTile(){
    var watch={};
    (trLog||[]).forEach(function(t){ if(t.status==="open"||t.status==="plan") watch[t.ticker]=t.status; });
    var rows=[];
    Object.keys(watch).forEach(function(tk){
      var fd=dpFinCache[tk];
      if(!fd) return;
      if(fd.fresh_earnings){ rows.push({tk:tk,d:-1,fresh:true,st:watch[tk],q:fd.fresh_earnings}); return; }
      if(!fd.next_earnings) return;
      var d=Math.round((new Date(fd.next_earnings+"T00:00:00")-new Date())/86400000);
      if(d>=0&&d<=RULES.earnDays) rows.push({tk:tk,d:d,st:watch[tk],date:fd.next_earnings});
    });
    rows.sort(function(a,b){ return a.d-b.d; });
    if(!rows.length) return '<div class="mc-none">No earnings within '+RULES.earnDays+' days.<span>Nothing you hold reports soon.</span></div>';
    return rows.map(function(r){
      if(r.fresh){
        return '<div class="mc-row" data-tk="'+r.tk+'">'+
          '<div class="mr-tk" style="color:var(--gold)">'+r.tk+'</div>'+
          '<div class="mr-mid"><div class="mr-pnl" style="color:var(--gold)">\u2726 REPORTED</div>'+
          '<div class="mr-act">'+String(r.q).slice(0,10)+' \u2014 read the numbers before you act</div></div>'+
          '<div class="mr-px">'+r.st+'</div></div>';
      }
      var c=r.d<=2?"var(--red)":r.d<=7?"var(--amber)":"var(--inkMed)";
      var act = r.st==="open"
        ? (r.d<=7?"Inside the hold window \u2014 size down or exit before it":"Gap risk approaching")
        : "Don't enter into the print";
      return '<div class="mc-row" data-tk="'+r.tk+'">'+
        '<div class="mr-tk">'+r.tk+'</div>'+
        '<div class="mr-mid"><div class="mr-pnl" style="color:'+c+'">'+(r.d===0?"TODAY":r.d===1?"TOMORROW":"IN "+r.d+"D")+'</div>'+
        '<div class="mr-act" style="color:'+c+'">'+act+'</div></div>'+
        '<div class="mr-px">'+r.st+'</div></div>';
    }).join("");
  }

  // ---- THE ONE LESSON: sharpest Council observation, not all five ----
  function mcLessonTile(s){
    if(!s.n) return '<div class="mc-none">No closed trades.<span>The book teaches once you feed it.</span></div>';
    var L=pfLenses(s);
    // pick the leak that costs the most, in priority order
    var pick, who;
    if(L.movedStops>0){ pick=L.psy; who="The Psychologist"; }
    else if(L.spread>2){ pick=L.qua; who="The Quant"; }
    else if(L.badEntries>0){ pick=L.con; who="The Contrarian"; }
    else if(s.n<30){ pick=L.out; who="The Outsider"; }
    else { pick=L.exo; who="The Executioner"; }
    return '<div class="mc-lesson">'+
      '<div class="ml-who">'+who+'</div>'+
      '<div class="ml-body">'+pick+'</div>'+
      '<div class="ml-foot">Full council \u2192 Portfolio</div>'+
    '</div>';
  }


  // ================= PORTFOLIO =================
  // The risk math is ported VERBATIM from MacroFlow_Command_Dashboard.html —
  // same RULES constants, same expectancy formulas, same cool-off logic, same
  // five Council lenses. It now reads your LIVE trades log instead of a
  // hardcoded account, so it reflects what you're actually holding.
  //
  // Nothing here is invented. Where the Dashboard scanned trade notes with
  // regexes (movedStops / reEntries / badEntries), those still work — they read
  // your exit_reason and exit_notes fields.

  var RULES = { riskCons:0.01, riskAggr:0.02, atrMult:2.0, maxPosPct:0.35,
                maxHeatR:3, coolOff:6, coolOffDays:5, atrTight:1.0, atrWide:3.5,
                earnDays:14, fallbackRR:2.0 };
  var PF_KEY = "phoenix_pf_v1";
  // Per-account config. The two books are kept SEPARATE — six tickers appear in
  // both at different sizes on different capital, so merging them would corrupt
  // expectancy. The switcher filters; it never combines.
  var pfCfg = {
    active: "gabriel",
    accounts: {
      gabriel: { label:"Gabriel", startingBalance:2000, aggressive:false },
      aldemar: { label:"Aldemar", startingBalance:2000, aggressive:false }
    }
  };
  function pfAcct(){ return pfCfg.accounts[pfCfg.active] || {label:pfCfg.active,startingBalance:2000,aggressive:false}; }

  function pfLoadCfg(){
    try{
      var s=localStorage.getItem(PF_KEY);
      if(s){
        var o=JSON.parse(s);
        // migrate the old flat shape {aggressive,startingBalance} -> per-account
        if(o && o.accounts) pfCfg=Object.assign(pfCfg,o);
        else if(o && (o.startingBalance!=null || o.aggressive!=null)){
          pfCfg.accounts.gabriel.startingBalance = o.startingBalance || 2000;
          pfCfg.accounts.gabriel.aggressive = !!o.aggressive;
        }
      }
    }catch(e){}
    // any account that exists in the log but not in config gets a default entry
    (trLog||[]).forEach(function(t){
      var a=t.account;
      if(a && !pfCfg.accounts[a]){
        pfCfg.accounts[a]={label:a.charAt(0).toUpperCase()+a.slice(1),startingBalance:2000,aggressive:false};
      }
    });
    if(!pfCfg.accounts[pfCfg.active]){
      var ks=Object.keys(pfCfg.accounts);
      if(ks.length) pfCfg.active=ks[0];
    }
  }
  function pfSaveCfg(){ try{ localStorage.setItem(PF_KEY,JSON.stringify(pfCfg)); }catch(e){} }
  function curRiskPct(){ return pfAcct().aggressive?RULES.riskAggr:RULES.riskCons; }

  // Trades belonging to the active account. Legacy trades with no account tag
  // fall into whichever account is active, so nothing silently disappears.
  // Trades for the active book only. An untagged trade (made in the app before
  // accounts existed) belongs to ONE book — the default — never to all of them.
  // Showing it in every book would double-count it and corrupt both expectancies.
  var PF_DEFAULT_ACCT="gabriel";
  function pfTrades(){
    return (trLog||[]).filter(function(t){
      var a=t.account||PF_DEFAULT_ACCT;
      return a===pfCfg.active;
    });
  }

  // ---- helpers (ported) ----
  function pfD(s){ return new Date(s+"T00:00:00"); }
  function pfDayDiff(a,b){ if(!a||!b) return 0; return Math.max(0,Math.round((pfD(b)-pfD(a))/864e5)); }
  function pfToday(){ return new Date().toISOString().slice(0,10); }
  function pfMed(a){ if(!a.length)return 0; var s=a.slice().sort(function(x,y){return x-y;}),m=Math.floor(s.length/2);
    return s.length%2?s[m]:(s[m-1]+s[m])/2; }
  function pfN(v,dp){ dp=dp==null?2:dp; return Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
  function pfUsd(v,dp){ return (v<0?"\u2212":"")+"$"+pfN(v,dp==null?2:dp); }
  function pfUsdS(v,dp){ return (v<0?"\u2212":"+")+"$"+pfN(v,dp==null?2:dp); }
  function pfPct(v,dp){ return (v*100).toFixed(dp==null?1:dp)+"%"; }
  function pfRS(v){ return (v<0?"\u2212":"+")+Math.abs(v).toFixed(2)+"R"; }
  function pfXN(v){ return isFinite(v)?v.toFixed(2)+"\u00d7":"\u2014"; }

  // ---- compute (ported verbatim from the Command Dashboard) ----


  // THEME HEAT MAP — how much each industry rides the AI / mega-cap-growth
  // trade. This is a CURATED judgement map (not measured), so it's labelled as
  // such on screen and lives here to be edited freely. 0 = unrelated, 100 = the
  // trade itself. Anything absent defaults to THEME_BASE.
  var THEME_BASE = 12;
  var THEME_NAME = "AI / mega-cap growth";
  var THEME_HEAT = {
    "Semiconductors":98, "Electronic production equipment":90,
    "Computer processing hardware":92, "Computer peripherals":78,
    "Computer communications":80, "Electronic components":74,
    "Electronic equipment/Instruments":68, "Telecommunications equipment":55,
    "Internet software/Services":82, "Packaged software":78,
    "Information technology services":58, "Data processing services":66,
    "Internet retail":70, "Miscellaneous commercial services":30,
    "Electrical products":62, "Electric utilities":42, "Alternative power generation":48,
    "Industrial machinery":32, "Engineering & construction":38,
    "Real estate investment trusts":34, "Real estate development":22,
    "Movies/Entertainment":44, "Media conglomerates":40, "Cable/Satellite TV":30,
    "Wireless telecommunications":28, "Specialty telecommunications":34,
    "Aerospace & defense":34, "Motor vehicles":46, "Auto parts: OEM":36,
    "Specialty stores":26, "Apparel/Footwear retail":20, "Restaurants":14,
    "Major banks":24, "Regional banks":18, "Investment banks/Brokers":26,
    "Investment managers":28, "Finance/Rental/Leasing":22, "Investment trusts":30,
    "Multi-line insurance":16, "Property/Casualty insurance":14, "Life/Health insurance":14,
    "Pharmaceuticals: major":16, "Biotechnology":22, "Medical specialties":24,
    "Medical/Nursing services":12, "Health industry services":16,
    "Integrated oil":10, "Oil & gas production":10, "Oilfield services/Equipment":14,
    "Oil & gas pipelines":10, "Precious metals":8, "Other metals/Minerals":16,
    "Chemicals: specialty":18, "Chemicals: major diversified":14, "Steel":14,
    "Food: major diversified":8, "Food: specialty/candy":8, "Beverages: non-alcoholic":8,
    "Household/Personal care":10, "Wholesale distributors":18, "Marine shipping":12,
    "Hotels/Resorts/Cruise lines":16, "Other consumer services":20,
    "Gas distributors":10, "Water utilities":8, "Environmental services":14
  };
  function pfHeatOf(ind){
    if(ind in THEME_HEAT) return THEME_HEAT[ind];
    return THEME_BASE;
  }
  // a genuinely spread book = equal weight across the whole map
  function pfSpreadHeat(){
    var ks=Object.keys(THEME_HEAT), s=0,i;
    for(i=0;i<ks.length;i++) s+=THEME_HEAT[ks[i]];
    return ks.length? s/ks.length : 30;
  }
  var pfShock = 40;    // slider: how far the theme falls, in %

  // ---- CORRELATION / CONCENTRATION RISK -------------------------------------
  // Two different questions, and they can disagree badly:
  //   1. CONCENTRATION - how much sits in each industry (exact, from labels)
  //   2. CORRELATION   - do the names actually move together (measured from
  //      weekly returns). NVDA/PLTR/AMZN/GOOG sit in four different industries
  //      but trade as one bet, so labels alone UNDERSTATE the risk. We show both
  //      and say so when they disagree.
  var pfRet = {};        // ticker -> {date: weekly return}
  var pfCorrOff = {};    // ticker -> excluded from the what-if
  var pfCorrAdd = [];    // hypothetical tickers added in the what-if

  function pfIndustryOf(tk){
    var af=(typeof dpAllFin!=="undefined"&&dpAllFin&&dpAllFin[tk]&&dpAllFin[tk].profile)||null;
    if(af&&af.industry) return af.industry;
    var sd=null,i;
    for(i=0;i<(scrData||[]).length;i++){ if(scrData[i].ticker===tk){ sd=scrData[i]; break; } }
    if(sd&&sd.industry) return sd.industry;
    if(af&&af.sector) return af.sector;
    if(sd&&sd.sector) return sd.sector;
    var cp=(typeof dpChartCache!=="undefined"&&dpChartCache[tk]&&dpChartCache[tk].profile)||null;
    if(cp&&(cp.industry||cp.sector)) return cp.industry||cp.sector;
    return "Unclassified";
  }

  function pfLoadReturns(tks, cb){
    var need=[],i;
    for(i=0;i<tks.length;i++){ if(!(tks[i] in pfRet)) need.push(tks[i]); }
    if(!need.length){ cb(); return; }
    var left=need.length;
    need.forEach(function(tk){
      dpFetchBars(tk,"weekly",function(bars){
        var m={},j;
        if(bars&&bars.length>1){
          for(j=1;j<bars.length;j++){
            var p0=bars[j-1].c,p1=bars[j].c;
            if(p0>0&&p1>0) m[bars[j].date]=p1/p0-1;
          }
        }
        pfRet[tk]=m;
        if(--left<=0) cb();
      });
    });
  }

  function pfCorrOf(a,b){
    var A=pfRet[a]||{}, B=pfRet[b]||{}, xs=[], ys=[], d;
    for(d in A){ if(B[d]!=null){ xs.push(A[d]); ys.push(B[d]); } }
    var n=xs.length;
    if(n<20) return null;                 // too little overlap to mean anything
    var mx=0,my=0,i;
    for(i=0;i<n;i++){ mx+=xs[i]; my+=ys[i]; }
    mx/=n; my/=n;
    var num=0,dx=0,dy=0;
    for(i=0;i<n;i++){ var u=xs[i]-mx, v=ys[i]-my; num+=u*v; dx+=u*u; dy+=v*v; }
    var den=Math.sqrt(dx*dy);
    return den?(num/den):null;
  }

  function pfCorrPos(s){
    var out=[],i;
    (s.open||[]).forEach(function(r){
      if(pfCorrOff[r.ticker]) return;
      var v=Math.abs(r.val||0);
      if(!(v>0)) return;            // no size = no exposure to weigh
      out.push({ticker:r.ticker,val:v,hypo:false});
    });
    // a hypothetical add is sized at the average real position, so the % shift
    // you see is what adding a typical position would actually do
    var avg=out.length?out.reduce(function(a,x){return a+x.val;},0)/out.length:1000;
    pfCorrAdd.forEach(function(tk){
      if(pfCorrOff[tk]) return;
      for(var j=0;j<out.length;j++){ if(out[j].ticker===tk) return; }
      out.push({ticker:tk,val:avg,hypo:true});
    });
    var tot=out.reduce(function(a,x){return a+x.val;},0)||1;
    out.forEach(function(x){ x.w=x.val/tot; });
    out.sort(function(a,b){return b.w-a.w;});
    return out;
  }

  function pfCorrColor(c){
    if(c==null) return "var(--inkGhost)";
    if(c>=0.8) return "var(--red)";
    if(c>=0.6) return "var(--amber)";
    if(c>=0.3) return "var(--gold)";
    if(c>=0)   return "var(--green)";
    return "var(--green)";
  }

  function pfHeatColor(h){
    var t=Math.max(0,Math.min(100,h))/100;
    return "rgb("+Math.round(46+(179-46)*t)+","+Math.round(125+(64-125)*t)+","+Math.round(50+(42-50)*t)+")";
  }

  function pfCorrHTML(pos, haveRet){
    var i,j,html="";
    // ---- industry concentration ----
    var byInd={};
    pos.forEach(function(p){
      var k=pfIndustryOf(p.ticker);
      var e=byInd[k]||(byInd[k]={ind:k,w:0,val:0,tks:[]});
      e.w+=p.w; e.val+=p.val; e.tks.push(p.ticker+(p.hypo?"*":""));
    });
    var inds=Object.keys(byInd).map(function(k){return byInd[k];}).sort(function(a,b){return b.w-a.w;});
    // ---- theme exposure: weight x how much that industry rides the theme ----
    var themeExp=0;
    pos.forEach(function(p){ themeExp += p.w * pfHeatOf(pfIndustryOf(p.ticker))/100; });
    // ---- effective bets ----
    var hhi=pos.reduce(function(a,p){return a+p.w*p.w;},0);
    var effSize=hhi?1/hhi:0;
    var effBets=effSize, effIsCorr=false;
    // ---- measured correlation ----
    var avgCorr=null, worst=null, nPairs=0, sum=0;
    if(haveRet){
      for(i=0;i<pos.length;i++){
        for(j=i+1;j<pos.length;j++){
          var c=pfCorrOf(pos[i].ticker,pos[j].ticker);
          if(c!=null){ sum+=c; nPairs++; if(!worst||c>worst.c) worst={a:pos[i].ticker,b:pos[j].ticker,c:c}; }
        }
      }
      if(nPairs){
        avgCorr=sum/nPairs;
        var q=0,a,bq;
        for(a=0;a<pos.length;a++){
          for(bq=0;bq<pos.length;bq++){
            var cij=(a===bq)?1:pfCorrOf(pos[a].ticker,pos[bq].ticker);
            if(cij==null) cij=avgCorr;
            q+=pos[a].w*pos[bq].w*cij;
          }
        }
        if(q>0){ effBets=1/q; effIsCorr=true; }
      }
    }
    var cluster=null;
    if(haveRet&&pos.length>1){
      var anchor=pos[0], cw=anchor.w;
      for(i=1;i<pos.length;i++){
        var cc=pfCorrOf(anchor.ticker,pos[i].ticker);
        if(cc!=null&&cc>=0.7) cw+=pos[i].w;
      }
      cluster={tk:anchor.ticker,w:cw};
    }

    // ================= THE VERDICT =================
    var pct=Math.round(themeExp*100);
    var vcol=pct>=60?"var(--red)":pct>=35?"var(--amber)":"var(--green)";
    var feels = inds.length>=3 ? (pos.length+" holdings. It feels spread out.")
              : (pos.length+" holding"+(pos.length>1?"s":"")+" across "+inds.length+" industr"+(inds.length>1?"ies":"y")+".");
    html+='<div class="cr-verdict">'+
      '<div class="cr-vk">The verdict</div>'+
      '<div class="cr-vnum" style="color:'+vcol+'">'+pct+'<span>%</span></div>'+
      '<div class="cr-vsay">of your money rides the same '+THEME_NAME+' bet.</div>'+
      '<div class="cr-vsub">'+feels+'</div>'+
    '</div>';

    function stat(k,v,d,col){
      return '<div class="sm-stat"><div class="k">'+k+'</div><div class="v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</div><div class="d">'+d+'</div></div>';
    }
    var top=inds[0];
    var effCol=effBets>=pos.length*0.7?"var(--green)":effBets>=pos.length*0.45?"var(--amber)":"var(--red)";
    html+='<div class="sm-stats" style="border-top:0;margin:0 -16px">'+

      stat("Effective bets", pos.length?effBets.toFixed(1):"\u2014",
           pos.length?("of "+pos.length+" position"+(pos.length>1?"s":"")+(effIsCorr?"":" \u00b7 by size only")):"\u2014", effCol)+
      stat("Avg correlation", avgCorr!=null?avgCorr.toFixed(2):(haveRet?"\u2014":"\u2026"),
           avgCorr!=null?(avgCorr>=0.7?"moves as one bet":avgCorr>=0.4?"loosely linked":"genuinely spread")
                        :(haveRet?"not enough history":"measuring\u2026"), pfCorrColor(avgCorr))+
      stat("Tightest cluster", cluster?Math.round(cluster.w*100)+"%":"\u2014",
           cluster?("moves with "+cluster.tk):"\u2014",
           cluster&&cluster.w>=0.6?"var(--red)":cluster&&cluster.w>=0.4?"var(--amber)":"var(--green)")+
    '</div>';

    if(avgCorr!=null&&inds.length>=3&&avgCorr>=0.65){
      html+='<div class="cr-warn"><b>Your industry mix is misleading.</b> These sit in '+inds.length+
        ' different industries, but their weekly returns move together at '+avgCorr.toFixed(2)+
        '. Once correlation is accounted for this is about <b>'+effBets.toFixed(1)+' independent bet'+
        (effBets<1.5?"":"s")+', not '+pos.length+'</b>.</div>';
    }

    // ================= WHERE IT SITS =================
    html+='<div class="cr-sub">Where it sits <span class="cr-legend">'+
      '<span class="lo">low</span><span class="ramp"></span><span class="hi">high</span>'+
      '<span class="own">your holdings</span></span></div>';
    var held={};
    inds.forEach(function(e){ held[e.ind]=e.tks; });
    var pool=Object.keys(THEME_HEAT).map(function(k){return {ind:k,h:THEME_HEAT[k]};});
    Object.keys(held).forEach(function(k){
      if(!(k in THEME_HEAT)) pool.push({ind:k,h:pfHeatOf(k)});
    });
    pool.sort(function(a,b){return b.h-a.h;});
    var shown=pool.filter(function(t){return (t.ind in held)||t.h>=THEME_BASE;}).slice(0,30);
    Object.keys(held).forEach(function(k){
      if(!shown.some(function(t){return t.ind===k;})) shown.push({ind:k,h:pfHeatOf(k)});
    });
    shown.sort(function(a,b){return b.h-a.h;});
    html+='<div class="cr-heat">'+shown.map(function(t){
      var mine=held[t.ind];
      return '<div class="cr-tile'+(mine?" mine":"")+'" style="background:'+pfHeatColor(t.h)+'">'+
        (mine?'<div class="tag">'+mine.join(", ")+'</div>':'')+
        '<div class="hv">'+t.h+'</div><div class="hn">'+t.ind+'</div></div>';
    }).join("")+'</div>';
    html+='<div class="cr-note">Heat is a curated map of how much each industry rides the '+THEME_NAME+
      ' trade \u2014 judgement, not measurement. The correlation matrix below is measured from real returns.</div>';

    // ================= WHAT IT COSTS YOU =================
    var _s=pfCompute();
    var deployed=pos.reduce(function(a,p){return a+p.val;},0);
    var bal=(_s.balance>0)?_s.balance:(deployed>0?deployed:100000);
    var balLbl=(_s.balance>0)?"Your ":(deployed>0?"Your deployed ":"A notional ");
    var spread=pfSpreadHeat()/100;
    var yourDD=themeExp*(pfShock/100), spreadDD=spread*(pfShock/100);
    html+='<div class="cr-sub">What it costs you</div>'+
      '<div class="cr-cost">'+
        '<div class="cr-shock">'+
          '<div class="cr-sk">If the '+THEME_NAME+' trade falls</div>'+
          '<div class="cr-snum" id="crShockLbl">\u2212'+pfShock+'%</div>'+
          '<input type="range" min="0" max="60" step="5" value="'+pfShock+'" id="crShock" class="cr-range">'+
          '<div class="cr-sends"><span>0%</span><span>\u221260%</span></div>'+
        '</div>'+
        '<div class="cr-bars">'+
          '<div class="cr-brow"><span class="l">'+balLbl+pfUsd(bal,0)+'</span>'+
            '<span class="r" id="crYourPct" style="color:var(--red)">\u2212'+(yourDD*100).toFixed(1)+'% \u2192 '+pfUsd(bal*(1-yourDD),0)+'</span></div>'+
          '<div class="cr-bbar"><i id="crYourBar" style="width:'+Math.max(4,(1-yourDD)*100).toFixed(1)+'%;background:var(--red)"></i>'+
            '<b id="crYourVal">'+pfUsd(bal*(1-yourDD),0)+'</b></div>'+
          '<div class="cr-brow" style="margin-top:12px"><span class="l">A genuinely spread '+pfUsd(bal,0)+'</span>'+
            '<span class="r" id="crSprPct" style="color:var(--green)">\u2212'+(spreadDD*100).toFixed(1)+'% \u2192 '+pfUsd(bal*(1-spreadDD),0)+'</span></div>'+
          '<div class="cr-bbar"><i id="crSprBar" style="width:'+Math.max(4,(1-spreadDD)*100).toFixed(1)+'%;background:var(--green)"></i>'+
            '<b id="crSprVal">'+pfUsd(bal*(1-spreadDD),0)+'</b></div>'+
          '<div class="cr-note" id="crCostSay">'+pfCostSay(themeExp,spread)+'</div>'+
        '</div>'+
      '</div>';

    // ================= CORRELATION MATRIX =================
    if(pos.length>1){
      html+='<div class="cr-sub">Correlation \u00b7 measured from weekly returns</div>';
      if(!haveRet){ html+='<div class="cr-note">Measuring from price history\u2026</div>'; }
      else {
        html+='<div class="cr-mx"><table><tr><th></th>'+
          pos.map(function(p){return '<th>'+p.ticker+'</th>';}).join("")+'</tr>';
        pos.forEach(function(a){
          html+='<tr><th>'+a.ticker+'</th>';
          pos.forEach(function(b){
            if(a.ticker===b.ticker){ html+='<td class="d">\u2014</td>'; return; }
            var c=pfCorrOf(a.ticker,b.ticker);
            html+='<td style="color:'+pfCorrColor(c)+';font-weight:'+(c!=null&&c>=0.7?"700":"400")+'">'+
              (c!=null?c.toFixed(2):"\u00b7")+'</td>';
          });
          html+='</tr>';
        });
        html+='</table></div>';
        if(worst) html+='<div class="cr-note">Tightest pair: <b>'+worst.a+' \u2194 '+worst.b+'</b> at '+worst.c.toFixed(2)+
          '. Above 0.70 a position is effectively a duplicate.</div>';
      }
    }

    // ================= WHAT-IF =================
    html+='<div class="cr-sub">What if \u00b7 tap to drop, type to add</div><div class="cr-chips" id="pfCorrChips">';
    var seen={};
    (pfCompute().open||[]).forEach(function(r){
      if(seen[r.ticker]) return; seen[r.ticker]=1;
      html+='<span class="cr-chip'+(pfCorrOff[r.ticker]?" off":"")+'" data-cr="'+r.ticker+'">'+r.ticker+'</span>';
    });
    pfCorrAdd.forEach(function(tk){
      html+='<span class="cr-chip add'+(pfCorrOff[tk]?" off":"")+'" data-cr="'+tk+'">'+tk+' +</span>';
    });
    html+='<input class="cr-input" id="pfCorrIn" placeholder="+ add ticker" maxlength="6">';
    if(pfCorrAdd.length||Object.keys(pfCorrOff).length) html+='<span class="cr-chip" id="pfCorrReset" style="color:var(--inkFade)">reset</span>';
    html+='</div>';
    html+='<div class="cr-note">Added tickers (*) are sized at your average position. Correlation uses up to 2 years of weekly returns; pairs with under 20 overlapping weeks are left blank.</div>';
    return html;
  }

  function pfCostSay(themeExp, spread){
    var mult = spread>0 ? themeExp/spread : 1;
    if(themeExp>=spread*1.6)
      return "Same shock, <b>"+mult.toFixed(1)+"\u00d7 the damage</b> of a spread book \u2014 the concentration above showing up as real dollars.";
    if(themeExp>=spread*1.15)
      return "Somewhat more exposed than a spread book (<b>"+mult.toFixed(1)+"\u00d7</b>), but not extreme.";
    if(themeExp<=spread*0.85)
      return "Less exposed to this theme than a spread book \u2014 the shock costs you <b>less</b> than the index would lose.";
    return "Roughly in line with a spread book for this particular shock.";
  }

  function pfCorrWire(){
    var el=document.getElementById("pfCorrBody"); if(!el) return;
    el.querySelectorAll("[data-cr]").forEach(function(ch){
      ch.addEventListener("click",function(){
        var tk=this.dataset.cr;
        if(pfCorrOff[tk]) delete pfCorrOff[tk]; else pfCorrOff[tk]=true;
        pfCorrRender();
      });
    });
    var inp=document.getElementById("pfCorrIn");
    if(inp) inp.addEventListener("keydown",function(e){
      if(e.key!=="Enter") return;
      var tk=(this.value||"").trim().toUpperCase();
      if(!tk) return;
      if(pfCorrAdd.indexOf(tk)<0) pfCorrAdd.push(tk);
      this.value="";
      pfCorrRender();
    });
    var sl=document.getElementById("crShock");
    if(sl) sl.addEventListener("input",function(){
      pfShock=+this.value;
      var pos=pfCorrPos(pfCompute());
      var te=0; pos.forEach(function(p){ te+=p.w*pfHeatOf(pfIndustryOf(p.ticker))/100; });
      var _c=pfCompute(), dep=pos.reduce(function(a,p){return a+p.val;},0);
      var sp=pfSpreadHeat()/100, bal=(_c.balance>0)?_c.balance:(dep>0?dep:100000);
      var yd=te*(pfShock/100), sd=sp*(pfShock/100);
      var q=function(id){return document.getElementById(id);};
      if(q("crShockLbl")) q("crShockLbl").textContent="\u2212"+pfShock+"%";
      if(q("crYourPct")) q("crYourPct").textContent="\u2212"+(yd*100).toFixed(1)+"% \u2192 "+pfUsd(bal*(1-yd),0);
      if(q("crSprPct"))  q("crSprPct").textContent="\u2212"+(sd*100).toFixed(1)+"% \u2192 "+pfUsd(bal*(1-sd),0);
      if(q("crYourBar")) q("crYourBar").style.width=Math.max(4,(1-yd)*100).toFixed(1)+"%";
      if(q("crSprBar"))  q("crSprBar").style.width=Math.max(4,(1-sd)*100).toFixed(1)+"%";
      if(q("crYourVal")) q("crYourVal").textContent=pfUsd(bal*(1-yd),0);
      if(q("crSprVal"))  q("crSprVal").textContent=pfUsd(bal*(1-sd),0);
      if(q("crCostSay")) q("crCostSay").innerHTML=pfCostSay(te,sp);
    });
    var rs=document.getElementById("pfCorrReset");
    if(rs) rs.addEventListener("click",function(){ pfCorrAdd=[]; pfCorrOff={}; pfCorrRender(); });
  }

  function pfCorrRender(){
    var el=document.getElementById("pfCorrBody"); if(!el) return;
    var s=pfCompute();
    var pos=pfCorrPos(s);
    var note=document.getElementById("pfCorrNote");
    var sub=document.getElementById("pfCorrSub");
    if(note) note.textContent=pos.length?(pos.length+" position"+(pos.length>1?"s":"")):"";
    if(sub) sub.textContent=pos.length?"\u00b7 concentration + measured co-movement":"";
    if(!pos.length){
      el.innerHTML='<div class="cr-note">No open positions to analyse. Add one in Trades, or type a ticker below to test a hypothetical book.</div>'+
        '<div class="cr-chips"><input class="cr-input" id="pfCorrIn" placeholder="+ add ticker" maxlength="6"></div>';
      pfCorrWire();
      return;
    }
    el.innerHTML=pfCorrHTML(pos,false);

    pfLoadReturns(pos.map(function(p){return p.ticker;}),function(){

    });
  }

  function pfCompute(){
    var SB = +pfAcct().startingBalance || 2000;
    var src = pfTrades().filter(function(t){ return t.status==="open"||t.status==="closed"; });
    var recs = src.map(function(t){
      var last = t.status==="closed" ? t.exit_price : (trPrices[t.ticker]!=null?trPrices[t.ticker]:t.entry);
      last = (last==null?t.entry:last);
      var qty = +t.qty||0, entry = +t.entry||0, stop = +t.stop||0;
      var pnl=(last-entry)*qty, ret=entry?last/entry-1:0;
      var risk=(entry-stop)*qty, R=risk>0?pnl/risk:0, val=qty*entry;
      var dit = t.status==="closed" ? pfDayDiff(t.entry_date,t.exit_date) : pfDayDiff(t.entry_date,pfToday());
      return {ticker:t.ticker,status:t.status,entry:entry,stop:stop,target:+t.target||0,qty:qty,
              exitDate:t.exit_date,entryDate:t.entry_date,
              reason:((t.exit_reason||"")+" "+(t.exit_notes||"")).trim(),
              last:last,pnl:pnl,ret:ret,risk:risk,R:R,val:val,dit:dit};
    });
    var closed=recs.filter(function(r){return r.status==="closed";});
    var open=recs.filter(function(r){return r.status==="open";});
    var realized=closed.reduce(function(a,r){return a+r.pnl;},0);
    var unrealized=open.reduce(function(a,r){return a+r.pnl;},0);
    var balance=SB+realized+unrealized, totalReturn=SB?balance/SB-1:0;
    var W=closed.filter(function(r){return r.pnl>0;}), L=closed.filter(function(r){return r.pnl<0;});
    var n=closed.length, wr=n?W.length/n:0, lr=n?L.length/n:0;
    var gp=W.reduce(function(a,r){return a+r.pnl;},0), gl=L.reduce(function(a,r){return a+r.pnl;},0);
    var aw=W.length?gp/W.length:0, al=L.length?Math.abs(gl)/L.length:0;
    var payoff=al?aw/al:0, pf=gl?gp/Math.abs(gl):0;
    var beWR=payoff?1/(1+payoff):0, reqPayoff=wr?lr/wr:0;
    var expD=aw*wr-al*lr;
    var awR=W.length?W.reduce(function(a,r){return a+r.R;},0)/W.length:0;
    var alR=L.length?L.reduce(function(a,r){return a+r.R;},0)/L.length:0;
    var expR=n?closed.reduce(function(a,r){return a+r.R;},0)/n:0;
    var medW=pfMed(W.map(function(r){return r.pnl;})), medL=pfMed(L.map(function(r){return r.pnl;}));
    var lw=W.length?W.reduce(function(a,r){return r.pnl>a.pnl?r:a;}):null;
    var ll=L.length?L.reduce(function(a,r){return r.pnl<a.pnl?r:a;}):null;
    var losersBeyond1R=L.filter(function(r){return r.R<-1;}).length;
    var ord=closed.slice().sort(function(a,b){
      var d=pfD(a.exitDate||"1970-01-01")-pfD(b.exitDate||"1970-01-01");
      return d||(a.ticker<b.ticker?-1:1);
    });
    var cum=0,peak=0,maxdd=0,strk=0,maxstrk=0,seq=[0],pk=[0];
    ord.forEach(function(r){ cum+=r.pnl; seq.push(cum); peak=Math.max(peak,cum); pk.push(peak);
      maxdd=Math.min(maxdd,cum-peak); if(r.pnl<0){strk++;maxstrk=Math.max(maxstrk,strk);}else strk=0; });
    var curStreak=0;
    for(var i=ord.length-1;i>=0;i--){ if(ord[i].pnl<0)curStreak++; else break; }
    var medPos=pfMed(recs.map(function(r){return r.val;}));
    var bigPos=recs.slice().sort(function(a,b){return b.val-a.val;}).slice(0,2);
    var R$=curRiskPct()*balance;
    var openRisk$=open.reduce(function(a,r){return a+Math.max(0,(r.entry-r.stop)*r.qty);},0);
    var openRiskR=R$?openRisk$/R$:0;
    var reqRR; if(n===0)reqRR=RULES.fallbackRR; else if(W.length===0)reqRR=Infinity; else reqRR=lr/wr;
    var lastClosedExit=ord.length?ord[ord.length-1].exitDate:null;
    var daysSinceLast=lastClosedExit?pfDayDiff(lastClosedExit,pfToday()):null;
    var coolActive=curStreak>=RULES.coolOff && daysSinceLast!==null && daysSinceLast<RULES.coolOffDays;
    var coolServed=curStreak>=RULES.coolOff && daysSinceLast!==null && daysSinceLast>=RULES.coolOffDays;
    var coolRemaining=daysSinceLast!==null?Math.max(0,RULES.coolOffDays-daysSinceLast):0;
    return {SB:SB,recs:recs,closed:closed,open:open,realized:realized,unrealized:unrealized,
      balance:balance,totalReturn:totalReturn,W:W,L:L,n:n,wr:wr,lr:lr,gp:gp,gl:gl,aw:aw,al:al,
      payoff:payoff,pf:pf,beWR:beWR,reqPayoff:reqPayoff,reqRR:reqRR,expD:expD,awR:awR,alR:alR,expR:expR,
      medW:medW,medL:medL,lw:lw,ll:ll,losersBeyond1R:losersBeyond1R,seq:seq,pk:pk,peak:peak,maxdd:maxdd,
      maxstrk:maxstrk,curStreak:curStreak,medPos:medPos,bigPos:bigPos,R$:R$,openRisk$:openRisk$,openRiskR:openRiskR,
      lastClosedExit:lastClosedExit,daysSinceLast:daysSinceLast,coolActive:coolActive,coolServed:coolServed,
      coolRemaining:coolRemaining,riskPct:curRiskPct()};
  }

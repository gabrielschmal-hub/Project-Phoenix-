name: Phoenix Tests
on:
  push:
    paths: ["*.py", "*.html", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pytest pandas numpy pyarrow supabase playwright && python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q --tb=short

name: MME Forward Test (10:00 ET + hourly checks)

# Phoenix 2.0, Trading module: the MME forward test (FT-1.4, rules v1.5.0). Supabase fires this workflow at :05 past
# the hour; the engine decides what to do from the New York clock: 10:00 ET the decision (once a day), 11:00 to 15:00 ET
# that hour's entry check (once an hour, v1.5.0 R02), anything else nothing. It reads the MORNING run's levels (the
# last commit before 09:00 UTC, v1.5.0 section 5; never an intraday rewrite) and the live 5-minute prices in Supabase,
# and writes only to Supabase: no commit, so it never races the daily run's push.
on:
  schedule:
    - cron: '5 14 * * 1-5'
    - cron: '5 15 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: "Run the decision now, outside the 10:00-11:30 ET window (testing only)"
        type: boolean
        default: false

concurrency:
  group: mme-test
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use the morning levels (last commit before 09:00 UTC)
        run: |
          git fetch --quiet --shallow-since="$(date -u -d '3 days ago' +%Y-%m-%d)" origin "${GITHUB_REF_NAME}" || true
          SHA=$(git rev-list -1 --before="$(date -u +%Y-%m-%d)T09:00:00Z" FETCH_HEAD 2>/dev/null || true)
          if [ -n "$SHA" ] && [ "$SHA" != "$(git rev-parse HEAD)" ]; then
            for f in mme_map.json mme_chains.json gex.json vix_term.json earnings_state.json financials_all.json; do
              git checkout "$SHA" -- "outputs/$f" 2>/dev/null || true
            done
            echo "levels from the morning commit $SHA (HEAD is $(git rev-parse --short HEAD))"
          else
            echo "levels from HEAD $(git rev-parse --short HEAD)"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Decide (10:00 ET) or this hour's entry check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MME_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # push for new MME test orders (ntfy app)
          MME_EMAIL: ${{ secrets.MME_EMAIL }}         # optional: the same message by email
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m trading.mme_ft decide --force
          else
            python -m trading.mme_ft decide
          fi

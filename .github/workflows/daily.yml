name: Phoenix Daily Run

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
  # Dropping the morning wire files IS the publish: any commit touching
  # wire/** triggers a fast wire-only run, live on the dashboard in ~2 min.
  push:
    paths:
      - 'wire/**'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phoenix
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python phoenix.py --engine wire
          else
            python phoenix.py --full
          fi
      - name: Commit outputs
        run: |
          git config user.name  "phoenix-bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add outputs/ macroflow.db || true
          git commit -m "Phoenix run $(date -u +%Y-%m-%dT%H:%M) (${{ github.event_name }})" || echo "No changes"
          git push || echo "Nothing to push"

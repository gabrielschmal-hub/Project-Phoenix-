name: Phoenix Daily Run

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'wire/**'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pdftotext for House PTR PDFs (poppler-utils). Present on most runner
          # images already; installing is cheap insurance against a silent 0-row day.
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true

      - name: Run Phoenix
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # --- these three are what phoenix.py was missing ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                        # pull_trade_book + heartbeats
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_IDENTITY: "Phoenix Research gabriel@phoenix.local"           # EDGAR user-agent rule: put a real email here
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python phoenix.py --engine wire
          else
            python phoenix.py --full
          fi

      - name: Commit outputs
        run: |
          git config user.name  "phoenix-bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add outputs/ macroflow.db || true
          git commit -m "Phoenix run $(date -u +%Y-%m-%dT%H:%M) (${{ github.event_name }})" || echo "No changes"
          git push || echo "Nothing to push"

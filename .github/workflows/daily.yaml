name: Phoenix Daily Run

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
  # Dropping the morning wire files IS the publish: any commit touching
  # wire/** triggers a fast wire-only run, live on the dashboard in ~2 min.
  push:
    paths:
      - 'wire/**'
      - 'research/**'      # a new report is live in ~2 minutes, not at tomorrow's 05:00 run

concurrency:
  group: phoenix-daily-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    # 3 Nov 2026: 75 minutes cut the 2 Nov run off before its commit, so a full day's outputs were lost.
    # The repo is public (Actions minutes are free), the run now takes ~65 min, so the job gets room and
    # the run step its own cap; the commit step runs whatever happened above it.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history only for the morning run (the context backfill reads old days from git);
          # a wire/research upload needs just the latest commit — minutes are billed on a private repo
          fetch-depth: ${{ github.event_name == 'push' && 1 || 0 }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true   # pdftotext for House PTR PDFs
      - name: Run Phoenix
        timeout-minutes: 120
        continue-on-error: true    # a crash or a cap still publishes what was finished
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_IDENTITY: "Phoenix Research gabriel@example.com"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python phoenix.py --engine wire
          else
            python phoenix.py --full
          fi
      - name: Commit outputs
        if: always()
        run: |
          git config user.name  "phoenix-bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          # 3 Nov 2026: the old order (pull, then add/commit) failed silently whenever anything else was committed
          # during the run (an upload, the signal-log or smart-money workflows): git refuses to rebase over
          # uncommitted changes, the "|| true" hid it, and the push was rejected. Commit first, then rebase onto
          # whatever landed meanwhile (this run's outputs win a conflict), retry, and fail loudly if it never lands.
          git add -A outputs/ macroflow.db || true
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Phoenix run $(date -u +%Y-%m-%dT%H:%M) (${{ github.event_name }})"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed; retrying"; sleep $((i * 10))
          done
          echo "::error::Outputs were not pushed after 5 attempts"; exit 1

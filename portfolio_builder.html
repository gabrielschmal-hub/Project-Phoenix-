<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phoenix — Portfolio</title>
<style>
/* PHOENIX PALETTE — ivory F3F5E7 · sage 9CA889 · khaki B7A78C · moss 464704 · brown 423926
   ember E0511B (accent) · slate 12405F (chrome). Cards white. Green/red = financial direction only.
   Type: serif titles, mono numerics + badges — matches the Markets/ticker cards. */
:root{--ivory:#F3F5E7;--cream:#FAF7EE;--sage:#9CA889;--khaki:#B7A78C;--moss:#464704;--brown:#423926;
--ember:#E0511B;--slate:#12405F;--up:#1B7F4B;--dn:#B3261E;--ink:#1a1a17;--mut:#6f6e62;
--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--ink);
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--khaki);
padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.brand{font:700 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ember)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:7px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 11px 9px;font:12.5px var(--mono);color:var(--mut);
border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;letter-spacing:.02em}
.tab.on{color:var(--slate);border-bottom-color:var(--ember)}
.tab small{display:block;font:10px var(--mono);color:var(--mut)}
main{padding:12px 12px 0}
.card{background:#fff;border:1px solid var(--khaki);border-radius:10px;padding:0;margin-bottom:11px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px 8px;
border-bottom:1px solid var(--ivory)}
.ct{font:600 17px/1.2 var(--serif);color:var(--ink)}
.ct .sub{font:11px var(--mono);color:var(--mut);margin-left:6px;font-weight:400}
.cn{font:10.5px var(--mono);color:var(--mut);letter-spacing:.04em}
.cb{padding:11px 14px 13px}
.badge{display:inline-block;font:10px var(--mono);letter-spacing:.06em;padding:2px 7px;
border:1px solid var(--khaki);border-radius:4px;color:var(--moss);background:#fff;vertical-align:1px}
.badge.n{color:var(--mut)}.badge.warn{border-color:var(--ember);color:var(--ember)}
.badge.ok{border-color:var(--up);color:var(--up)}
.hdr{background:linear-gradient(158deg,#FEFCF6,#FAF6E9 55%,#F7EFE2);border-top:4px solid var(--ember)}
.hdr .own{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.hdr h1{font:700 24px/1.15 var(--serif);margin:2px 0 3px;color:var(--slate)}
.hdr .meta{font:11.5px var(--mono);color:var(--mut)}
.hdr .val{font:700 32px/1.1 var(--mono);color:var(--slate);margin-top:9px;letter-spacing:-.02em}
.hdr .val small{font:11px var(--mono);color:var(--mut);margin-left:6px;font-weight:400;letter-spacing:0}
.rul{font:14.5px/1.5 var(--serif);color:var(--ink)}
.rul b{color:var(--slate)}
.rul p{margin:0 0 7px}.rul p:last-child{margin:0}
.proj{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 4px}
.pj{background:var(--ivory);border-radius:8px;padding:9px 6px;text-align:center;border-top:2px solid var(--sage)}
.pj b{display:block;font:600 16px var(--mono);color:var(--slate);line-height:1.15}
.pj i{display:block;font:10px var(--mono);color:var(--mut);font-style:normal;margin-top:3px}
.pj.hi{border-top-color:var(--ember)}
.seg{display:flex;background:var(--ivory);border-radius:8px;padding:3px;margin:8px 0 2px}
.seg span{flex:1;text-align:center;font:11.5px var(--mono);padding:6px 4px;border-radius:6px;color:var(--mut);cursor:pointer}
.seg span.on{background:var(--ember);color:#fff}
.note{font:11px var(--mono);color:var(--mut);margin:7px 0 0;line-height:1.45}
.alloc{display:flex;gap:12px;align-items:center}
.donut{flex:0 0 118px}
.donut svg{width:118px;height:118px;display:block}
.legend{flex:1;min-width:0}
.line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ivory)}
.line:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.line .l{flex:1;min-width:0}
.line .l b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .l i{display:block;font:10px var(--mono);color:var(--mut);font-style:normal}
.line .r{text-align:right;flex-shrink:0;font:var(--mono)}
.line .r b{display:block;font:600 13.5px var(--mono)}
.line .r i{display:block;font:10px var(--mono);color:var(--mut);font-style:normal}
.up{color:var(--up)}.dn{color:var(--dn)}
.pa{border-bottom:1px solid var(--ivory);padding:9px 0}.pa:last-child{border-bottom:none}
.pa .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.pa .h b{font:600 14px var(--serif)}.pa .h span{font:10.5px var(--mono);color:var(--mut)}
.spark{display:flex;gap:2px;align-items:flex-end;height:34px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.spark i.u{background:var(--up);opacity:.85}.spark i.d{background:var(--dn);opacity:.85}
.yrl{display:flex;gap:2px;margin-top:2px}.yrl i{flex:1;font:8px var(--mono);color:var(--mut);text-align:center;font-style:normal}
.kpi{display:flex;gap:5px;margin-top:6px}
.kpi span{flex:1;font:10px var(--mono);color:var(--mut);background:var(--ivory);border-radius:6px;padding:4px 4px;text-align:center}
.kpi span b{display:block;font:600 12.5px var(--mono);color:var(--ink)}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
th{text-align:left;font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
border-bottom:1.5px solid var(--khaki);padding:5px 4px}
td{padding:6px 4px;border-bottom:1px solid var(--ivory)}td.n,th.n{text-align:right}
tr.tot td{border-top:2px solid var(--khaki);border-bottom:none;font-weight:600}
.sug{border-left:3px solid var(--sage);background:var(--ivory);padding:9px 11px;border-radius:0 8px 8px 0;margin-bottom:8px;font-size:13px}
.sug.warn{border-left-color:var(--ember);background:#FFF6F2}.sug.info{border-left-color:var(--khaki)}
.sug b{display:block;font:600 13px var(--serif);color:var(--slate);margin-bottom:2px}.sug.warn b{color:var(--ember)}
.rb{display:flex;justify-content:space-between;align-items:center;font:12.5px var(--mono);padding:6px 0;border-bottom:1px solid var(--ivory)}
.rb:last-child{border-bottom:none}.rb .a{color:var(--mut);font-size:11.5px}
.ev{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--ivory);font-size:13px}
.ev:last-child{border-bottom:none}.ev .d{font:11px var(--mono);color:var(--mut);flex:0 0 58px}

.bld .row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--ivory)}
.bld .row:last-child{border-bottom:none}
.bld .nm{flex:1;min-width:0}.bld .nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bld .nm i{display:block;font:10px var(--mono);color:var(--mut);font-style:normal}
.stp{display:flex;align-items:center;gap:3px;flex-shrink:0}
.stp button{width:28px;height:28px;border:1px solid var(--khaki);background:#fff;border-radius:6px;font:600 14px var(--mono);color:var(--slate);padding:0}
.stp input{width:44px;height:28px;border:1px solid var(--khaki);border-radius:6px;text-align:center;font:600 13px var(--mono);color:var(--slate);padding:0;-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button{display:none}
.x{width:26px;height:26px;border:none;background:none;color:var(--dn);font:16px var(--mono);padding:0;flex-shrink:0}
.pick{display:flex;gap:6px;margin-top:9px}
.pick select,.pick button,.fld input{height:34px;border:1px solid var(--khaki);border-radius:7px;font:12.5px var(--mono);background:#fff;color:var(--ink);padding:0 8px}
.pick select{flex:1;min-width:0}.pick button{background:var(--ember);color:#fff;border-color:var(--ember);padding:0 12px;font-weight:600}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.fld label{font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:3px}
.fld input{width:100%}
.tpl{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.tpl::-webkit-scrollbar{display:none}
.tpl span{flex:0 0 auto;font:11px var(--mono);padding:5px 9px;border:1px solid var(--khaki);border-radius:14px;color:var(--moss);background:#fff;white-space:nowrap}
.tpl span.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.own2{display:flex;gap:5px}.own2 span{flex:1;text-align:center;font:600 12px var(--mono);padding:6px;border:1px solid var(--khaki);border-radius:7px;color:var(--mut);background:#fff}
.own2 span.on{border-color:var(--ember);color:var(--ember)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:12px var(--mono)}
.sum button{height:28px;border:1px solid var(--khaki);border-radius:6px;background:#fff;font:11px var(--mono);color:var(--slate);padding:0 10px}
.io textarea{width:100%;height:70px;font:10.5px var(--mono);border:1px solid var(--khaki);border-radius:7px;padding:6px;margin-top:6px;resize:vertical}
.sgl{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.sgl span{font:11px var(--mono);padding:4px 8px;border:1px solid var(--khaki);border-radius:12px;background:#fff;color:var(--slate)}.sgl span i{color:var(--mut);font-style:normal}

    <p class="note">${hi.length?`Above 0.7: ${hi.join(' · ')}. Those move together — holding both is one position sized twice.`:'No pair above 0.7. The lines genuinely diversify each other.'} Independent bets = 1/HHI adjusted for average correlation.</p>`);}
function suggestions(){const O=[],M=measured(),t=total();const tot=M.reduce((a,l)=>a+l.w*st(l.t).geo,0);
  if(S.lines.length&&Math.abs(t-1)>.005)O.push({t:'warn',h:`Weights sum to ${pct(t)}`,b:'Normalize or Equal-weight. Nothing above is reliable until this is 100%.'});
  const um=S.lines.filter(l=>!st(l.t));if(um.length)O.push({t:'warn',h:`${um.map(l=>l.t).join(', ')} unmeasured`,b:`No 10-year series yet — run pull_history.py and they light up. Excluded from every statistic; the projection covers only the measured ${pct(M.reduce((a,l)=>a+l.w,0)/(t||1))}.`});
  M.forEach(l=>{const x=st(l.t),sh=tot>0?l.w*x.geo/tot:0;if(l.w>=.1&&sh<l.w*.5)O.push({t:'warn',h:`${U(l.t).label} isn't earning its weight`,b:`${pct(l.w)} of the book, ${pct(sh)} of the return. ${pp1(x.geo)}/yr, ${pct(Math.abs(x.mdd))} drawdown.`});});
  const held=M.filter(l=>st(l.t).years['2022']>0).map(l=>U(l.t).label);if(M.length)O.push({t:held.length?'ok':'warn',h:'2022 stress test',b:held.length?`Only ${held.join(', ')} rose when equity fell.`:'Every measured line fell together.'});
  S.lines.forEach(l=>{const u=U(l.t);if(u.cls==='bond'&&u.tax>.125)O.push({t:'warn',h:`${l.t} taxed at 26%`,b:'Mostly corporate. IEGA or a BTP ladder is 12.5% on the qualifying share.'});
    const x=st(l.t);if(x&&x.mdd<-.5)O.push({t:'info',h:`${u.label} capped where a wipeout is survivable`,b:`Max DD ${pct(Math.abs(x.mdd))}. At ${pct(l.w)} that's ${eur(S.capital*l.w*Math.abs(x.mdd))}.`});});
  const stocks=S.lines.filter(l=>U(l.t).cls==='stock');const big=stocks.filter(l=>l.w>.05);
  if(big.length)O.push({t:'warn',h:`${big.map(l=>l.t).join(', ')} above 5% single-name cap`,b:'Position rule: max 5% per name. Trim or add names.'});
  const off=S.lines.filter(l=>U(l.t).offsettable).reduce((a,l)=>a+l.w,0);if(S.lines.length)O.push({t:off<.15?'warn':'info',h:'Loss-offset capacity',b:`${pct(off)} is redditi diversi (stocks, ETCs, bonds held direct) — the only gains minusvalenze can shelter. ETF gains cannot be offset.`});
  if(S.target>S.capital){const m=.08/12,n=S.target_years*12,fv=project(S.capital,.08,n,0);const mo=fv>=S.target?0:(S.target-fv)*m/(Math.pow(1+m,n)-1);O.push({t:'ok',h:`Reaching ${eur(S.target)} in ${S.target_years} yr`,b:`Needs ${pp1(Math.pow(S.target/S.capital,1/S.target_years)-1)}/yr on returns alone; <b>${eur(mo)}/month</b> gets there at 8%.`});}
  return O;}
function ruling(b){if(!S.lines.length)return '<p><b>Empty.</b> Search a ticker below to start.</p>';if(!b)return '<p><b>Nothing measured yet.</b> None of these lines has a series. Run the history pull, or add VWCE / AGGH / SGLD / BTCE to see numbers now.</p>';
  const M=measured(),tot=M.reduce((a,l)=>a+l.w*st(l.t).geo,0),drag=M.filter(l=>l.w>=.1&&l.w*st(l.t).geo/tot<l.w*.5),held=M.filter(l=>st(l.t).years['2022']>0);const e=st('VWCE');
  return `<p><b>${pp1(b.geo)} a year, geometric, on the ${pct(b.w/(total()||1))} that is measured.</b> Arithmetic ${pp1(b.arith)} — the gap is volatility drag.</p><p>${drag.length?`<b>${drag.map(l=>U(l.t).label).join(' and ')} not earning weight.</b>`:'<b>No measured line is dead weight.</b>'}</p><p>${held.length?`Only <b>${held.map(l=>U(l.t).label).join(', ')}</b> rose in 2022. `:''}${e?`A ${pct(Math.abs(e.mdd))} equity drawdown is inside this sample.`:''}</p>`;}
function render(){ensureSeries(S.lines.map(l=>l.t));const b=blended(),t=total(),P=S.capital,mo=S.monthly,e=st('VWCE');
  let h=`<div class="card hdr"><div class="cb"><div class="own">${NAME[PROFILE]} · profile ${PROFILE}</div><h1>${S.name}</h1><div class="meta">${S.id?'saved':'unsaved'} · ${ONLINE.msg}${mo?` · +${eur(mo)}/mo`:''}</div><div class="val">${eur(P)}<small>CAPITAL</small></div></div></div>`;
  h+=card('Build','any ticker · any mix',`<span class="badge ${Math.abs(t-1)<.005?'ok':'warn'}">Σ ${pct(t)}</span>`,
   `<div class="tpl">${DATA.templates.map(x=>`<span class="${TPL===x.id?'on':''}" onclick="load(DATA.templates.find(q=>q.id==='${x.id}'))">${x.confirmed?'✓ ':''}${x.name}</span>`).join('')}<span onclick="load(null)">+ blank</span></div>
    <div class="pick" style="position:relative"><input id="q" placeholder="Search ticker or name — AAPL, GOOG, ENEL.MI, VWCE…" oninput="sugg()" onkeydown="if(event.key==='Enter')add()" style="flex:1;height:34px;border:1px solid var(--khaki);border-radius:7px;font:12.5px var(--mono);padding:0 8px"><button onclick="add()">Add</button></div><div id="sg" class="sgl"></div>
    <div class="fld"><div><label>Name</label><input value="${S.name}" onchange="setf('name',this.value)"></div><div><label>Capital €</label><input type="number" inputmode="numeric" value="${P}" onchange="setf('capital',this.value)"></div><div><label>Monthly €</label><input type="number" inputmode="numeric" value="${mo}" onchange="setf('monthly',this.value)"></div><div><label>Target € / yrs</label><div style="display:flex;gap:4px"><input type="number" inputmode="numeric" value="${S.target||''}" placeholder="—" onchange="setf('target',this.value)"><input type="number" inputmode="numeric" value="${S.target_years}" style="width:52px" onchange="setf('target_years',this.value)"></div></div></div>
    <div class="bld" style="margin-top:8px">${S.lines.map((l,i)=>{const u=U(l.t),x=st(l.t);return `<div class="row"><span class="dot" style="background:${COL[u.cls]}"></span><div class="nm"><b>${l.t}</b><i>${u.label} · ${pct(u.tax)}${x?` · geo ${pp1(x.geo)}`:' · <span style="color:var(--ember)">unmeasured</span>'}</i></div><div class="stp"><button onclick="bump(${i},-5)">−</button><input type="number" inputmode="numeric" value="${Math.round(l.w*100)}" onchange="setw(${i},this.value)"><button onclick="bump(${i},5)">+</button></div><button class="x" onclick="rm(${i})">×</button></div>`;}).join('')||'<p class="note">No lines yet.</p>'}</div>
    <div class="sum"><span>${S.lines.length} lines · measured ${pct(measured().reduce((a,l)=>a+l.w,0)/(t||1))}</span><span><button onclick="eq()">Equal</button> <button onclick="norm()">Normalize</button></span></div>`);
  h+=card('✦ Ruling','executive summary',b?`<span class="badge n">n=${e?e.n:'?'}y</span>`:'<span class="badge warn">unmeasured</span>',`<div class="rul">${ruling(b)}</div>`);
  if(b){const r=b.geo;h+=card('If you continue like this','',`<span class="badge">${pp1(r)}/yr</span>`,`<div class="seg">${[0,150,300].map(v=>`<span class="${v===mo?'on':''}" onclick="setf('monthly',${v})">€${v}/mo</span>`).join('')}</div><div class="proj">${[[12,'12 MO'],[36,'3 YR'],[60,'5 YR']].map(([m,l])=>`<div class="pj ${m===60?'hi':''}"><b>${eur(project(P,r,m,mo))}</b><i>${l}</i></div>`).join('')}</div><div class="proj" style="grid-template-columns:1fr 1fr"><div class="pj"><b>${eur(project(P,r,120,mo))}</b><i>10 YR</i></div><div class="pj"><b>${eur(project(P,r,120,mo)-P-mo*120)}</b><i>OF WHICH GROWTH</i></div></div><p class="note">Geometric rate on the measured share; a ${e?pct(Math.abs(e.mdd)):'—'} equity year is inside the sample.</p>`);}
  h+=card('Allocation','',`<span class="badge n">${S.lines.length} lines</span>`,`<div class="alloc"><div class="donut">${donut()}</div><div class="legend">${S.lines.map(l=>{const u=U(l.t);return `<div class="line"><span class="dot" style="background:${COL[u.cls]}"></span><div class="l"><b>${l.t}</b><i>${u.label}</i></div><div class="r"><b>${pct(l.w)}</b><i>${eur(P*l.w)}</i></div></div>`;}).join('')||'<p class="note">Empty.</p>'}</div></div>`);
  h+=corrCard();
  const M=measured();if(M.length){h+=card('Performance by asset','annual %, EUR','<span class="badge n">real series</span>',M.map(l=>{const u=U(l.t),x=st(l.t),mx=Math.max(...x.ys.map(y=>Math.abs(x.years[y])));return `<div class="pa"><div class="h"><b>${l.t}</b><span>${x.ys[0].slice(2)}–${x.ys[x.n-1].slice(2)} · geo <b class="${x.geo>0?'up':'dn'}">${pp1(x.geo)}</b> <span class="badge ${x.n<N_FLOOR?'warn':'n'}">n=${x.n}</span></span></div><div class="spark">${x.ys.map(y=>{const v=x.years[y];return `<i class="${v>0?'u':'d'}" style="height:${Math.max(6,Math.abs(v)/mx*100)}%"></i>`;}).join('')}</div><div class="yrl">${x.ys.map(y=>`<i>${y.slice(2)}</i>`).join('')}</div><div class="kpi"><span>LAST<b class="${x.last>0?'up':'dn'}">${pp1(x.last)}</b></span><span>BEST 12M<b class="up">${pct(x.best)}</b></span><span>WORST 12M<b class="dn">${pct(x.worst)}</b></span><span>MAX DD<b class="dn">${pct(x.mdd)}</b></span></div></div>`;}).join(''));
   h+=card('Risk','geometry of risk','<span class="badge n">doctrine v2</span>',`<table><tr><th>Line</th><th class="n">Arith</th><th class="n">Geo</th><th class="n">Drag</th><th class="n">Vol</th></tr>${M.map(l=>{const x=st(l.t);return `<tr><td>${l.t}</td><td class="n">${pp1(x.arith)}</td><td class="n"><b>${pp1(x.geo)}</b></td><td class="n dn">−${pp1(x.drag)}</td><td class="n">${pct(x.sd)}</td></tr>`;}).join('')}</table><div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1"><table><tr><th>Drawdown</th><th class="n">To recover</th></tr>${[.1,.2,.3,.5].map(d=>`<tr><td>−${pct(d)}</td><td class="n">+${pct(d/(1-d))}</td></tr>`).join('')}</table></div><div style="flex:1.3;font-size:12.5px;padding-top:4px"><b style="font-family:var(--serif)">Geometric ≈ mean − variance/2.</b> The drag column is what volatility costs even in a flat market.</div></div>`);}
  h+=card('How to improve','',`<span class="badge n">${suggestions().length} rules</span>`,suggestions().map(s=>`<div class="sug ${s.t==='warn'?'warn':s.t==='info'?'info':''}"><b>${s.h}</b>${s.b}</div>`).join('')||'<p class="note">Add lines to get a review.</p>');
  h+=card('Confirm','save to Phoenix',`<span class="badge n">profile ${PROFILE}</span>`,`<div class="io"><div class="pick"><button onclick="confirmP()" style="flex:1.4">Confirm portfolio</button><button onclick="exportJ()" style="flex:1;background:var(--slate);border-color:var(--slate)">Export</button><button onclick="importJ()" style="flex:1;background:#fff;color:var(--slate)">Import</button></div><textarea id="io" placeholder="Confirm writes to Supabase portfolios table under your profile and puts every ticker on the 5-min lane. Export/Import passes a build between G and A."></textarea></div>`);
  const qEl=document.getElementById('q');const qv=qEl?qEl.value:'',qf=qEl&&document.activeElement===qEl;
  document.getElementById('main').innerHTML=h;
  if(qv||qf){const nq=document.getElementById('q');if(nq){nq.value=qv;if(qf){nq.focus();nq.setSelectionRange(qv.length,qv.length);}if(qv)sugg();}}}
document.getElementById('tabs').innerHTML=`<div class="tab on">Builder</div><div class="tab" style="color:var(--mut)">Profile ${PROFILE} · ${NAME[PROFILE]}</div>`;
loadPortfolios();

</script></body></html>

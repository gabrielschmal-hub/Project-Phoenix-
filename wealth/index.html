<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phoenix Wealth">
<meta name="theme-color" content="#020F1F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Phoenix Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Phoenix tokens — the same values Phoenix resolves at runtime (dark default, cream light). */
:root{
  --bg:#020F1F; --card:#071A2D; --card2:#0B2036; --line:#17344E; --line2:#2A5578; --hair:rgba(148,168,186,.09);
  --ink:#FFFFFF; --inkMed:#E8EDF2; --muted:#94A8BA; --faint:#5E748A;
  --gold:#E08A46; --onGold:#1A120B; --logo:#E8792B; --goldBg:rgba(224,138,70,.12);
  --green:#4FD08A; --greenBg:rgba(79,208,138,.12); --red:#F0736C; --redBg:rgba(240,115,108,.12);
  --amber:#E3B45F; --amberBg:rgba(227,180,95,.12); --zeroBg:rgba(148,168,186,.10);
  --navBg:rgba(2,15,31,.84); --shadow:0 1px 0 rgba(255,255,255,.02) inset;
  --c1:#E08A46; --c2:#4FD08A; --c3:#6FA8DC; --c4:#E3B45F; --c5:#B794F6; --c6:#4FC6D6; --c7:#F0736C; --c8:#94A8BA;
  --r:16px; --ease:cubic-bezier(.2,.8,.3,1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6EFE4; --card:#FFFDF9; --card2:#FAF4EB; --line:rgba(108,84,58,.17); --line2:rgba(108,84,58,.36); --hair:rgba(108,84,58,.09);
    --ink:#241A12; --inkMed:#3A2C21; --muted:#6E5D4C; --faint:#9A8672;
    --gold:#B85520; --onGold:#FFFFFF; --logo:#C2632A; --goldBg:rgba(184,85,32,.09);
    --green:#15693F; --greenBg:rgba(21,105,63,.09); --red:#A62B24; --redBg:rgba(166,43,36,.08);
    --amber:#8F6412; --amberBg:rgba(143,100,18,.10); --zeroBg:rgba(108,84,58,.07);
    --navBg:rgba(246,239,228,.88); --shadow:0 1px 18px rgba(92,70,44,.06);
    --c1:#B85520; --c2:#15693F; --c3:#2F6CA8; --c4:#8F6412; --c5:#6D46B0; --c6:#11788A; --c7:#A62B24; --c8:#6E5D4C;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6EFE4; --card:#FFFDF9; --card2:#FAF4EB; --line:rgba(108,84,58,.17); --line2:rgba(108,84,58,.36); --hair:rgba(108,84,58,.09);
  --ink:#241A12; --inkMed:#3A2C21; --muted:#6E5D4C; --faint:#9A8672;
  --gold:#B85520; --onGold:#FFFFFF; --logo:#C2632A; --goldBg:rgba(184,85,32,.09);
  --green:#15693F; --greenBg:rgba(21,105,63,.09); --red:#A62B24; --redBg:rgba(166,43,36,.08);
  --amber:#8F6412; --amberBg:rgba(143,100,18,.10); --zeroBg:rgba(108,84,58,.07);
  --navBg:rgba(246,239,228,.88); --shadow:0 1px 18px rgba(92,70,44,.06);
  --c1:#B85520; --c2:#15693F; --c3:#2F6CA8; --c4:#8F6412; --c5:#6D46B0; --c6:#11788A; --c7:#A62B24; --c8:#6E5D4C;
  color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
html,body{margin:0}
html{height:100%}
body{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1 0 auto;width:100%;overflow-x:clip}
#pxnav{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- top navigation (Phoenix nav, laid horizontally) ---------- */
#pxnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--navBg);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--hair)}
.navin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 22px;min-width:0}
.pxbrand{display:flex;align-items:center;gap:9px;flex:none;border:0;background:none;padding:0}
.pxbrand svg{width:28px;height:22px;display:block}
.pxbrand svg path{fill:var(--logo)}
.pxbrand .wm{font-size:19px;font-weight:800;letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
.pxbrand .wm span{font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:-.02em}
.pxlinks{display:flex;gap:2px;margin-left:8px;min-width:0}
.pxlinks a{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;position:relative;white-space:nowrap;transition:background .18s var(--ease),color .18s}
.pxlinks a:hover{background:rgba(128,128,128,.09);color:var(--ink)}
.pxlinks a.on{color:var(--ink);font-weight:700;background:var(--card2)}
.pxlinks a.on::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.pxlinks .ic{width:16px;height:16px;flex:none;display:block;color:var(--faint)}
.pxlinks a.on .ic{color:var(--gold)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.thsw{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(128,128,128,.11)}
.thsw button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);transition:background .18s,color .18s}
.thsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.thbtn{display:none;border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:999px;place-items:center;color:var(--muted)}
.thbtn svg{width:16px;height:16px}
.pxprof{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.pxprof .av{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--onGold);display:grid;place-items:center;font-weight:800;font-size:12px}
.pxprof .nm{font-weight:600;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pxprof .cv{color:var(--muted);font-size:10px}
/* tablets in portrait: compact chrome, everything stays in one line */
@media (max-width:1060px){
  .thsw{display:none} .thbtn{display:grid}
  .pxprof .nm,.pxprof .cv{display:none} .pxprof{padding:3px}
  .pxlinks a{padding:8px 10px}
}
@media (max-width:900px){ .navin{padding:10px 16px;gap:10px} .pxlinks{margin-left:0} .pxlinks a{gap:6px;font-size:13px;padding:8px 9px} }
/* phones: tabs move to a bottom bar, as in Phoenix */
@media (max-width:700px){
  #pxnav{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
  .navin{padding:10px 14px}
  .pxlinks{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:9;background:var(--navBg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--hair);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .pxlinks a{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;justify-content:center}
  .pxlinks a.on{background:none}
  .pxlinks a.on::after{display:none}
  .pxlinks .ic{width:20px;height:20px}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom,0px)) !important}
}
@media (max-width:370px){ .pxbrand .wm span{display:none} }

/* ---------- page ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 140px}
@media (max-width:900px){ .wrap{padding:0 16px 150px} }
.pxhead{padding:30px 0 20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pxhead .tt{flex:1;min-width:220px}
.pxhead h1{font-weight:800;letter-spacing:-.03em;font-size:30px;line-height:1.15;margin:0}
.pxhead p{margin:6px 0 0;font-size:14px;color:var(--muted)}
@media (max-width:700px){ .pxhead{padding:22px 0 16px} .pxhead h1{font-size:24px} }
.clabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.panel{margin-bottom:16px}
.big{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:8px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (max-width:600px){ .g4 .big{font-size:19px} .g4 .card{padding:13px 14px} }
.hero{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:900px){ .hero{grid-template-columns:1fr 1fr} .hero .rtacard{grid-column:1/-1;order:-1} }
.sect{margin:28px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.delta{font-size:12.5px;font-weight:700;margin-top:6px}
.up{color:var(--green)} .down{color:var(--red)}
.emo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--card2);font-size:15px;line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo.sm{width:22px;height:22px;font-size:12.5px;border-radius:7px;margin-right:8px;vertical-align:-5px}

.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;transition:border-color .18s,background .18s,transform .12s}
.btn:hover{border-color:var(--line2)} .btn:active{transform:scale(.98)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent);background:none}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:17px;line-height:1;transition:border-color .18s}
.iconbtn:hover{border-color:var(--line2)}
.fab{position:fixed;right:max(22px,calc(50vw - 538px));bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:7;padding:12px 20px !important;box-shadow:0 10px 28px rgba(0,0,0,.25)}

/* ready to assign — the loud element */
.rtacard{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);transition:background .3s var(--ease)}
.rtacard .amt{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.rtacard.pos{background:var(--greenBg);border-color:color-mix(in srgb,var(--green) 30%,transparent)} .rtacard.pos .amt{color:var(--green)}
.rtacard.neg{background:var(--redBg);border-color:color-mix(in srgb,var(--red) 30%,transparent)} .rtacard.neg .amt{color:var(--red)}
.rtacard .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:700px){ .rtacard .amt{font-size:32px} }
.rtabar{margin-bottom:18px}

.monthsw{display:flex;align-items:center;gap:8px}
.monthsw .lbl{font-weight:700;font-size:15px;min-width:128px;text-align:center}

/* ---------- budget: one card per group ---------- */
.bcols,.ghead,.crow{display:grid;grid-template-columns:minmax(0,1fr) 112px 104px 112px;align-items:center;gap:12px}
.bcols{padding:0 18px 8px}
.bcols>span:not(:first-child),.ghead>span:not(:first-child),.crow>.num{text-align:right}
.bgroup{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.ghead{padding:13px 18px 11px;font-size:13px}
.ghead .gname{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-weight:700;font-size:14.5px;text-align:left;letter-spacing:-.01em}
.ghead .gname i{font-style:normal;color:var(--faint);font-size:9px;width:10px;transition:transform .2s var(--ease)}
.ghead .gname[aria-expanded="false"] i{transform:rotate(-90deg)}
.ghead>span{color:var(--muted);font-weight:600}
.gtools{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px}
.crow{padding:11px 18px;position:relative;transition:background .15s}
.crow::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--hair)}
.crow:hover{background:color-mix(in srgb,var(--card2) 60%,transparent)}
.cname{min-width:0;display:flex;gap:11px;align-items:flex-start}
.cname .ctext{min-width:0;flex:1}
.cname button.cn{border:0;background:none;padding:0;text-align:left;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:28px}
.cname .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.bar{height:4px;border-radius:2px;background:var(--zeroBg);margin:5px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .4s var(--ease)}
.assign-in{width:100%;text-align:right;border:1px solid transparent;background:var(--card2);border-radius:10px;padding:7px 10px;transition:border-color .15s,background .15s}
.assign-in:hover{border-color:var(--line)}
.assign-in:focus{border-color:var(--gold);background:var(--card);outline:none}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap}
.chip.pos{background:var(--greenBg);color:var(--green)}
.chip.warn{background:var(--amberBg);color:var(--amber)}
.chip.neg{background:var(--redBg);color:var(--red)}
.chip.zero{background:var(--zeroBg);color:var(--muted)}
.chip.gold{background:var(--goldBg);color:var(--gold)}
@media (max-width:760px){
  .bcols,.ghead,.crow{grid-template-columns:minmax(0,1fr) 88px 96px;gap:8px}
  .col-act{display:none}
  .crow,.ghead{padding-left:14px;padding-right:14px} .bcols{padding:0 14px 8px}
  .crow::before{left:14px;right:14px}
  .cname .emo{display:none}
}

/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;background:none;border:0;text-align:left;position:relative;transition:background .15s}
.li+.li::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--hair)}
button.li:hover{background:var(--card2)}
.li .grow1{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dayhd{padding:14px 18px 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dayhd+.li::before{display:none}
.amt-pos{color:var(--green);font-weight:700;white-space:nowrap}
.amt-neg{color:var(--ink);font-weight:700;white-space:nowrap}
.clr{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);background:none;flex:none;transition:background .15s}
.clr.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.acctic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--gold);flex:none}
.acctic svg{width:17px;height:17px}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(1,8,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@media (min-width:701px){.overlay{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .24s var(--ease)}
.sheet.wide{max-width:760px}
@media (min-width:701px){.sheet{border-radius:20px}}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion: reduce){ .overlay,.sheet{animation:none} *{transition:none !important} }
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.sheet h3{font-size:14px;font-weight:700;margin:0 0 8px}
.sheet .panel{background:var(--card2);box-shadow:none;border-color:var(--hair)}
label.f{display:block;margin-bottom:12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px;color:var(--ink);letter-spacing:0;text-transform:none;font-weight:500;transition:border-color .15s}
label.f textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:110px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--gold);outline:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){ .f2{grid-template-columns:1fr} }
.seg{display:flex;background:var(--card2);border:1px solid var(--hair);border-radius:999px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:999px;font-weight:600;color:var(--muted);font-size:13px;transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin:4px 0 14px}
.emogrid button{border:1px solid transparent;background:var(--card2);border-radius:10px;height:38px;font-size:18px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emogrid button[aria-pressed="true"]{border-color:var(--gold);background:var(--goldBg)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:26px 16px;text-align:center;background:var(--card2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--gold);background:var(--goldBg)}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td{padding:6px 8px;border-bottom:1px solid var(--hair);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.ptable td.n{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-weight:600;max-width:90vw;font-size:13.5px;animation:rise .2s var(--ease)}
.banner{border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:13.5px;background:var(--amberBg);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent)}
.banner.gold{background:var(--goldBg);border-color:color-mix(in srgb,var(--gold) 28%,transparent)}

.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}

.mobemo{display:none}

/* save state */

<script>
"use strict";
/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const mk = d => d.slice(0, 7);
const curMonth = () => mk(today());
function addMonths(m, n){ let [y, mo] = m.split("-").map(Number); mo += n; while (mo > 12){mo -= 12; y++;} while (mo < 1){mo += 12; y--;} return `${y}-${pad(mo)}`; }
function monthsBetween(a, b){ const out = []; let m = a; while (m <= b){ out.push(m); m = addMonths(m, 1); } return out; }
const locale = () => (navigator.language || "en-GB");
function monthLabel(m, short){ const [y, mo] = m.split("-").map(Number); return new Date(y, mo-1, 1).toLocaleDateString(locale(), short ? {month:"short"} : {month:"long", year:"numeric"}); }
function dateLabel(d){ const [y, m, dd] = d.split("-").map(Number); return new Date(y, m-1, dd).toLocaleDateString(locale(), {day:"numeric", month:"short", year: y === new Date().getFullYear() ? undefined : "numeric"}); }
function money(c){ const cur = S.meta?.settings?.currency || "EUR"; return new Intl.NumberFormat(locale(), {style:"currency", currency:cur}).format((c||0)/100); }
function plain(c){ return ((c||0)/100).toLocaleString(locale(), {minimumFractionDigits:2, maximumFractionDigits:2}); }
function parseAmount(s){
  s = String(s ?? "").trim().replace(/[^\d.,-]/g, "");
  if (!s || s === "-") return 0;
  const neg = s.startsWith("-"); s = s.replace(/-/g, "");
  const dec = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  let int = s, frac = "";
  if (dec > -1 && s.length - dec - 1 <= 2){ int = s.slice(0, dec); frac = s.slice(dec+1); }
  int = int.replace(/[.,]/g, "");
  const v = Math.round(parseFloat((int || "0") + "." + (frac || "0")) * 100);
  return isNaN(v) ? 0 : (neg ? -v : v);
}
function toast(msg){ document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const PALETTE = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];

/* ---------------- state ---------------- */
const S = {
  meta: null,           // {settings, accounts, groups, cats}
  assign: {},           // { 'YYYY-MM': { catId: cents } }
  tx: {},               // { 'YYYY-MM': [txn] }
  view: "overview", month: curMonth(), account: null, collapsed: {}, editCats: false,
  report: "spending", period: "1", mode: "loading", userName: ""
};
const TEMPLATE = [
  ["Bills", [["Rent or mortgage","🏠"], ["Electricity","⚡"], ["Internet","🌐"], ["Phone","📱"], ["Subscriptions","🔁"]]],
  ["Everyday", [["Groceries","🛒"], ["Eating out","🍽️"], ["Transport","🚇"], ["Shopping","🛍️"], ["Personal care","💇"]]],
  ["Goals", [["Emergency fund","🛟"], ["Vacation","✈️"], ["Gifts","🎁"]]]
];

/* ---------------- persistence: one storage adapter, two homes ----------------
   Inside claude.ai → the artifact's private per-person store (data/users/<id>/…).
   Anywhere else (the Vercel site) → the Phoenix Wealth Supabase project, table
   wealth_docs, where row-level security lets each signed-in person reach only
   their own rows. Same documents in both: meta, assign, tx-YYYY-MM. */
const SUPA = { url: "https://jbhhgxgkypjotyaqehzu.supabase.co", key: "sb_publishable_JFQf-suKuonfKYTAyFMsrA_puiJI2Sz", authKey: "phoenix.wealth.auth" };
let BACKEND = null, DB = null, UID = null, session = null;
const dirty = new Set(), inflight = new Set(); let flushTimer = null;
function col(){ return DB.collection("data/users/" + UID); }
function docBody(id){
  if (id === "meta") return { v: 1, ...S.meta };
  if (id === "assign") return { months: S.assign };
  if (id === "moves") return { list: S.moves || [] };
  if (id.startsWith("tx-")) return { list: S.tx[id.slice(3)] || [] };
}
function save(...ids){
  ids.forEach(id => dirty.add(id));
  renderSaveState();
  if (S.mode !== "cloud") return;
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 2500);
}

/* ---- Supabase (REST only, like Phoenix) ---- */
function loadSession(){ try { session = JSON.parse(localStorage.getItem(SUPA.authKey) || "null"); } catch(_) { session = null; } }
function storeSession(s){ session = s; try { s ? localStorage.setItem(SUPA.authKey, JSON.stringify(s)) : localStorage.removeItem(SUPA.authKey); } catch(_) {} }
async function supaAuth(path, body, method = "POST", token){
  const h = { apikey: SUPA.key, "Content-Type": "application/json" }; if (token) h.Authorization = "Bearer " + token;
  const r = await fetch(SUPA.url + "/auth/v1/" + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok){ const e = new Error(j.msg || j.error_description || j.message || ("Sign-in service error " + r.status)); e.status = r.status; throw e; }
  return j;
}
function acceptSession(j){
  if (!j || !j.access_token) return false;
  storeSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now()/1000) + Number(j.expires_in || 3600), email: (j.user && j.user.email) || session?.email || "", uid: (j.user && j.user.id) || session?.uid || "" });
  return true;
}
async function freshToken(){
  if (!session) throw Object.assign(new Error("signed out"), { status: 401 });
  if (session.expires_at - 60 > Date.now()/1000) return session.access_token;
  try { acceptSession(await supaAuth("token?grant_type=refresh_token", { refresh_token: session.refresh_token })); }
  catch(e){ if (e.status >= 400 && e.status < 500){ storeSession(null); } throw e; }
  return session.access_token;
}
async function rest(method, q, body, extra = {}){
  const t = await freshToken();
  const r = await fetch(SUPA.url + "/rest/v1/wealth_docs" + q, { method, headers: { apikey: SUPA.key, Authorization: "Bearer " + t, "Content-Type": "application/json", ...extra }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401){ storeSession(null); throw Object.assign(new Error("signed out"), { status: 401 }); }
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw Object.assign(new Error(j.message || ("HTTP " + r.status)), { status: r.status, code: j.code }); }
  if (r.status === 204 || r.status === 201) return null;
  return r.json().catch(() => null);
}
async function amAllowed(){
  const t = await freshToken();
  const r = await fetch(SUPA.url + "/rest/v1/rpc/wealth_am_i_allowed", { method: "POST", headers: { apikey: SUPA.key, Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: "{}" });
  if (!r.ok) return true;          // the database still enforces it on every read and write
  return (await r.json()) === true;
}
async function supaLoad(){
  if (!S.allowChecked){ const ok = await amAllowed(); if (!ok){ const em = session?.email; storeSession(null); S.authMsg = `${em || "This account"} isn't on the Phoenix Wealth access list yet.`; throw Object.assign(new Error("not allowed"), { status: 401 }); } S.allowChecked = true; }
  const rows = await rest("GET", "?select=doc_id,body");
  applyDocs((rows || []).map(r => ({ id: r.doc_id, data: r.body })), true);
}

/* ---- one write path for both homes ---- */
async function writeDoc(id, body){
  if (BACKEND === "claude"){ const ref = col().doc(id); return body ? ref.set(body) : ref.delete(); }
  if (BACKEND === "supabase"){
    if (body) return rest("POST", "?on_conflict=user_id,doc_id", [{ user_id: session.uid, doc_id: id, body }], { Prefer: "resolution=merge-duplicates,return=minimal" });
    return rest("DELETE", "?doc_id=eq." + encodeURIComponent(id), null, { Prefer: "return=minimal" });
  }
}
async function flush(){
  for (const id of [...dirty]){
    if (inflight.has(id)) continue;
    dirty.delete(id); inflight.add(id); renderSaveState();
    const body = docBody(id);
    try { await writeDoc(id, id.startsWith("tx-") && !body.list.length ? null : body); }
    catch (e) {
      dirty.add(id);
      if (e && e.status === 401){ dirty.clear(); S.mode = "auth"; render(); toast("Your session ended. Sign in again to keep saving."); return; }
      if (e && (e.code === "quota_exceeded" || e.code === "23514")) { toast("That month holds too much data to save. Export and split it."); dirty.delete(id); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked")) { toast("Changes can't be saved with your current access."); dirty.clear(); }
      else toast("Couldn't save — retrying.");
    } finally { inflight.delete(id); }
  }
  if (dirty.size) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500); }
  renderSaveState();
}
function applyDocs(docs, definitive){
  const seen = new Set();
  docs.forEach(d => {
    seen.add(d.id);
    if (dirty.has(d.id) || inflight.has(d.id)) return;
    const v = d.data; if (!v) return;
    if (d.id === "meta"){ const {v: _v, ...rest} = v; S.meta = JSON.parse(JSON.stringify(rest)); }
    else if (d.id === "assign") S.assign = JSON.parse(JSON.stringify(v.months || {}));
    else if (d.id === "moves") S.moves = JSON.parse(JSON.stringify(v.list || []));
    else if (d.id.startsWith("tx-")) S.tx[d.id.slice(3)] = JSON.parse(JSON.stringify(v.list || []));
  });
  if (definitive){
    Object.keys(S.tx).forEach(m => { const id = "tx-" + m; if (!seen.has(id) && !dirty.has(id) && !inflight.has(id)) delete S.tx[m]; });
    if (!seen.has("meta") && !dirty.has("meta") && !inflight.has("meta")) S.meta = null;
  }
  invalidate(); render();
}
async function wipeAll(){
  const ids = ["meta", "assign", "moves", ...Object.keys(S.tx).map(m => "tx-" + m)];
  if (BACKEND === "supabase") return rest("DELETE", "?user_id=eq." + encodeURIComponent(session.uid), null, { Prefer: "return=minimal" });
  if (BACKEND === "claude") return Promise.all(ids.map(id => col().doc(id).delete()));
}

/* ---- boot ---- */
async function boot(){
  render();
  const inClaude = !!(window.claude && window.claude.use);
  if (!inClaude) return bootSupabase();
  let loadTimer = setTimeout(() => { if (S.mode === "loading"){ S.mode = "unreachable"; render(); } }, 10000);
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) throw 0;
    const id = await user.id(); if (!id) throw 0;
    DB = db; UID = id; BACKEND = "claude";
    try { S.userName = (await user.name()) || ""; } catch(_) {}
    col().onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(loadTimer);
      if (S.mode === "loading" || S.mode === "unreachable") S.mode = "cloud";
      applyDocs(snap.docs.map(d => ({ id: d.id, data: d.data() })), !snap.metadata.fromCache);
    }, err => { clearTimeout(loadTimer); S.mode = S.mode === "cloud" && !(err && err.code === "revoked") ? "cloud" : "local"; render(); });
  } catch (_) { clearTimeout(loadTimer); S.mode = "local"; render(); }
}
async function bootSupabase(){
  BACKEND = "supabase";
  // Returning from an e-mail link: #access_token=…&refresh_token=…&type=magiclink|signup|recovery
  const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  let recovery = false;
  if (h.get("access_token")){
    recovery = h.get("type") === "recovery";
    acceptSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in") });
    try { const u = await supaAuth("user", null, "GET", h.get("access_token")); session.email = u.email; session.uid = u.id; storeSession(session); } catch(_) {}
    history.replaceState(null, "", location.pathname + "#overview"); S.view = "overview";
  } else if (h.get("error_description")) { S.authMsg = h.get("error_description").replace(/\+/g, " "); history.replaceState(null, "", location.pathname); }
  loadSession();
  if (!session){ S.mode = "auth"; render(); return; }
  S.userName = (session.email || "").split("@")[0];
  try { await supaLoad(); S.mode = "cloud"; render(); if (recovery) openNewPasswordSheet(); }
  catch (e){ if (e.status === 401 || !session){ S.mode = "auth"; } else S.mode = S.meta ? "cloud" : "unreachable"; render(); }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && BACKEND === "supabase" && S.mode === "cloud" && !dirty.size && !inflight.size) supaLoad().catch(() => {});
  if (document.visibilityState === "hidden" && dirty.size) flush();
});

/* ---- sign-in (Supabase e-mail + password, or an e-mail link) ---- */
async function doAuth(kind){
  const email = ($("#au-email")?.value || "").trim(), pw = $("#au-pw")?.value || "";
  if (!email || !/@/.test(email)){ S.authMsg = "Enter your e-mail address."; render(); return; }
  S.authBusy = true; S.authMsg = ""; render();
  const back = location.origin + location.pathname;
  try {
    if (kind === "signin"){
      if (!pw){ throw new Error("Enter your password, or use “E-mail me a sign-in link”."); }
      acceptSession(await supaAuth("token?grant_type=password", { email, password: pw }));
      S.authBusy = false; S.userName = email.split("@")[0]; S.mode = "loading"; render();
      try { await supaLoad(); } catch(e){ S.authBusy = false; S.mode = "auth"; render(); return; }
      S.mode = "cloud"; render(); return;
    }
    if (kind === "signup"){
      if (pw.length < 8) throw new Error("Choose a password of at least 8 characters.");
      const j = await supaAuth("signup?redirect_to=" + encodeURIComponent(back), { email, password: pw });
      if (j.access_token){ acceptSession(j); S.authBusy = false; S.mode = "cloud"; S.userName = email.split("@")[0]; await supaLoad(); render(); return; }
      S.authNote = `Check ${email} and confirm your address, then sign in here.`;
    }
    if (kind === "link"){ await supaAuth("otp?redirect_to=" + encodeURIComponent(back), { email, create_user: true }); S.authNote = `We sent a sign-in link to ${email}. Open it on this device.`; }
    if (kind === "reset"){ await supaAuth("recover?redirect_to=" + encodeURIComponent(back), { email }); S.authNote = `If ${email} has an account, a reset link is on its way.`; }
  } catch (e){ S.authMsg = /invalid login/i.test(e.message) ? "That e-mail and password don't match."
    : /rate limit/i.test(e.message) ? "Too many sign-in e-mails were sent in the last hour. Please wait a little and try again — if you already have an account, sign in with your password instead."
    : /not confirmed/i.test(e.message) ? "Confirm your e-mail first: open the link we sent you, then sign in here."

/* ---------------- the budget engine ---------------- */
let CACHE = null;
function invalidate(){ CACHE = null; }
function engine(){
  if (CACHE) return CACHE;
  const byMonth = {}; // m -> {act:{cat:cents}, income, incomeReal, spendCats:{}}
  const bal = {}; const balCleared = {}; const nwByMonth = {};
  const B = m => byMonth[m] || (byMonth[m] = {act:{}, income:0, incomeReal:0});
  const add = (o, k, v) => { o[k] = (o[k] || 0) + v; };
  for (const t of allTx()){
    const m = mk(t.date), b = B(m), a = acct(t.account), x = t.xfer ? acct(t.xfer) : null;
    add(bal, t.account, t.amount); if (t.cleared) add(balCleared, t.account, t.amount);
    if (t.xfer){ add(bal, t.xfer, -t.amount); if (t.cleared) add(balCleared, t.xfer, -t.amount); }
    add(nwByMonth, m, 0);
    if (!a) continue;
    if (!t.xfer){
      if (!a.onBudget || !t.cat || t.cat === "start") continue;
      if (t.cat === "rta"){ b.income += t.amount; if (!t.start) b.incomeReal += t.amount; continue; }
      add(b.act, t.cat, t.amount);
      if (a.type === "credit"){ const cc = ccCatFor(a.id); if (cc) add(b.act, cc.id, -t.amount); }
    } else if (x){
      if (a.onBudget && x.onBudget){
        if (a.type === "credit"){ const cc = ccCatFor(a.id); if (cc) add(b.act, cc.id, -t.amount); }
        if (x.type === "credit"){ const cc = ccCatFor(x.id); if (cc) add(b.act, cc.id, t.amount); }
      } else if (a.onBudget !== x.onBudget && t.cat){
        const amt = a.onBudget ? t.amount : -t.amount;
        if (t.cat === "rta"){ b.income += amt; b.incomeReal += amt; } else add(b.act, t.cat, amt);
      }
    }
  }
  const allMonths = new Set([...Object.keys(byMonth), ...Object.keys(S.assign), curMonth()]);
  const sorted = [...allMonths].sort();
  CACHE = { byMonth, bal, balCleared, first: sorted[0], last: sorted[sorted.length-1] };
  return CACHE;
}
function budgetFor(target){
  const E = engine();
  const first = E.first < target ? E.first : target;
  const carry = {}; let overspendPrior = 0, income = 0, assignedCum = 0, lastOverspend = 0;
  let rows = {};
  for (const m of monthsBetween(first, target)){
    const b = E.byMonth[m] || {act:{}, income:0}, asg = S.assign[m] || {};
    income += b.income;
    rows = {}; lastOverspend = 0;
    for (const c of cats()){
      const assigned = asg[c.id] || 0, activity = b.act[c.id] || 0;
      assignedCum += assigned;
      const available = (carry[c.id] || 0) + assigned + activity;
      rows[c.id] = {assigned, activity, available, carryIn: carry[c.id] || 0};
    }
    if (m < target){
      for (const c of cats()){
        const av = rows[c.id].available;
        if (av < 0){ overspendPrior += -av; lastOverspend += -av; carry[c.id] = 0; } else carry[c.id] = av;
      }
    }
  }
  let future = 0;
  for (const m in S.assign) if (m > target) for (const k in S.assign[m]) if (cat(k)) future += S.assign[m][k];
  // assignments to deleted categories still count against income
  const rta = income - assignedCum - overspendPrior - future;
  const visible = cats().filter(c => !c.hidden);
  let assignedT = 0, activityT = 0, availableT = 0, underfunded = 0, overspent = [];
  for (const c of cats()){
    const r = rows[c.id]; assignedT += r.assigned; activityT += r.activity; availableT += r.available;
    r.need = needFor(c, r, target);
    underfunded += r.need;
    if (r.available < 0) overspent.push(c);
  }
  const prevOver = (() => { // overspending from the month just before target, which reduces this month's RTA
    if (target <= first) return 0;
    const p = budgetForNoRecurse(addMonths(target, -1)); return p;
  })();
  return { rows, rta, income: (E.byMonth[target]||{}).income || 0, assignedT, activityT, availableT, underfunded, overspent, future, visible, prevOver };
}
function budgetForNoRecurse(m){
  // overspending carried out of month m (cash-like overspend that comes out of Ready to assign)
  const E = engine(); const carry = {}; let over = 0;
  for (const mm of monthsBetween(E.first < m ? E.first : m, m)){
    const b = E.byMonth[mm] || {act:{}}, asg = S.assign[mm] || {}; over = 0;
    for (const c of cats()){
      const av = (carry[c.id]||0) + (asg[c.id]||0) + (b.act[c.id]||0);
      if (av < 0){ over += -av; carry[c.id] = 0; } else carry[c.id] = av;
    }
  }
  return over;
}
function chipCls(c, r){
  if (r.available < 0) return "neg";
  if (r.need > 0) return "warn";
  if (r.available === 0) return "zero";
  return "pos";
}

function barChart(labels, series, opts = {}){
  const W = Math.round(Math.min(900, Math.max(320, (document.getElementById("app").clientWidth || 640) - 40)));

  const span = (rawMax - rawMin) || 100;
  const mag = Math.pow(10, Math.floor(Math.log10(span / 4))), f = (span / 4) / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
  const min = Math.floor(rawMin / step) * step, max = Math.max(min + step, Math.ceil(rawMax / step) * step);
  const range = max - min, y = v => T + (max - v) / range * (H - T - Bm);
  const slot = (W - L - R) / n, bw = Math.min(opts.stacked ? 34 : 22, opts.stacked ? slot * 0.6 : slot * 0.72 / series.length);
  let g = "";
  for (let v = min; v <= max + step / 2; v += step){ const yy = y(v); g += `<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)" ${v === 0 ? "" : 'stroke-dasharray="2 4"'}/><text x="${L-6}" y="${(yy+4).toFixed(1)}" text-anchor="end">${esc(compact(v))}</text>`; }
  labels.forEach((lb, i) => {
    const x0 = L + slot * i + (slot - (opts.stacked ? bw : bw * series.length)) / 2;
    series.forEach((s, j) => { const v = s.v[i], x = opts.stacked ? x0 : x0 + j * bw, y1 = y(Math.max(0, v)), y2 = y(Math.min(0, v)); g += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(1, bw-2).toFixed(1)}" height="${Math.max(0, y2 - y1).toFixed(1)}" rx="3" fill="var(${s.c})"><title>${esc(s.n)} ${esc(lb)}: ${esc(money(v))}</title></rect>`; });
    if (n <= 8 || W > 560 || i % 2 === (n - 1) % 2) g += `<text x="${(L + slot * i + slot/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  if (opts.line){ const pts = opts.line.map((v, i) => [(L + slot*i + slot/2).toFixed(1), y(v).toFixed(1)]); g += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--gold)" stroke-width="2"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--gold)"/>`).join(""); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Chart">${g}</svg>`;
}

/* setAssigned with a reason, so every change to an assigned amount is traceable */
function setAssigned(m, cid, cents, why, other){

/* ---------------- targets ---------------- */
const TTYPES = {
  setaside: ["Set aside each month", "Assign this much every month, whatever is left over."],
  monthly:  ["Refill up to each month", "Top the category up to this amount every month."],
  balance:  ["Reach a balance", "Build up to a total and keep it there."],
  bydate:   ["Reach a balance by a date", "Spread the amount over the months until a date."]
};
function needFor(c, r, m){
  const t = c.target; if (!t || !t.amount) return 0;
  const carry = Math.max(0, r.carryIn);
  if (t.type === "setaside") return Math.max(0, t.amount - r.assigned);
  if (t.type === "monthly")  return Math.max(0, t.amount - r.assigned - carry);
  if (t.type === "balance")  return Math.max(0, t.amount - r.available);
  if (t.type === "bydate"){
    const mm = m || S.month, due = t.due || mm;
    const left = due >= mm ? monthsBetween(mm, due).length : 1;
    const remaining = Math.max(0, t.amount - carry);
    const perMonth = Math.ceil(remaining / left);
    return Math.max(0, Math.min(perMonth, t.amount - carry) - r.assigned);
  }
  return 0;
}
function targetLine(c, r){
  const t = c.target;
  if (c.ccAccount){
    const owed = -(engine().bal[c.ccAccount] || 0);
    if (r.available < 0) return {text:`Overspent ${money(-r.available)}`, cls:"neg", pct:0};
    return {text: owed > 0 ? `Balance owed ${money(owed)}` : "Card paid off", cls: owed > r.available && owed > 0 ? "warn" : "pos", pct: owed > 0 ? Math.min(1, Math.max(0, r.available) / owed) : 1};
  }
  const spentTxt = r.activity < 0 ? ` · spent ${money(-r.activity)}` : "";
  if (r.available < 0){ const had = r.assigned + Math.max(0, r.carryIn); return {text: had > 0 ? `Overspent ${money(-r.available)} · spent ${money(-r.activity)} of ${money(had)}` : `Overspent ${money(-r.available)}`, cls:"neg", pct:1, over:true}; }
  if (!t || !t.amount){
    if (r.activity < 0 && r.available === 0) return {text:"Fully spent", cls:"zero", pct:1};
    return {text: r.activity < 0 ? `Spent ${money(-r.activity)}` : "", cls:"zero", pct: null};
  }
  if (t.type === "setaside" || t.type === "monthly"){
    const got = r.assigned + (t.type === "monthly" ? Math.max(0, r.carryIn) : 0), pct = Math.min(1, got / t.amount);
    return r.need > 0 ? {text:`${money(r.need)} more needed${spentTxt}`, cls:"warn", pct} : {text:`Funded · ${money(t.amount)}/month${spentTxt}`, cls:"pos", pct:1};
  }
  if (t.type === "bydate"){
    const pct = Math.min(1, Math.max(0, r.available) / t.amount);
    if (r.available >= t.amount) return {text:`Goal reached · ${money(t.amount)}`, cls:"pos", pct:1};
    return r.need > 0 ? {text:`${money(r.need)} needed this month · ${money(t.amount)} by ${monthLabel(t.due, true)} ${t.due.slice(0,4)}`, cls:"warn", pct} : {text:`On track · ${money(t.amount)} by ${monthLabel(t.due, true)} ${t.due.slice(0,4)}`, cls:"pos", pct};
  }
  const pct = Math.min(1, Math.max(0, r.available) / t.amount);
  return r.need > 0 ? {text:`${money(r.need)} to go of ${money(t.amount)}`, cls:"warn", pct} : {text:`Goal reached · ${money(t.amount)}`, cls:"pos", pct:1};
}

/* ---------------- auto-assign: targets or past behaviour ---------------- */
const AUTO = {
  targets: ["Fund underfunded targets", "Covers what every target still needs, up to your money to assign."],
  lastAssigned: ["Assigned last month", "Repeats what you assigned to each category last month."],
  lastSpent: ["Spent last month", "Assigns what each category actually cost last month."],
  avgSpent: ["Average spent, last 3 months", "Assigns each category's average monthly spending."],
  reset: ["Reset assigned to zero", "Clears every assigned amount this month."]
};
function autoProposal(kind, m){
  const B = budgetFor(m), out = {};
  const prev = addMonths(m, -1), E = engine();
  const spentIn = (mm, cid) => Math.max(0, -((E.byMonth[mm] || {act:{}}).act[cid] || 0));
  let left = B.rta;
  for (const c of cats()){
    if (c.hidden) continue;
    const r = B.rows[c.id]; let v = null;
    if (kind === "targets"){ if (!r.need || left <= 0) continue; const give = Math.min(r.need, left); left -= give; v = r.assigned + give; }
    else if (kind === "lastAssigned"){ if (c.ccAccount) continue; v = (S.assign[prev] || {})[c.id] || 0; }
    else if (kind === "lastSpent"){ if (c.ccAccount) continue; v = spentIn(prev, c.id); }
    else if (kind === "avgSpent"){ if (c.ccAccount) continue; const ms = [1,2,3].map(k => addMonths(m, -k)); v = Math.round(ms.reduce((s, mm) => s + spentIn(mm, c.id), 0) / 3); }
    else if (kind === "reset"){ v = 0; }
    if (v !== null && v !== r.assigned) out[c.id] = { from: r.assigned, to: v };
  }
  return out;
}
function openAutoSheet(kind){
  const m = S.month; kind = kind || "targets";
  const P = autoProposal(kind, m), B = budgetFor(m);
  const delta = Object.values(P).reduce((s, x) => s + x.to - x.from, 0);
  const rows = Object.entries(P).slice(0, 60).map(([id, x]) => `<div class="li" style="padding:9px 14px">${emo(cat(id))}<span class="grow1 t">${esc(cat(id).name)}</span><span class="muted small">${money(x.from)} →</span><b>${money(x.to)}</b></div>`).join("");
  openSheet(`<h2>Assign automatically</h2><p class="muted small" style="margin-top:-6px">${esc(monthLabel(m))} · ${money(B.rta)} ready to assign</p>
    <div class="tchoices">${Object.entries(AUTO).map(([k, [l, d]]) => `<label class="tchoice"><input type="radio" name="auto" value="${k}" ${k === kind ? "checked" : ""} data-act="autoKind"><span><b>${l}</b><span class="muted small">${d}</span></span></label>`).join("")}</div>
    <div class="list" style="max-height:260px;overflow:auto;margin-top:6px">${rows || `<div class="li muted">Nothing to change for this choice.</div>`}</div>
    <div class="row between" style="margin-top:12px;flex-wrap:wrap"><span class="small">${Object.keys(P).length} categor${Object.keys(P).length === 1 ? "y" : "ies"} · ${delta >= 0 ? "assigns" : "frees"} <b>${money(Math.abs(delta))}</b></span>
      ${B.rta - delta < 0 ? `<span class="chip neg">Leaves ${money(B.rta - delta)} to assign</span>` : `<span class="chip pos">Leaves ${money(B.rta - delta)} to assign</span>`}</div>
    <div class="actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="applyAuto" data-v="${kind}" ${Object.keys(P).length ? "" : "disabled"}>Apply and save</button></div>`);
}

  const m = S.month, P = autoProposal(kind, m);
  for (const [id, x] of Object.entries(P)) setAssigned(m, id, x.to, "auto:" + kind);

  setAssigned(m, dst, ((S.assign[m] || {})[dst] || 0) + amt, why || "move", src);

function coverFrom(cid, src){

  const left = Math.max(10, Math.min(x - 20, innerWidth - w - 10)), top = y + h + 14 > innerHeight ? Math.max(10, y - h - 10) : y + 10;
  menu.style.left = left + "px"; menu.style.top = top + "px";
  menu.querySelector("button").focus({ preventScroll: true });
  if (navigator.vibrate) try { navigator.vibrate(8); } catch(_) {}
}
function closeCtxMenu(){ const m = document.querySelector(".ctxmenu"); if (m && m._row) m._row.classList.remove("pressed"); document.querySelectorAll(".ctxmenu,.ctxscrim").forEach(e => e.remove()); }
(function wirePressAndHold(){
  let timer = null, sx = 0, sy = 0, fired = false, firedAt = 0;
  const rowOf = t => t.closest && t.closest(".crow[data-cid]");
  document.addEventListener("pointerdown", e => {
    const row = rowOf(e.target); if (!row || e.target.closest("input,select") || e.button > 0) return;
    sx = e.clientX; sy = e.clientY; fired = false; row.classList.add("holding");
    timer = setTimeout(() => { fired = true; firedAt = Date.now(); row.classList.remove("holding"); openCtxMenu(row.dataset.cid, sx, sy, row); }, 480);
  });
  const cancel = () => { clearTimeout(timer); timer = null; document.querySelectorAll(".crow.holding").forEach(r => r.classList.remove("holding")); };
  document.addEventListener("pointermove", e => { if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel(); });
  document.addEventListener("pointerup", cancel); document.addEventListener("pointercancel", cancel);
  document.addEventListener("click", e => { if (fired){ fired = false; if (Date.now() - firedAt < 1500 && !e.target.closest(".ctxmenu")){ e.stopPropagation(); e.preventDefault(); } } }, true);
  document.addEventListener("contextmenu", e => { const row = rowOf(e.target); if (!row || e.target.closest("input")) return; e.preventDefault(); cancel(); fired = false; openCtxMenu(row.dataset.cid, e.clientX, e.clientY, row); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeCtxMenu(); });
  window.addEventListener("scroll", () => { const m = document.querySelector(".ctxmenu"); if (m && Date.now() - (m._t || 0) > 350) closeCtxMenu(); }, { passive: true });
})();

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act === "overlay"){ if (e.target === el) closeSheet(); return; }
  if (["search","period","repMonth","txRefresh"].includes(act)) return;
  switch (act){
    case "tab": go(v); break;
    case "theme": setTheme(v); break;
    case "setup": setup(); break;
    case "settings": openSettings(); break;
    case "cancel": closeSheet(); break;
    case "month": S.month = addMonths(S.month, Number(v)); render(); break;
    case "gotoMonth": S.month = v; if (S.view !== "budget") go("budget"); else render(); break;
    case "collapse": S.collapsed[id] = !S.collapsed[id]; render(); break;
    case "toggleEdit": S.editCats = !S.editCats; render(); break;
    case "autoAssign": autoAssign(v); break;
    case "addAccount": openAccountSheet(); break;
    case "editAcct": openAccountSheet(acct(id)); break;
    case "saveAcct": saveAccount(id); break;
    case "deleteAcct": deleteAccount(id); break;
    case "toggleClose": { const a = acct(id); a.closed = !a.closed; save("meta"); closeSheet(); render(); break; }
    case "openAcct": S.account = id; S.q = ""; S.limit = 300; render(); window.scrollTo(0,0); break;
    case "closeAcct": S.account = null; render(); break;
    case "newTx": if (!accts().length){ openAccountSheet(); break; } openTxSheet(); break;
    case "editTx": openTxSheet(findTx(id)?.t); break;
    case "txKind": TXK = v; document.querySelectorAll('[data-act="txKind"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); refreshTx(v === "in" ? "rta" : ""); break;
    case "saveTx": saveTx(id); break;
    case "deleteTx": if (confirm("Delete this transaction?")){ removeTx(id); closeSheet(); render(); } break;
    case "clear": { const f = findTx(id); if (f){ f.t.cleared = !f.t.cleared; save("tx-" + f.m); invalidate(); render(); } break; }
    case "catSheet": openCatSheet(id); break;
    case "saveCat": saveCat(id); break;
    case "moveMoney": moveMoney(id, v); break;
    case "saveNow": if (S.mode === "cloud") commit(); else toast("Preview mode: nothing is saved here"); break;
    case "autoOpen": openAutoSheet("targets"); break;
    case "autoKind": openAutoSheet(el.value); break;
    case "applyAuto": applyAuto(v); break;
    case "cover": if (S.view !== "budget"){ S.month = curMonth(); go("budget"); } openCoverSheet(id); break;
    case "coverFrom": coverFrom(id, v); break;
    case "ctxClose": closeCtxMenu(); break;
    case "ctxAddTx": case "addTxCat": closeCtxMenu(); closeSheet(); if (!accts().length){ openAccountSheet(); break; } openTxSheet(null, { cat: id }); break;
    case "ctxActivity": closeCtxMenu(); openActivitySheet(id); break;
    case "ctxMoves": closeCtxMenu(); openMovesSheet(id); break;
    case "ctxMove": closeCtxMenu(); openMoveSheet(id); break;
    case "ctxTarget": closeCtxMenu(); openTargetSheet(id); break;
    case "ctxDetails": closeCtxMenu(); openCatSheet(id); break;
    case "saveTarget": saveTarget(id); break;
    case "clearTarget": { const c = cat(id); c.target = null; save("meta"); invalidate(); closeSheet(); render(); commit("Target removed"); break; }
    case "mvDir": $("#mv-dir").value = v; document.querySelectorAll('[data-act="mvDir"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); break;
    case "hideCat": { const c = cat(id); c.hidden = !c.hidden; save("meta"); invalidate(); closeSheet(); render(); break; }
    case "deleteCat": deleteCat(id); break;
    case "moveCat": { const c = cat(id); if (moveInArray(S.meta.cats, c, Number(v), x => x.group === c.group)){ save("meta"); render(); } break; }
    case "addGroup": promptSheet("New group", "Group name", "", n => { S.meta.groups.push({id: newId(), name: n}); save("meta"); S.editCats = true; render(); }); break;
    case "renameGroup": { const g = groups().find(x => x.id === id); promptSheet("Rename group", "Group name", g.name, n => { g.name = n; save("meta"); render(); }); break; }
    case "moveGroup": { const g = groups().find(x => x.id === id); if (moveInArray(S.meta.groups, g, Number(v), () => true)){ save("meta"); render(); } break; }
    case "deleteGroup": {
      const inside = cats().filter(c => c.group === id);
      if (inside.length){ toast("Move or delete the categories in this group first"); break; }
      S.meta.groups = groups().filter(g => g.id !== id); save("meta"); render(); break;
    }
    case "addCat": promptSheet("New category", "Category name", "", n => { S.meta.cats.push({id: newId(), group: id, name: n, emoji: guessEmoji(n)}); save("meta"); invalidate(); render(); }); break;
    case "report": S.report = v; render(); break;
    case "saveSettings": { S.meta.settings.currency = $("#s-cur").value; const th = $("#s-theme").value; if (th) setTheme(th); else { try { localStorage.removeItem(PHX.themeKey); } catch(_) {} applyTheme(null); } save("meta"); closeSheet(); render(); break; }
    case "export": offerDownload("phoenix-wealth.json", JSON.stringify({meta: S.meta, assign: S.assign, tx: S.tx, moves: S.moves || []}, null, 2)); break;
    case "exportCsv": {
      const rows = [["Date","Account","Payee","Category","Memo","Amount","Cleared"]];
      allTx().sort((a,b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, acct(t.account)?.name || "", t.xfer ? `Transfer: ${acct(t.xfer)?.name || ""}` : (t.payee||""), catLabel(t), t.memo||"", (t.amount/100).toFixed(2), t.cleared ? "yes" : "no"]));
      offerDownload("phoenix-wealth-transactions.csv", rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n")); break;
    }
    case "wipe": wipe(); break;
    case "import": closeSheet(); openImport(id || (S.view === "accounts" && S.account && S.account !== "__uncat" ? S.account : null)); break;
    case "signout": signOut(); break;
    case "auth": S.authEmail = ($("#au-email")?.value || "").trim(); doAuth(v); break;
    case "pickEmoji": $("#c-emoji").value = v; document.querySelectorAll('[data-act="pickEmoji"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); break;
    case "showUncat": S.account = "__uncat"; if (S.view !== "accounts"){ location.hash = "accounts"; setTimeout(() => { S.account = "__uncat"; render(); }, 0); } else render(); window.scrollTo(0,0); break;
    case "more": S.limit = (S.limit || 300) + 300; render(); break;
    case "thtoggle": setTheme(effectiveTheme() === "dark" ? "light" : "dark"); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.assign){
    const cid = el.dataset.assign, cents = parseAmount(el.value);
    setAssigned(S.month, cid, cents); render();
    return;
  }
  const act = el.dataset.act;
  if (act === "period"){ S.period = el.value; render(); }
  else if (act === "repMonth"){ S.repMonth = el.value; render(); }
  else if (act === "txRefresh") refreshTx();
});
document.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.assign && e.key === "Enter") e.target.blur(); });
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.assign) setTimeout(() => e.target.select(), 0); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "au-pw" || e.target.id === "au-email")){ S.authEmail = ($("#au-email")?.value || "").trim(); doAuth("signin"); } });
let searchT = null;
document.addEventListener("input", e => {
  if (e.target.dataset.act === "search"){
    clearTimeout(searchT); const val = e.target.value;
    searchT = setTimeout(() => { S.q = val; const pos = e.target.selectionStart; render(); const s = document.querySelector('[data-act="search"]'); if (s){ s.focus(); s.setSelectionRange(pos, pos); } }, 200);
  }
});
window.addEventListener("beforeunload", e => { if (dirty.size || inflight.size){ flush(); e.preventDefault(); e.returnValue = ""; } });

boot();
</script>
